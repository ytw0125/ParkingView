<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0b1222" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="파킹뷰" />
<meta name="description" content="층별·구역별 실시간 주차 혼잡도와 현장 제보를 한눈에" />
<title>파킹뷰 · 층별 실시간 주차 현황</title>

<!-- Fonts / Icons / Map (모두 무료 CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>

<!-- Tailwind CSS (Play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg:    'rgb(var(--bg) / <alpha-value>)',
          card:  'rgb(var(--card) / <alpha-value>)',
          card2: 'rgb(var(--card2) / <alpha-value>)',
          ink:   'rgb(var(--ink) / <alpha-value>)',
          sub:   'rgb(var(--sub) / <alpha-value>)',
          line:  'rgb(var(--line) / <alpha-value>)',
          brand: 'rgb(var(--brand) / <alpha-value>)',
        },
        fontFamily: {
          sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', '"Apple SD Gothic Neo"', '"Noto Sans KR"', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  /* ---------- Theme tokens (슬레이트 하이브리드) ---------- */
  :root{
    --bg:241 245 249; --card:255 255 255; --card2:248 250 252;
    --ink:15 23 42; --sub:100 116 139; --line:226 232 240;
    --brand:79 124 255;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:2 6 23; --card:15 23 42; --card2:25 36 56;
    --ink:241 245 249; --sub:148 163 184; --line:40 53 76;
    --brand:110 146 255;
    color-scheme: dark;
  }
  html,body{ background:rgb(var(--bg)); color:rgb(var(--ink)); -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
  body{ font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased; }
  button,select,input{ font:inherit; color:inherit; }
  button:focus-visible,select:focus-visible,input:focus-visible{ outline:2px solid rgb(var(--brand)); outline-offset:2px; }
  .no-scrollbar::-webkit-scrollbar{ display:none } .no-scrollbar{ scrollbar-width:none }
  .tnum{ font-variant-numeric:tabular-nums; }

  /* 항상 어두운 헤더 = 하이브리드 콘셉트 */
  .hdr{
    background:
      radial-gradient(110% 90% at 0% 0%, rgba(79,124,255,.28) 0%, transparent 55%),
      radial-gradient(80% 70% at 100% 0%, rgba(16,185,129,.12) 0%, transparent 60%),
      linear-gradient(180deg,#0b1222 0%, #111b31 100%);
  }
  .card{ background:rgb(var(--card)); border:1px solid rgb(var(--line)); border-radius:22px; }
  .press{ transition:transform .12s ease, background-color .2s ease, opacity .2s; }
  .press:active{ transform:scale(.965); }

  .bar{ height:10px; border-radius:999px; background:rgb(var(--line)); overflow:hidden; }
  .bar > span{ display:block; height:100%; border-radius:inherit; transition:width .7s cubic-bezier(.2,.8,.2,1); }

  /* 타워(층 단면) — 이 앱의 시그니처 요소 */
  .tower{ display:flex; flex-direction:column; gap:4px; padding:8px 8px 6px; border-radius:16px; background:rgb(var(--card2)); border:1px solid rgb(var(--line)); position:relative; }
  .tower::before{ content:""; position:absolute; left:8px; right:8px; top:-6px; height:6px; border-radius:6px 6px 0 0; background:rgb(var(--line)); }
  .slab{ position:relative; height:22px; border-radius:7px; background:rgb(var(--line)); overflow:hidden; display:flex; align-items:center; }
  .slab > i{ position:absolute; inset:0 auto 0 0; border-radius:inherit; transition:width .7s cubic-bezier(.2,.8,.2,1); }
  .slab > b{ position:relative; z-index:1; font-size:10.5px; font-weight:800; padding-left:7px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25); }
  .slab > em{ position:relative; z-index:1; margin-left:auto; padding-right:7px; font-style:normal; font-size:10.5px; font-weight:800; color:rgb(var(--ink)); }

  .floor-rail{ position:relative; }
  .floor-rail::before{ content:""; position:absolute; left:23px; top:20px; bottom:20px; width:2px; background:repeating-linear-gradient(rgb(var(--line)) 0 6px, transparent 6px 11px); z-index:0; }
  .floor-rail > *{ position:relative; z-index:1; }

  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--c); position:relative; display:inline-block; }
  .live-dot::after{ content:""; position:absolute; inset:-4px; border-radius:50%; background:var(--c); opacity:.35; animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes ping{ 75%,100%{ transform:scale(2); opacity:0; } }

  .view{ animation:viewIn .26s ease; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }

  /* Tab bar */
  .tab-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:rgb(var(--sub)); font-size:11px; font-weight:600; position:relative; }
  .tab-btn i{ font-size:19px; transition:transform .2s; }
  .tab-btn.active{ color:rgb(var(--brand)); }
  .tab-btn.active i{ transform:translateY(-1px) scale(1.06); }
  .tab-btn.active::before{ content:""; position:absolute; top:0; width:28px; height:3px; border-radius:0 0 4px 4px; background:rgb(var(--brand)); }

  /* FAB */
  #fab{ right:max(16px, calc(50% - 240px + 16px)); bottom:calc(80px + env(safe-area-inset-bottom)); transition:all .3s cubic-bezier(.2,.8,.2,1); }
  #fab .fab-label{ max-width:220px; transition:max-width .3s, opacity .2s, margin .3s; white-space:nowrap; overflow:hidden; }
  #fab.mini .fab-label{ max-width:0; opacity:0; margin-left:0; }
  #fab .ring{ position:absolute; inset:0; border-radius:999px; box-shadow:0 0 0 0 rgba(79,124,255,.55); animation:fabPulse 2.4s infinite; }
  @keyframes fabPulse{ 0%{ box-shadow:0 0 0 0 rgba(79,124,255,.5);} 70%{ box-shadow:0 0 0 14px rgba(79,124,255,0);} 100%{ box-shadow:0 0 0 0 rgba(79,124,255,0);} }

  /* Bottom sheet */
  #sheet{ transition:transform .34s cubic-bezier(.2,.8,.2,1); }

  /* Toast */
  .toast{ animation:toastIn .3s cubic-bezier(.2,.8,.2,1); }
  .toast.out{ opacity:0; transform:translateY(-8px); transition:all .25s; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(-12px) scale(.96);} to{ opacity:1; transform:none; } }

  /* Reward */
  .reward-card{ animation:pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop{ from{ transform:scale(.6); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .coin{ animation:coin 1.1s cubic-bezier(.2,.8,.2,1); }
  @keyframes coin{ 0%{ transform:translateY(20px) rotateY(0) scale(.5);} 60%{ transform:translateY(-10px) rotateY(540deg) scale(1.1);} 100%{ transform:translateY(0) rotateY(720deg) scale(1);} }
  .confetti{ position:absolute; top:-12px; width:8px; height:13px; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); opacity:.9; } }
  .float-pt{ position:fixed; z-index:80; pointer-events:none; font-weight:900; font-size:22px; color:rgb(var(--brand)); animation:floatUp 1.1s ease-out forwards; text-shadow:0 2px 10px rgba(79,124,255,.35); }
  @keyframes floatUp{ from{ opacity:1; transform:translate(-50%,0) scale(.9);} to{ opacity:0; transform:translate(-50%,-80px) scale(1.25);} }
  .shake{ animation:shake .42s; }
  @keyframes shake{ 20%,60%{ transform:translateX(-6px);} 40%,80%{ transform:translateX(6px);} }

  mark{ background:rgba(79,124,255,.18); color:inherit; border-radius:3px; padding:0 1px; }

  /* Leaflet */
  .leaflet-container{ background:rgb(var(--card2)) !important; font-family:inherit; }
  [data-theme="dark"] .leaflet-tile{ filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6); }
  .pin-wrap{ display:flex; justify-content:center; }
  .pin{ display:inline-flex; align-items:center; gap:4px; padding:4px 8px 4px 6px; border-radius:999px; background:var(--c); color:#fff; font-weight:800; font-size:12px; box-shadow:0 4px 12px rgba(0,0,0,.25); border:2px solid #fff; white-space:nowrap; position:relative; }
  .pin::after{ content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); border:5px solid transparent; border-top-color:#fff; }
  .me-dot{ width:18px; height:18px; border-radius:50%; background:#4f7cff; border:3px solid #fff; box-shadow:0 0 0 8px rgba(79,124,255,.22); }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<body class="font-sans">
<div id="app" class="relative mx-auto max-w-[480px] min-h-[100dvh] bg-bg">
  <div id="views" class="pb-[calc(84px+env(safe-area-inset-bottom))]">

    <!-- ============ 탐색 ============ -->
    <section id="view-explore" class="view">
      <header class="hdr rounded-b-[30px] px-4 pb-4 text-white" style="padding-top:calc(env(safe-area-inset-top) + 14px)">
        <div class="flex items-center justify-between mb-3.5">
          <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-[14px] bg-brand grid place-items-center shadow-lg shadow-blue-500/30">
              <i class="fa-solid fa-square-parking text-white text-lg"></i>
            </div>
            <div>
              <h1 class="text-[19px] font-extrabold leading-tight tracking-tight">파킹뷰</h1>
              <p class="text-[11.5px] text-slate-400 leading-none mt-0.5">층별 실시간 주차 현황</p>
            </div>
          </div>
          <div class="flex gap-2">
            <button data-act="toggle-theme" class="press w-10 h-10 rounded-full bg-white/10 border border-white/10 grid place-items-center" aria-label="테마 전환"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
            <button data-act="locate" class="press w-10 h-10 rounded-full bg-white/10 border border-white/10 grid place-items-center" aria-label="현재 위치 찾기"><i class="fa-solid fa-location-crosshairs"></i></button>
          </div>
        </div>

        <div id="searchWrap" class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search"
                 placeholder="주차장, 장소 검색 (예: ㄱㄴ, 코엑스)"
                 class="w-full h-12 pl-11 pr-11 rounded-2xl bg-white text-slate-900 placeholder:text-slate-400 text-[15px] font-medium outline-none shadow-lg shadow-black/20" />
          <button id="searchClear" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full text-slate-400" aria-label="검색어 지우기"><i class="fa-solid fa-circle-xmark"></i></button>
          <div id="suggest" class="hidden absolute left-0 right-0 top-[calc(100%+8px)] z-40 bg-card text-ink rounded-2xl shadow-2xl border border-line overflow-hidden max-h-[60vh] overflow-y-auto"></div>
        </div>

        <div id="chips" class="flex gap-2 overflow-x-auto no-scrollbar mt-3 -mx-4 px-4"></div>
      </header>

      <div id="dashboard" class="px-4 pt-4 space-y-4"></div>
    </section>

    <!-- ============ 내 주변 ============ -->
    <section id="view-nearby" class="view hidden">
      <header class="px-5 pb-3 flex items-end justify-between" style="padding-top:calc(env(safe-area-inset-top) + 20px)">
        <div class="min-w-0">
          <h1 class="text-[26px] font-extrabold tracking-tight">내 주변</h1>
          <p id="nearbyRef" class="text-[13px] text-sub mt-0.5 truncate"></p>
        </div>
        <button data-act="locate-nearby" class="press h-10 px-4 rounded-full bg-brand text-white text-sm font-bold shrink-0 shadow-lg shadow-blue-500/25"><i class="fa-solid fa-location-crosshairs mr-1.5"></i>현재 위치</button>
      </header>
      <div class="px-4">
        <div class="relative isolate rounded-[26px] overflow-hidden border border-line h-[40vh] min-h-[260px]">
          <div id="map" class="absolute inset-0"></div>
          <div class="absolute left-3 bottom-3 z-[500] flex gap-1.5 bg-card/90 backdrop-blur rounded-full px-3 py-1.5 border border-line text-[11px] font-semibold" id="mapLegend"></div>
        </div>
      </div>
      <div class="px-4 mt-5 flex items-center justify-between">
        <h3 class="text-[17px] font-extrabold">가까운 주차장</h3>
        <div class="flex p-1 rounded-full bg-card2 border border-line text-[12px] font-bold" id="sortSeg">
          <button data-act="sort" data-sort="distance" class="px-3 py-1.5 rounded-full">거리순</button>
          <button data-act="sort" data-sort="available" class="px-3 py-1.5 rounded-full">여유순</button>
        </div>
      </div>
      <div id="nearbyList" class="px-4 mt-3 space-y-2.5 pb-4"></div>
    </section>

    <!-- ============ 제보하기 ============ -->
    <section id="view-report" class="view hidden">
      <header class="px-5 pb-3" style="padding-top:calc(env(safe-area-inset-top) + 20px)">
        <h1 class="text-[26px] font-extrabold tracking-tight">현장 제보</h1>
        <p class="text-[13px] text-sub mt-0.5">지금 계신 층의 상황을 한 번의 터치로 알려주세요</p>
      </header>
      <div class="px-4 space-y-4">
        <div class="rounded-[22px] p-4 flex items-center gap-3 text-white hdr">
          <div class="w-11 h-11 rounded-2xl bg-amber-400 grid place-items-center text-slate-900 shrink-0"><i class="fa-solid fa-coins"></i></div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-[15px]">제보 1회마다 +50P</p>
            <p class="text-[12px] text-slate-300" id="reportLevelHint"></p>
          </div>
        </div>
        <div class="card p-4 report-form-slot"></div>
        <div>
          <div class="flex items-end justify-between px-1 mb-2.5">
            <h3 class="text-[17px] font-extrabold">실시간 제보 피드</h3>
            <span class="text-[11.5px] text-sub">최근 3시간</span>
          </div>
          <div id="feed" class="card divide-y divide-line overflow-hidden"></div>
        </div>
      </div>
    </section>

    <!-- ============ 마이 ============ -->
    <section id="view-my" class="view hidden">
      <header class="px-5 pb-3" style="padding-top:calc(env(safe-area-inset-top) + 20px)">
        <h1 class="text-[26px] font-extrabold tracking-tight">마이</h1>
      </header>
      <div id="myContent" class="px-4 space-y-4 pb-4"></div>
    </section>
  </div>

  <!-- Floating 제보 버튼 -->
  <button id="fab" data-act="open-report" class="press fixed z-30 flex items-center h-14 pl-4 pr-5 rounded-full bg-brand text-white font-bold shadow-xl shadow-blue-600/30">
    <span class="ring"></span>
    <i class="fa-solid fa-bullhorn text-lg relative"></i>
    <span class="fab-label ml-2.5 text-[14px] relative">지금 여기 계신가요? 층별 제보</span>
  </button>

  <!-- Bottom Tab Bar -->
  <nav id="tabbar" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-40 bg-card/85 backdrop-blur-xl border-t border-line" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="grid grid-cols-4 h-[64px]">
      <button class="tab-btn press" data-tab="explore"><i class="fa-solid fa-compass"></i><span>탐색</span></button>
      <button class="tab-btn press" data-tab="nearby"><i class="fa-solid fa-location-dot"></i><span>내 주변</span></button>
      <button class="tab-btn press" data-tab="report"><i class="fa-solid fa-bullhorn"></i><span>제보하기</span></button>
      <button class="tab-btn press" data-tab="my"><i class="fa-solid fa-user"></i><span>마이</span><span id="myDot" class="hidden absolute top-2.5 right-[calc(50%-18px)] w-2 h-2 rounded-full bg-red-500"></span></button>
    </div>
  </nav>
</div>

<!-- Bottom Sheet -->
<div id="sheetBackdrop" data-act="close-sheet" class="fixed inset-0 z-50 bg-slate-950/55 opacity-0 pointer-events-none transition-opacity duration-300"></div>
<div class="fixed inset-x-0 bottom-0 z-50 flex justify-center pointer-events-none">
  <div id="sheet" class="pointer-events-auto w-full max-w-[480px] bg-card rounded-t-[28px] shadow-2xl border-t border-line" style="transform:translateY(110%)" role="dialog" aria-modal="true">
    <div class="sheet-handle pt-2.5 pb-2 flex justify-center cursor-grab"><div class="w-10 h-1.5 rounded-full bg-line"></div></div>
    <div id="sheetBody" class="px-5 pb-[calc(20px+env(safe-area-inset-bottom))] max-h-[82dvh] overflow-y-auto"></div>
  </div>
</div>

<!-- Reward overlay -->
<div id="reward" data-act="close-reward" class="fixed inset-0 z-[70] hidden place-items-center bg-slate-950/60 backdrop-blur-sm px-8 overflow-hidden"></div>

<!-- Toasts -->
<div id="toasts" class="fixed left-1/2 -translate-x-1/2 z-[90] w-full max-w-[480px] px-4 flex flex-col items-center gap-2 pointer-events-none" style="top:calc(env(safe-area-inset-top) + 12px)"></div>

<script>
'use strict';
/* =====================================================================
 * 1) CONFIG — 백엔드 전환 스위치
 *    DATA_SOURCE 를 'public' 또는 'supabase' 로 바꾸고 키만 채우면
 *    DataService 가 해당 소스에서 데이터를 가져오도록 설계되어 있습니다.
 * ===================================================================== */
const CONFIG = {
  APP_NAME: '파킹뷰',
  DATA_SOURCE: 'hybrid',          // 'mock' | 'hybrid'(데모 + 서울시 실시간) | 'public' | 'supabase'

  // Cloudflare Worker 프록시 (인증키는 Worker 에만 저장)
  PROXY_URL: 'https://parkingview-proxy.ytw060125.workers.dev',
  SEOUL_REFRESH_MS: 60000,        // 서울시 실시간 데이터 갱신 주기

  // 공공데이터포털(data.go.kr) — 예: 한국교통안전공단 주차정보 API (무료, 일일 트래픽 제한)
  PUBLIC_API: {
    baseUrl: 'https://apis.data.go.kr/B553881/Parking',
    endpoints: { info: '/PrkSttusInfo', realtime: '/PrkRealtimeInfo', operation: '/PrkOprInfo' },
    serviceKey: 'YOUR_DATA_GO_KR_SERVICE_KEY', // 디코딩 키 권장
    numOfRows: 100,
  },

  // Supabase (Free tier) — 크라우드소싱 제보 저장소
  SUPABASE: {
    url: 'https://YOUR_PROJECT.supabase.co',
    anonKey: 'YOUR_SUPABASE_ANON_KEY',
    tables: { lots: 'parking_lots', reports: 'crowd_reports' },
  },

  REPORT_POINT: 50,               // 제보 1회 포인트
  REPORT_COOLDOWN_SEC: 90,        // 같은 주차장·같은 층 재제보 제한
  REPORT_TTL_MIN: 30,             // 제보가 "최신"으로 인정되는 시간
  FEED_WINDOW_MIN: 180,           // 피드 노출 범위
  ALT_RADIUS_M: 500,              // 대체 주차장 반경
  WALK_M_PER_MIN: 67,             // 도보 속도(약 4km/h)
  SIMULATE_REALTIME: true,        // mock 모드에서 실시간 변동 시뮬레이션
  TICK_MS: 12000,
  STORAGE_KEY: 'parkview:v1',
};

/* =====================================================================
 * 2) DATA SCHEMA (Supabase 테이블/공공 API 매핑 기준)
 * ---------------------------------------------------------------------
 * @typedef {{id:string,total:number,available:number,tags:string[]}} Zone
 * @typedef {{level:string,label:string,zones:Zone[],note?:string}} Floor
 * @typedef {{
 *   id:string, name:string, shortName:string, hotspot:string|null,
 *   address:string, lat:number, lng:number, type:'public'|'private',
 *   hours:string, fee:{per10min:number,hourly:number,note?:string},
 *   evChargers:number, keywords:string[], floors:Floor[], updatedAt:number
 * }} ParkingLot
 * @typedef {{id:string,lotId:string,floor:string,status:'free'|'normal'|'busy'|'full',
 *            createdAt:number,nick:string,mine?:boolean}} CrowdReport
 *
 * -- Supabase SQL 예시 --------------------------------------------------
 * create table crowd_reports (
 *   id uuid primary key default gen_random_uuid(),
 *   lot_id text not null, floor text not null,
 *   status text check (status in ('free','normal','busy','full')),
 *   nick text, device_id text, created_at timestamptz default now()
 * );
 * alter table crowd_reports enable row level security;
 * create policy "read" on crowd_reports for select using (true);
 * create policy "insert" on crowd_reports for insert with check (true);

 * 4) DATA SERVICE — 소스 교체 지점 (mock / 공공 API / Supabase)
 * ===================================================================== */
const DataService = {
  async fetchLots() {
    if (CONFIG.DATA_SOURCE === 'public') return this._fetchPublicLots();
    if (CONFIG.DATA_SOURCE === 'supabase') return this._supabase(`${CONFIG.SUPABASE.tables.lots}?select=*`);
    const now = Date.now();
    const lots = JSON.parse(JSON.stringify(MOCK_PARKING_LOTS)).map(l => {
      l.floors.forEach(f => f.zones.forEach(zn => (zn.base = zn.available)));
      l.updatedAt = now - Math.round(Math.random() * 40000);
      l.source = 'demo';
      return l;
    });
    if (CONFIG.DATA_SOURCE === 'hybrid' && CONFIG.PROXY_URL) {
      try { lots.push(...(await this.fetchSeoulLots())); }
      catch (e) { console.warn('서울시 데이터 로드 실패', e); state.proxyError = true; }
    }
    return lots;
  },

  /** Worker /seoul/lots → 앱 스키마. 좌표 변환이 끝난 주차장만 반환 */
  async fetchSeoulLots() {
    const res = await fetch(CONFIG.PROXY_URL + '/seoul/lots');
    if (!res.ok) throw new Error('proxy ' + res.status);
    const j = await res.json();
    state.seoulMeta = { count: j.count, geocoded: j.geocoded, pending: j.pending };
    return (j.lots || []).filter(r => r.lat && r.lng && r.total > 0).map(mapSeoulLot);
  },

  async fetchReports() {
    const mine = (Store.data.reports || []).map(r => ({ ...r, mine: true }));
    let others = [];
    if (CONFIG.DATA_SOURCE === 'supabase') {
      const since = new Date(Date.now() - CONFIG.FEED_WINDOW_MIN * 60000).toISOString();
      const rows = await this._supabase(`${CONFIG.SUPABASE.tables.reports}?select=*&created_at=gte.${since}&order=created_at.desc&limit=200`);
      others = rows.map(r => ({ id: r.id, lotId: r.lot_id, floor: r.floor, status: r.status, nick: r.nick || '익명 드라이버', createdAt: +new Date(r.created_at) }));
    } else {
      others = MOCK_CROWD_REPORTS.map((r, i) => ({ id: 'm' + i, lotId: r.lotId, floor: r.floor, status: r.status, nick: r.nick, createdAt: Date.now() - r.minutesAgo * 60000 }));
    }
    return [...mine, ...others].sort((a, b) => b.createdAt - a.createdAt);
  },

  async submitReport(report) {
    if (CONFIG.DATA_SOURCE !== 'supabase') return { ok: true }; // mock: LocalStorage 에만 저장
    try {
      await fetch(`${CONFIG.SUPABASE.url}/rest/v1/${CONFIG.SUPABASE.tables.reports}`, {
        method: 'POST',
        headers: { apikey: CONFIG.SUPABASE.anonKey, Authorization: `Bearer ${CONFIG.SUPABASE.anonKey}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ lot_id: report.lotId, floor: report.floor, status: report.status, nick: report.nick, device_id: Store.data.uid }),
      });
      return { ok: true };
    } catch (e) { console.warn('Supabase insert 실패', e); return { ok: false }; }
  },

  async _supabase(path) {
    const res = await fetch(`${CONFIG.SUPABASE.url}/rest/v1/${path}`, {
      headers: { apikey: CONFIG.SUPABASE.anonKey, Authorization: `Bearer ${CONFIG.SUPABASE.anonKey}` },
    });
    if (!res.ok) throw new Error('Supabase ' + res.status);
    return res.json();
  },

  async _fetchPublicLots() {
    const { baseUrl, endpoints, serviceKey, numOfRows } = CONFIG.PUBLIC_API;
    const q = new URLSearchParams({ serviceKey, numOfRows, pageNo: 1, format: '2' });
    const [info, rt] = await Promise.all([
      fetch(`${baseUrl}${endpoints.info}?${q}`).then(r => r.json()),
      fetch(`${baseUrl}${endpoints.realtime}?${q}`).then(r => r.json()),
    ]);
    const rtMap = new Map((rt.PrkRealtimeInfo || []).map(x => [x.prk_center_id, x]));
    return (info.PrkSttusInfo || []).map(item => mapPublicApiItem(item, rtMap.get(item.prk_center_id)));
  },
};

/**
 * 공공데이터 응답 → 앱 스키마 변환 예시.
 * ※ 필드명은 API마다 다릅니다. 신청한 API의 활용가이드(명세서)를 확인해 맞춰주세요.
 * 공공 API는 대부분 '전체 잔여 대수'만 제공 → 층별 데이터는 크라우드소싱으로 보완하는 구조입니다.
 */
function mapPublicApiItem(item, realtime) {
  const total = +item.prk_cmprt_co || 0;
  const available = realtime ? +realtime.pkfc_Available_ParkingLots_total || 0 : Math.round(total * 0.3);
  return {
    id: 'pub-' + item.prk_center_id, name: item.prk_plce_nm, shortName: item.prk_plce_nm, hotspot: null,
    address: item.prk_plce_adres || '', lat: +item.prk_plce_entrc_la, lng: +item.prk_plce_entrc_lo,
    type: 'public', hours: '-', fee: { per10min: 0, hourly: 0 }, evChargers: 0, keywords: [],
    floors: [one('전체', '전체 구역', total, available)], updatedAt: Date.now(),
  };
}

/** 서울시 시영주차장 실시간(Worker 가공) → 앱 스키마 */
function parseKst(s) { const t = s ? Date.parse(String(s).replace(' ', 'T') + '+09:00') : NaN; return isNaN(t) ? null : t; }
function fmtHours(h) {
  if (!h || !h.wdStart) return '-';
  if (h.wdStart === '0000' && (h.wdEnd === '2400' || h.wdEnd === '0000')) return '24시간';
  const f = t => `${String(t).slice(0, 2)}:${String(t).slice(2, 4)}`;
  return `${f(h.wdStart)}~${f(h.wdEnd)}`;
}
function mapSeoulLot(r) {
  const total = Math.max(0, Math.round(+r.total || 0));
  const avail = Math.min(total, Math.max(0, Math.round(+r.available || 0)));
  const f = r.fee || {};
  const per10 = f.baseMin > 0 ? Math.round((f.baseCharge * 10) / f.baseMin) : 0;
  let hourly = f.baseCharge || 0;
  if (f.baseMin > 0 && f.baseMin < 60 && f.addMin > 0) hourly += Math.ceil((60 - f.baseMin) / f.addMin) * (f.addCharge || 0);
  if (f.dayMax > 0) hourly = Math.min(hourly, f.dayMax);
  const note = r.realtime
    ? '층별 현황은 아직 없어요. 지금 계신 층의 상황을 제보해주세요!'
    : '실시간 연계가 끊긴 주차장이라 수치가 부정확할 수 있어요.';
  const lot = {
    id: 'seoul-' + r.id, source: 'seoul', realtime: !!r.realtime,
    name: r.name, shortName: String(r.name).replace(/\s*\((시|구)\)\s*$/, ''), hotspot: 'seoul',
    address: '서울 ' + (r.addr || ''), lat: +r.lat, lng: +r.lng, type: 'public', tel: r.tel,
    hours: fmtHours(r.hours),
    fee: { per10min: per10, hourly, note: r.pay === 'N' ? '무료 주차장' : '' },
    evChargers: null, keywords: ['서울', '공영', '시영', r.type || ''],
    floors: [one('전체', '전체 구역', total, avail, [], note)],
    updatedAt: parseKst(r.updatedAt) || Date.now(),
  };
  lot.floors[0].zones[0].base = avail;
  return lot;
}
const feeText = n => (n > 0 ? `${fmt(n)}원` : '무료');

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = n => Number(n).toLocaleString('ko-KR');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getLot = id => state.lots.find(l => l.id === id);
const walkMin = d => Math.max(1, Math.round(d / CONFIG.WALK_M_PER_MIN));
const fmtDist = m => (m < 1000 ? `${Math.round(m)}m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)}km`);

function haversine(a, b) {
  const R = 6371000, toR = x => (x * Math.PI) / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function timeAgo(ts) {
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (s < 10) return '방금';
  if (s < 60) return `${s}초 전`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}분 전`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}시간 전` : `${Math.floor(h / 24)}일 전`;
}

function statusOf(available, total) {
  if (!total || available <= 0) return STATUS.full;
  const occ = 1 - available / total;
  if (occ >= 0.97) return STATUS.full;
  if (occ >= 0.85) return STATUS.busy;
  if (occ >= 0.6) return STATUS.normal;
  return STATUS.free;
}
const floorTotals = f => f.zones.reduce((a, zn) => ({ total: a.total + zn.total, available: a.available + zn.available }), { total: 0, available: 0 });
const lotTotals = l => l.floors.reduce((a, f) => { const t = floorTotals(f); return { total: a.total + t.total, available: a.available + t.available }; }, { total: 0, available: 0 });
const occPct = t => (t.total ? Math.round((1 - t.available / t.total) * 100) : 100);

function latestReport(lotId, floor) {
  const limit = Date.now() - CONFIG.FEED_WINDOW_MIN * 60000;
  return state.reports.find(r => r.lotId === lotId && (!floor || r.floor === floor) && r.createdAt >= limit) || null;
}
const recentReportCount = lotId => state.reports.filter(r => r.lotId === lotId && Date.now() - r.createdAt < CONFIG.REPORT_TTL_MIN * 60000).length;

function bestFloor(lot, excludeLevel) {
  return lot.floors.filter(f => f.level !== excludeLevel).map(f => ({ level: f.level, ...floorTotals(f) })).sort((a, b) => b.available - a.available)[0] || null;
}

function getAlternatives(lot) {
  return state.lots
    .filter(l => l.id !== lot.id)
    .map(l => { const d = haversine(lot, l), t = lotTotals(l); return { lot: l, d, walk: walkMin(d), ...t, status: statusOf(t.available, t.total) }; })
    .filter(a => a.d <= CONFIG.ALT_RADIUS_M)
    .sort((a, b) => STATUS_ORDER.indexOf(a.status.key) - STATUS_ORDER.indexOf(b.status.key) || a.d - b.d);
}

const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const toCho = s => [...s].map(c => { const k = c.charCodeAt(0) - 0xac00; return k >= 0 && k <= 11171 ? CHO[Math.floor(k / 588)] : c; }).join('');
const isChoOnly = s => /^[ㄱ-ㅎ\s]+$/.test(s);

function searchLots(q) {
  const n = q.toLowerCase().replace(/\s/g, '');
  const cho = isChoOnly(q);
  return state.lots.map(l => {
    const name = l.name.replace(/\s/g, '').toLowerCase();
    let score = 0;
    if (name.startsWith(n)) score += 5;
    else if (name.includes(n)) score += 3;
    if (l.keywords.some(k => k.toLowerCase().includes(n))) score += 2;
    if (l.address.replace(/\s/g, '').includes(n)) score += 1;
    if (cho && toCho(name).includes(n)) score += 3;
    if (l.hotspot && HOTSPOTS.find(h => h.id === l.hotspot)?.lotId === l.id) score += score ? 1 : 0;
    return { l, score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 7).map(x => x.l);
}

function highlight(text, q) {
  const safe = esc(text);
  if (!q || isChoOnly(q)) return safe;
  const i = safe.toLowerCase().indexOf(esc(q).toLowerCase());
  return i < 0 ? safe : `${safe.slice(0, i)}<mark>${safe.slice(i, i + esc(q).length)}</mark>${safe.slice(i + esc(q).length)}`;
}

function levelOf(p) {
  let i = 0;
  LEVELS.forEach((lv, idx) => { if (p >= lv.min) i = idx; });
  const cur = LEVELS[i], next = LEVELS[i + 1] || null;
  return { cur, next, idx: i, progress: next ? (p - cur.min) / (next.min - cur.min) : 1 };
}

function userStats() {
  const mine = state.reports.filter(r => r.mine);
  return {
    count: mine.length,
    lots: new Set(mine.map(r => r.lotId)).size,
    fullCount: mine.filter(r => r.status === 'full').length,
    night: mine.some(r => { const h = new Date(r.createdAt).getHours(); return h >= 22 || h < 5; }),
    points: Store.data.points,
  };
}

(function sheetDrag() {
  const sheet = $('#sheet');
  let y0 = null, dy = 0;
  sheet.addEventListener('touchstart', e => {
    if (!e.target.closest('.sheet-handle')) return;
    y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (y0 === null) return;
    sheet.style.transition = '';
    if (dy > 100) Sheet.close(); else sheet.style.transform = 'translateY(0)';
    y0 = null;
  });
})();

        : `<p class="flex items-center gap-2"><i class="fa-solid fa-users text-sub w-4 text-center"></i><span>아직 현장 제보가 없어요. 첫 제보를 남겨주세요.</span></p>`}

      <button data-act="open-report" class="press h-12 rounded-2xl bg-card2 border border-line font-bold text-[14.5px]"><i class="fa-solid fa-bullhorn mr-1.5 text-brand"></i>현황 제보</button>
    </div>
  </section>`;
}

function floorTip(lot, f, s) {
  const zones = f.zones.filter(zn => zn.available > 0).sort((a, b) => b.available / b.total - a.available / a.total);
  if (s.key === 'full' || !zones.length) {
    const alt = bestFloor(lot, f.level);
    return alt && alt.available > 0
      ? `<b>${f.level}층은 사실상 만차</b>예요. <b>${alt.level}층</b>(잔여 ${alt.available}석)으로 바로 이동하세요.`
      : '전 층이 만차에 가까워요. 아래 대체 주차장을 확인하세요.';
  }
  const pick = zones.find(zn => zn.tags.some(tg => TAGS[tg]?.priority) && zn.available >= 3) || zones[0];
  const tagText = pick.tags.map(tg => TAGS[tg]?.label).filter(Boolean).join('/');
  if (f.zones.length === 1) return f.note ? esc(f.note) : (tagText ? `${tagText} 구역 이용 가능` : '');
  return `<b>${f.level}층 ${pick.id}구역</b>${tagText ? ` ${tagText}` : ''} 공간 여유 (${pick.available}면)${f.note ? `<br/><span class="text-sub">${esc(f.note)}</span>` : ''}`;
}

function floorCardHTML(lot, f, bestLevel) {
  const t = floorTotals(f), s = statusOf(t.available, t.total), occ = occPct(t);
  const rep = latestReport(lot.id, f.level);
  const tip = floorTip(lot, f, s);
  const isBest = f.level === bestLevel && s.key !== 'full';
  const zonesHTML = f.zones.length > 1 ? `
    <div class="grid gap-1.5 mt-3" style="grid-template-columns:repeat(${f.zones.length},minmax(0,1fr))">
      ${f.zones.map(zn => { const zs = statusOf(zn.available, zn.total); return `
        <div class="rounded-xl px-2.5 py-2 bg-card2 border border-line">
          <div class="flex items-center justify-between"><span class="text-[11px] font-bold text-sub">${zn.id}구역</span><span class="w-2 h-2 rounded-full" style="background:${zs.color}"></span></div>
          <p class="text-[15px] font-extrabold mt-0.5 tnum" style="color:${zs.color}">${zn.available}<span class="text-[10.5px] text-sub font-semibold">/${zn.total}</span></p>
          <p class="text-[10px] text-sub truncate h-3.5">${zn.tags.map(tg => TAGS[tg]?.short).filter(Boolean).join(' · ')}</p>
        </div>`; }).join('')}
    </div>` : '';
  return `
  <article class="card p-4 ${isBest ? 'ring-2 ring-emerald-500/40' : ''}">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl grid place-items-center font-black text-[15px] text-white shrink-0 shadow-md" style="background:${s.color}">${f.level}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5"><h4 class="font-bold text-[15.5px]">${f.label}</h4>
          ${isBest ? '<span class="text-[10.5px] font-bold text-emerald-600 bg-emerald-500/10 px-1.5 py-0.5 rounded-md">추천 층</span>' : ''}</div>
        <p class="text-[12px] text-sub mt-0.5">점유율 <span class="tnum">${occ}%</span> · <b style="color:${s.color}">${s.label}</b></p>
      </div>
      <div class="text-right shrink-0">
        <p class="leading-none whitespace-nowrap"><span class="text-[28px] font-black tnum" style="color:${s.color}">${t.available}</span><span class="text-[13px] text-sub font-semibold"> / ${fmt(t.total)}</span></p>
        <p class="text-[10.5px] text-sub mt-1">잔여 / 전체</p>
      </div>
    </div>
    <div class="bar mt-3.5"><span style="width:${occ}%;background:${s.color}"></span></div>
    ${zonesHTML}
    ${tip ? `<div class="mt-3 flex gap-2.5 items-start text-[12.5px] rounded-xl bg-amber-500/[.08] border border-amber-500/20 px-3 py-2.5"><i class="fa-solid fa-lightbulb text-amber-500 mt-0.5"></i><span class="leading-snug">${tip}</span></div>` : ''}
    ${rep ? `<div class="mt-2.5 flex items-center gap-1.5 text-[11.5px] text-sub"><i class="fa-solid fa-user-check" style="color:${STATUS[rep.status].color}"></i><span data-ago="${rep.createdAt}">${timeAgo(rep.createdAt)}</span><span>현장 유저 제보:</span><b style="color:${STATUS[rep.status].color}">${STATUS[rep.status].label}</b></div>` : ''}
  </article>`;
}

function altCardHTML(a, idx) {

      <div class="rounded-xl bg-card2 py-2"><p class="text-[10.5px] text-sub">1시간</p><p class="text-[13.5px] font-bold tnum">${feeText(a.lot.fee.hourly)}</p></div>

    <div class="mt-2.5 grid grid-cols-2 gap-2">

      <button data-act="goto" data-id="${a.lot.id}" class="press h-11 rounded-xl bg-card2 border border-line text-[13.5px] font-bold">바로가기<i class="fa-solid fa-chevron-right ml-1.5 text-[11px] text-sub"></i></button>

function renderExplore() {
  const lot = getLot(state.selectedId);
  if (!lot) return;
  renderChips();
  const t = lotTotals(lot), s = statusOf(t.available, t.total);
  const alts = getAlternatives(lot);

  const crowded = s.key === 'busy' || s.key === 'full';

  const legend = STATUS_ORDER.map(k => `<span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${STATUS[k].color}"></span>${STATUS[k].label}</span>`).join('');

        <span class="text-[12px] font-bold text-brand">${alts.length}곳</span>
      </div>
      <div class="space-y-2.5">${alts.length ? alts.map(altCardHTML).join('') : `
        <div class="card p-6 text-center"><i class="fa-solid fa-map text-2xl text-sub"></i><p class="mt-2 text-[13.5px] font-semibold">반경 ${CONFIG.ALT_RADIUS_M}m 안에 등록된 주차장이 없어요</p><p class="text-[12px] text-sub mt-1">내 주변 탭에서 더 넓게 찾아보세요.</p></div>`}</div>
    </section>`;

  $('#dashboard').innerHTML = `
    ${crowded ? warningHTML(lot, s, alts) : ''}

}

/* =====================================================================
 * 9) RENDER — 검색 자동완성
 * ===================================================================== */
function suggestItem(l, icon, q) {
  const t = lotTotals(l), s = statusOf(t.available, t.total);
  return `<button data-act="pick" data-id="${l.id}" class="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-card2 active:bg-card2">
    <span class="w-9 h-9 rounded-xl bg-card2 grid place-items-center text-sub shrink-0"><i class="fa-solid ${icon}"></i></span>
    <span class="flex-1 min-w-0"><span class="block text-[14.5px] font-semibold truncate">${highlight(l.name, q)}</span><span class="block text-[12px] text-sub truncate">${esc(l.address)}</span></span>
    <span class="text-[11.5px] font-bold px-2 py-1 rounded-lg shrink-0 tnum" style="background:${s.color}1c;color:${s.color}">${s.label} ${fmt(t.available)}</span>
  </button>`;
}

function renderSuggest() {
  const q = $('#searchInput').value.trim();
  $('#searchClear').classList.toggle('hidden', !q);
  let html = '';
  if (!q) {
    const rec = Store.data.recent.map(getLot).filter(Boolean);
    if (rec.length) {
      html += `<div class="px-4 pt-3 pb-1 flex justify-between text-[11.5px] text-sub font-semibold"><span>최근 검색</span><button data-act="clear-recent" class="text-brand">전체 삭제</button></div>`;
      html += rec.map(l => suggestItem(l, 'fa-clock-rotate-left')).join('');
    }
    html += `<div class="px-4 pt-3 pb-1 text-[11.5px] text-sub font-semibold">인기 주차장</div>`;
    html += HOTSPOTS.map(h => getLot(h.lotId)).filter(l => l && !Store.data.recent.includes(l.id)).map(l => suggestItem(l, 'fa-fire-flame-curved')).join('');
  } else {
    const m = searchLots(q);
    html = m.length
      ? m.map(l => suggestItem(l, 'fa-square-parking', q)).join('')
      : `<div class="p-6 text-center"><p class="text-[14px] font-semibold">'${esc(q)}' 검색 결과가 없어요</p><p class="text-[12px] text-sub mt-1">주차장 이름이나 지역명(초성도 가능)으로 검색해보세요.</p></div>`;
  }
  $('#suggest').innerHTML = html;
  $('#suggest').classList.remove('hidden');
}
const hideSuggest = () => $('#suggest').classList.add('hidden');

/* =====================================================================
 * 10) RENDER — 내 주변 (Leaflet + OpenStreetMap, 무료)
 * ===================================================================== */
const refPoint = () => state.userPos || getLot(state.selectedId);

function renderNearby() {
  const ref = refPoint();
  $('#nearbyRef').innerHTML = state.userPos
    ? '<i class="fa-solid fa-location-arrow text-brand mr-1"></i>현재 위치 기준'
    : `<i class="fa-solid fa-square-parking text-sub mr-1"></i>${esc(getLot(state.selectedId).shortName)} 기준 · GPS를 켜면 내 위치로 바뀌어요`;
  $$('#sortSeg button').forEach(b => {
    const on = b.dataset.sort === state.nearbySort;
    b.className = `px-3 py-1.5 rounded-full ${on ? 'bg-card text-ink shadow-sm' : 'text-sub'}`;
  });
  $('#mapLegend').innerHTML = STATUS_ORDER.map(k => `<span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${STATUS[k].color}"></span>${STATUS[k].label}</span>`).join('');

  const rows = state.lots.map(l => { const t = lotTotals(l); return { l, d: haversine(ref, l), ...t, s: statusOf(t.available, t.total) }; });
  rows.sort(state.nearbySort === 'distance' ? (a, b) => a.d - b.d : (a, b) => STATUS_ORDER.indexOf(a.s.key) - STATUS_ORDER.indexOf(b.s.key) || a.d - b.d);
  $('#nearbyList').innerHTML = rows.slice(0, 14).map(r => `
    <button data-act="preview" data-id="${r.l.id}" class="press w-full card p-3.5 flex items-center gap-3 text-left">
      <div class="w-12 h-12 rounded-2xl grid place-items-center shrink-0" style="background:${r.s.color}1c;color:${r.s.color}"><i class="fa-solid fa-square-parking text-xl"></i></div>
      <div class="flex-1 min-w-0">
        <p class="font-bold text-[15px] truncate">${esc(r.l.name)}</p>
        <p class="text-[12px] text-sub mt-0.5 truncate"><span class="tnum">${fmtDist(r.d)}</span> · ${r.d <= 1500 ? `도보 ${walkMin(r.d)}분` : `차로 약 ${Math.max(1, Math.round(r.d / 500))}분`} · 10분 ${feeText(r.l.fee.per10min)}</p>
      </div>
      <div class="text-right shrink-0"><p class="text-[20px] leading-none font-black tnum" style="color:${r.s.color}">${fmt(r.available)}</p><p class="text-[11px] font-bold mt-1" style="color:${r.s.color}">${r.s.label}</p></div>
    </button>`).join('');
  renderMarkers();
}

function initMap() {
  if (state.map) { state.map.invalidateSize(); return; }
  if (typeof L === 'undefined') {
    $('#map').innerHTML = '<div class="h-full grid place-items-center text-sm text-sub p-6 text-center">지도를 불러오지 못했어요.<br/>네트워크 연결을 확인하세요.</div>';
    return;
  }
  const c = refPoint();
  state.map = L.map('map', { zoomControl: false, attributionControl: true }).setView([c.lat, c.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(state.map);
  state.markerLayer = L.layerGroup().addTo(state.map);
  renderMarkers();
}

function renderMarkers() {
  if (!state.map || !state.markerLayer) return;
  state.markerLayer.clearLayers();
  state.lots.forEach(l => {
    const t = lotTotals(l), s = statusOf(t.available, t.total);
    const icon = L.divIcon({ className: 'pin-wrap', iconSize: [90, 30], iconAnchor: [45, 34],
      html: `<span class="pin" style="--c:${s.color}"><i class="fa-solid fa-square-parking"></i>${fmt(t.available)}</span>` });
    L.marker([l.lat, l.lng], { icon, zIndexOffset: l.id === state.selectedId ? 1000 : 0 }).on('click', () => openLotPreview(l.id)).addTo(state.markerLayer);
  });
  if (state.userPos) {
    L.marker([state.userPos.lat, state.userPos.lng], { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 2000 }).addTo(state.markerLayer);
  }
}

      </div>

      <div class="grid grid-cols-2 gap-2.5 mt-2">
        ${STATUS_ORDER.map(k => { const s = STATUS[k]; return `

function launchNav(app, id) {
  const l = getLot(id);
  const n = encodeURIComponent(l.name);
  const appName = encodeURIComponent(location.hostname || 'parkview.app');
  // 카카오내비 공식 연동: Kakao JS SDK(무료, 앱키 필요) 로드 후 Kakao.Navi.start 사용
  if (app === 'kakao' && window.Kakao && window.Kakao.Navi) {
    window.Kakao.Navi.start({ name: l.name, x: l.lng, y: l.lat, coordType: 'wgs84' });
    return;
  }
  const links = {
    tmap:  { app: `tmap://route?goalname=${n}&goalx=${l.lng}&goaly=${l.lat}`, web: `https://map.kakao.com/link/to/${n},${l.lat},${l.lng}` },
    kakao: { app: `kakaomap://route?ep=${l.lat},${l.lng}&by=CAR`,              web: `https://map.kakao.com/link/to/${n},${l.lat},${l.lng}` },
    naver: { app: `nmap://route/car?dlat=${l.lat}&dlng=${l.lng}&dname=${n}&appname=${appName}`, web: `https://map.naver.com/p/search/${n}` },
  }[app];
  const started = Date.now();
  const onHide = () => { if (document.hidden) clearTimeout(timer); };
  document.addEventListener('visibilitychange', onHide, { once: true });
  const timer = setTimeout(() => { if (!document.hidden && Date.now() - started < 3000) window.open(links.web, '_blank', 'noopener'); }, 1400);
  window.location.href = links.app;
  Sheet.close();
}

/* =====================================================================
 * 14) ACTIONS
 * ===================================================================== */
function selectLot(id, { silent = false } = {}) {
  if (!getLot(id)) return;
  state.selectedId = id;
  state.draft = { lotId: id, floor: null };
  Store.data.lastLot = id;
  if (!silent) {
    Store.data.recent = [id, ...Store.data.recent.filter(x => x !== id)].slice(0, 5);
  }
  Store.save();
  renderExplore();
  if (state.tab !== 'explore' && !silent) switchTab('explore');
  if (!silent) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchTab(tab) {
  state.tab = tab;
  $$('.view').forEach(v => {
    const on = v.id === 'view-' + tab;
    v.classList.toggle('hidden', !on);
    if (on) { v.classList.remove('view'); void v.offsetWidth; v.classList.add('view'); }
  });
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('#fab').classList.toggle('hidden', tab !== 'explore');
  window.scrollTo(0, 0);
  if (tab === 'explore') renderExplore();
  if (tab === 'nearby') { renderNearby(); setTimeout(() => { initMap(); if (state.map) { state.map.invalidateSize(); const c = refPoint(); state.map.setView([c.lat, c.lng], state.map.getZoom()); } }, 60); }
  if (tab === 'report') renderReportView();
  if (tab === 'my') renderMy();
  try { history.replaceState(null, '', '#' + tab); } catch (e) {}
}

function applyReportToLot(r) {
  const lot = getLot(r.lotId); if (!lot) return;
  const f = lot.floors.find(x => x.level === r.floor); if (!f) return;
  const target = { free: 0.5, normal: 0.25, busy: 0.08, full: 0 }[r.status];
  f.zones.forEach(zn => {
    zn.available = clamp(Math.round(zn.total * target * (0.8 + Math.random() * 0.4)), 0, zn.total);
    zn.base = zn.available;
  });
}

async function submitReport(statusKey, btn) {
  const d = state.draft;
  if (!d.floor) {
    $$('.floor-row').forEach(el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); });
    toast('먼저 지금 계신 층을 선택하세요', 'warn');
    return;
  }
  const key = `${d.lotId}:${d.floor}`;
  const last = Store.data.cooldowns[key] || 0;
  const remain = Math.ceil((last + CONFIG.REPORT_COOLDOWN_SEC * 1000 - Date.now()) / 1000);
  if (remain > 0) { toast(`${d.floor}층은 ${remain}초 뒤에 다시 제보할 수 있어요`, 'warn'); return; }

  const report = { id: 'u' + Date.now(), lotId: d.lotId, floor: d.floor, status: statusKey, createdAt: Date.now(), nick: '익명 드라이버 #' + Store.data.uid, mine: true };
  const before = levelOf(Store.data.points);
  Store.data.points += CONFIG.REPORT_POINT;
  Store.data.reports = [report, ...Store.data.reports].slice(0, 200);
  Store.data.cooldowns[key] = Date.now();
  state.reports.unshift(report);
  applyReportToLot(report);

  const stats = userStats();
  const newBadges = BADGES.filter(b => !Store.data.badges.includes(b.id) && b.cond(stats));
  Store.data.badges.push(...newBadges.map(b => b.id));
  Store.save();
  DataService.submitReport(report);

  const after = levelOf(Store.data.points);
  if (btn) { const r = btn.getBoundingClientRect(); floatPoints(r.left + r.width / 2, r.top); }
  if (state.sheetOpen) Sheet.close();
  state.draft.floor = null;

  renderExplore();
  if (state.tab === 'report') renderReportView();
  if (state.tab === 'my') renderMy(); else $('#myDot').classList.remove('hidden');
  setTimeout(() => showReward({ report, levelUp: after.idx > before.idx ? after.cur : null, newBadges }), 350);
}

function locate(fromNearby) {
  if (!navigator.geolocation) { toast('이 브라우저는 위치 서비스를 지원하지 않아요', 'error'); return; }
  toast('현재 위치를 찾고 있어요', 'info');
  navigator.geolocation.getCurrentPosition(pos => {
    state.userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const nearest = state.lots.map(l => ({ l, d: haversine(state.userPos, l) })).sort((a, b) => a.d - b.d)[0];
    toast(`가장 가까운 주차장: ${nearest.l.shortName} (${fmtDist(nearest.d)})`);
    if (!fromNearby) selectLot(nearest.l.id);
    if (state.tab === 'nearby') {
      renderNearby();
      if (state.map) state.map.setView([state.userPos.lat, state.userPos.lng], 14);
    }
  }, err => {
    toast(err.code === 1 ? '위치 권한이 꺼져 있어요. 브라우저 설정에서 허용해주세요' : '위치를 가져오지 못했어요. HTTPS 환경에서 다시 시도하세요', 'error');
  }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 30000 });
}

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeIcon').className = `fa-solid ${t === 'dark' ? 'fa-sun' : 'fa-moon'}`;
  document.querySelector('meta[name="theme-color"]').content = '#0b1222';
}

/* =====================================================================
 * 15) EVENTS (위임 방식)
 * ===================================================================== */
document.addEventListener('click', e => {
  if (!e.target.closest('#searchWrap')) hideSuggest();
  const tabBtn = e.target.closest('[data-tab]');
  const el = e.target.closest('[data-act]');
  if (tabBtn && (!el || el === tabBtn || el.dataset.act === 'tab')) { switchTab(tabBtn.dataset.tab); return; }
  if (!el) return;
  const { act, id } = el.dataset;

  switch (act) {
    case 'pick':
      $('#searchInput').value = getLot(id).name; hideSuggest(); $('#searchInput').blur(); selectLot(id); break;
    case 'hotspot': case 'goto':
      Sheet.close(); $('#searchInput').value = ''; $('#searchClear').classList.add('hidden'); selectLot(id); break;
    case 'clear-recent':
      e.stopPropagation(); Store.data.recent = []; Store.save(); renderSuggest(); break;
    case 'fav': {
      const f = Store.data.favorites;
      const on = f.includes(id);
      Store.data.favorites = on ? f.filter(x => x !== id) : [id, ...f];
      Store.save(); renderExplore();
      toast(on ? '즐겨찾기에서 뺐어요' : '즐겨찾기에 추가했어요');
      break;
    }
    case 'nav': openNavSheet(id); break;
    case 'nav-go': launchNav(el.dataset.app, id); break;
    case 'open-report': state.draft = { lotId: state.selectedId, floor: null }; openReportSheet(); break;
    case 'draft-floor': state.draft.floor = el.dataset.floor; renderReportForms(); break;
    case 'report': submitReport(el.dataset.status, el); break;
    case 'scroll-alts': document.getElementById('alts')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'locate': locate(false); break;
    case 'locate-nearby': locate(true); break;
    case 'sort': state.nearbySort = el.dataset.sort; renderNearby(); break;
    case 'preview': openLotPreview(id); break;
    case 'toggle-theme': {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      Store.data.theme = t; Store.save(); applyTheme(t);
      if (state.tab === 'my') renderMy();
      break;
    }
    case 'reset':
      if (confirm('포인트, 제보 내역, 뱃지, 즐겨찾기가 모두 삭제돼요. 초기화할까요?')) {
        const theme = Store.data.theme;
        Store.reset(); Store.data.theme = theme; Store.save();
        state.reports = state.reports.filter(r => !r.mine);
        renderMy(); toast('내 기록을 초기화했어요');
      }
      break;
    case 'close-sheet': Sheet.close(); break;
    case 'close-reward': if (e.target === el || el.tagName === 'BUTTON') closeReward(); break;
  }
});

document.addEventListener('change', e => {
  if (e.target.dataset.change === 'draft-lot') { state.draft = { lotId: e.target.value, floor: null }; renderReportForms(); }
});

const input = $('#searchInput');
input.addEventListener('focus', renderSuggest);
input.addEventListener('input', renderSuggest);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const first = $('#suggest [data-act="pick"]');
    if (first) first.click();
  }
  if (e.key === 'Escape') { hideSuggest(); input.blur(); }
});
$('#searchClear').addEventListener('click', e => { e.stopPropagation(); input.value = ''; renderSuggest(); input.focus(); });

let lastY = 0;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  $('#fab').classList.toggle('mini', y > 220 && y > lastY);
  lastY = y;
}, { passive: true });

document.addEventListener('keydown', e => { if (e.key === 'Escape') { Sheet.close(); closeReward(); } });

/* =====================================================================
 * 16) REALTIME SIMULATION (mock 전용) & 시간 표시 갱신
 * ===================================================================== */
function tick() {
  if (!CONFIG.SIMULATE_REALTIME || !['mock', 'hybrid'].includes(CONFIG.DATA_SOURCE)) return;
  const now = Date.now();
  state.lots.forEach(l => {
    if (l.source === 'seoul') return; // 실제 데이터는 시뮬레이션하지 않음
    l.floors.forEach(f => f.zones.forEach(zn => {
      const step = Math.max(1, Math.round(zn.total * 0.025));
      const noise = Math.round((Math.random() * 2 - 1) * step);
      const revert = Math.round(((zn.base ?? zn.available) - zn.available) * 0.2);
      zn.available = clamp(zn.available + noise + revert, 0, zn.total);
    }));
    l.updatedAt = now - Math.round(Math.random() * 8000);
  });
  if (document.hidden) return;
  if (state.tab === 'explore' && !state.sheetOpen && $('#suggest').classList.contains('hidden')) renderExplore();
  if (state.tab === 'nearby' && !state.sheetOpen) renderNearby();
}

async function refreshSeoul() {
  if (document.hidden) return;
  try {
    const fresh = await DataService.fetchSeoulLots();
    fresh.forEach(nl => {
      const cur = getLot(nl.id);
      if (!cur) { state.lots.push(nl); return; }
      cur.floors[0].zones[0].available = nl.floors[0].zones[0].available;
      cur.floors[0].zones[0].total = nl.floors[0].zones[0].total;
      cur.updatedAt = nl.updatedAt;
    });
    if (state.sheetOpen) return;
    if (state.tab === 'explore' && $('#suggest').classList.contains('hidden')) renderExplore();
    if (state.tab === 'nearby') renderNearby();
  } catch (e) { console.warn('서울시 갱신 실패', e); }
}

function refreshAgo() { $$('[data-ago]').forEach(el => (el.textContent = timeAgo(+el.dataset.ago))); }

/* =====================================================================
 * 17) PWA — 매니페스트 동적 주입 (서비스워커는 별도 sw.js 파일 필요)
 * ===================================================================== */
function injectManifest() {
  try {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#0b1222"/><rect x="96" y="96" width="320" height="320" rx="84" fill="#4F7CFF"/><text x="256" y="338" font-size="230" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica" font-weight="900">P</text></svg>`;
    const icon = 'data:image/svg+xml,' + encodeURIComponent(svg);
    const manifest = {
      name: '파킹뷰 · 층별 실시간 주차', short_name: '파킹뷰', lang: 'ko',
      start_url: location.href.split('#')[0], display: 'standalone',
      background_color: '#0b1222', theme_color: '#0b1222',
      icons: [{ src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }],
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);
    ['icon', 'apple-touch-icon'].forEach(rel => { const l = document.createElement('link'); l.rel = rel; l.href = icon; document.head.appendChild(l); });
  } catch (e) { /* noop */ }
}

/* =====================================================================
 * 18) INIT
 * ===================================================================== */
async function init() {
  Store.load();
  applyTheme(Store.data.theme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  try {
    state.lots = await DataService.fetchLots();
    state.reports = await DataService.fetchReports();
  } catch (e) {
    console.error(e);
    toast('데이터를 불러오지 못해 데모 데이터로 표시해요', 'error');
    CONFIG.DATA_SOURCE = 'mock';
    state.lots = await DataService.fetchLots();
    state.reports = await DataService.fetchReports();
  }
  const seoulLots = state.lots.filter(l => l.source === 'seoul');
  if (seoulLots.length) {
    const pick = getLot('seoul-171721') || seoulLots[0];
    HOTSPOTS.push({ id: 'seoul', label: `서울 시영 ${seoulLots.length}곳`, icon: 'fa-city', lotId: pick.id });
    setInterval(refreshSeoul, CONFIG.SEOUL_REFRESH_MS);
  } else if (state.proxyError) {
    toast('서울시 실시간 데이터를 불러오지 못했어요', 'error');
  }
  const startLot = getLot(Store.data.lastLot) ? Store.data.lastLot : 'gn-main';
  selectLot(startLot, { silent: true });
  const hash = location.hash.slice(1);
  switchTab(['explore', 'nearby', 'report', 'my'].includes(hash) ? hash : 'explore');
  setInterval(tick, CONFIG.TICK_MS);
  setInterval(refreshAgo, 10000);
  injectManifest();
}

document.addEventListener('DOMContentLoaded', init);
</script>
