<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1222" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="파킹뷰" />
<meta name="description" content="층별·구역별 실시간 주차 혼잡도와 현장 제보를 한눈에" />
<title>파킹뷰 · 층별 실시간 주차 현황</title>
<!-- ParkingView app v7 (2026-09-28) -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg:    'rgb(var(--bg) / <alpha-value>)',
          card:  'rgb(var(--card) / <alpha-value>)',
          card2: 'rgb(var(--card2) / <alpha-value>)',
          ink:   'rgb(var(--ink) / <alpha-value>)',
          sub:   'rgb(var(--sub) / <alpha-value>)',
          line:  'rgb(var(--line) / <alpha-value>)',
          brand: 'rgb(var(--brand) / <alpha-value>)',
        },
        fontFamily: {
          sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', '"Apple SD Gothic Neo"', '"Noto Sans KR"', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  :root{
    --bg:241 245 249; --card:255 255 255; --card2:248 250 252;
    --ink:15 23 42; --sub:92 107 130; --line:226 232 240;
    --brand:66 110 245;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:2 6 23; --card:15 23 42; --card2:25 36 56;
    --ink:241 245 249; --sub:156 170 191; --line:40 53 76;
    --brand:110 146 255;
    color-scheme: dark;
  }
  html,body{ background:rgb(var(--bg)); color:rgb(var(--ink)); -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
  body{ -webkit-font-smoothing:antialiased; }
  button,select,input{ font:inherit; color:inherit; }
  button{ touch-action:manipulation; }
  button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{ outline:2px solid rgb(var(--brand)); outline-offset:2px; }
  .no-scrollbar::-webkit-scrollbar{ display:none } .no-scrollbar{ scrollbar-width:none }
  .tnum{ font-variant-numeric:tabular-nums; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* 상태 텍스트 색 (대비 확보용: 밝은/어두운 테마별) */
  .st-free{ color:#047857 } .st-normal{ color:#92400e } .st-busy{ color:#c2410c } .st-full{ color:#dc2626 }
  [data-theme="dark"] .st-free{ color:#34d399 } [data-theme="dark"] .st-normal{ color:#facc15 }
  [data-theme="dark"] .st-busy{ color:#fb923c } [data-theme="dark"] .st-full{ color:#f87171 }

  .hdr{
    background:
      radial-gradient(110% 90% at 0% 0%, rgba(79,124,255,.28) 0%, transparent 55%),
      radial-gradient(80% 70% at 100% 0%, rgba(16,185,129,.12) 0%, transparent 60%),
      linear-gradient(180deg,#0b1222 0%, #111b31 100%);
  }
  .card{ background:rgb(var(--card)); border:1px solid rgb(var(--line)); border-radius:22px; }
  .press{ transition:transform .12s ease, background-color .2s ease, opacity .2s; }
  .press:active{ transform:scale(.965); }
  .press[disabled]{ opacity:.5; pointer-events:none; }

  .bar{ height:10px; border-radius:999px; background:rgb(var(--line)); overflow:hidden; }
  .bar > span{ display:block; height:100%; border-radius:inherit; transition:width .7s cubic-bezier(.2,.8,.2,1); }

  /* 층 단면(타워) */
  .tower{ display:flex; flex-direction:column; gap:4px; padding:8px 8px 6px; border-radius:16px; background:rgb(var(--card2)); border:1px solid rgb(var(--line)); position:relative; }
  .tower::before{ content:""; position:absolute; left:8px; right:8px; top:-6px; height:6px; border-radius:6px 6px 0 0; background:rgb(var(--line)); }
  .slab{ position:relative; height:22px; border-radius:7px; background:rgb(var(--line)); overflow:hidden; display:flex; align-items:center; }
  .slab > i{ position:absolute; inset:0 auto 0 0; border-radius:inherit; transition:width .7s cubic-bezier(.2,.8,.2,1); }
  .slab > b{ position:relative; z-index:1; font-size:10.5px; font-weight:800; padding-left:7px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .slab > em{ position:relative; z-index:1; margin-left:auto; padding-right:7px; font-style:normal; font-size:10.5px; font-weight:800; color:rgb(var(--ink)); }

  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--c); position:relative; display:inline-block; }
  .live-dot::after{ content:""; position:absolute; inset:-4px; border-radius:50%; background:var(--c); opacity:.35; animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes ping{ 75%,100%{ transform:scale(2); opacity:0; } }

  .view{ animation:viewIn .24s ease; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }

  /* Skeleton */
  .skel{ background:linear-gradient(90deg, rgb(var(--line)) 0%, rgb(var(--card2)) 50%, rgb(var(--line)) 100%); background-size:200% 100%; animation:skel 1.2s linear infinite; border-radius:10px; }
  @keyframes skel{ from{ background-position:200% 0 } to{ background-position:-200% 0 } }

  /* Tab bar */
  .tab-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:rgb(var(--sub)); font-size:11px; font-weight:600; position:relative; min-height:56px; }
  .tab-btn i{ font-size:19px; height:28px; display:grid; place-items:center; transition:transform .2s; }
  .tab-btn.active{ color:rgb(var(--brand)); }
  .tab-btn.active::before{ content:""; position:absolute; top:0; width:28px; height:3px; border-radius:0 0 4px 4px; background:rgb(var(--brand)); }
  .tab-btn.tab-cta i{ width:44px; border-radius:999px; background:rgb(var(--brand) / .12); color:rgb(var(--brand)); }
  .tab-btn.tab-cta.active i{ background:rgb(var(--brand)); color:#fff; }

  /* FAB */
  #fab{ right:max(16px, calc(50% - 240px + 16px)); bottom:calc(84px + env(safe-area-inset-bottom)); transition:all .3s cubic-bezier(.2,.8,.2,1); }
  #fab .fab-label{ max-width:220px; transition:max-width .3s, opacity .2s, margin .3s; white-space:nowrap; overflow:hidden; }
  #fab.mini .fab-label{ max-width:0; opacity:0; margin-left:0; }

  /* Bottom sheet: closed / collapsed / expanded */
  #sheet{ transition:transform .34s cubic-bezier(.2,.8,.2,1); }
  #sheet[data-state="closed"]{ transform:translateY(110%); }
  #sheet[data-state="collapsed"] #sheetBody{ max-height:min(62dvh, 560px); }
  #sheet[data-state="expanded"] #sheetBody{ max-height:86dvh; }
  #sheetBody{ transition:max-height .3s ease; overscroll-behavior:contain; }

  .toast{ animation:toastIn .3s cubic-bezier(.2,.8,.2,1); }
  .toast.out{ opacity:0; transform:translateY(-8px); transition:all .25s; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(-12px) scale(.96);} to{ opacity:1; transform:none; } }

  .reward-card{ animation:pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop{ from{ transform:scale(.6); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .coin{ animation:coin 1.1s cubic-bezier(.2,.8,.2,1); }
  @keyframes coin{ 0%{ transform:translateY(20px) rotateY(0) scale(.5);} 60%{ transform:translateY(-10px) rotateY(540deg) scale(1.1);} 100%{ transform:translateY(0) rotateY(720deg) scale(1);} }
  .float-pt{ position:fixed; z-index:80; pointer-events:none; font-weight:900; font-size:22px; color:rgb(var(--brand)); animation:floatUp 1.1s ease-out forwards; }
  @keyframes floatUp{ from{ opacity:1; transform:translate(-50%,0) scale(.9);} to{ opacity:0; transform:translate(-50%,-80px) scale(1.25);} }
  .shake{ animation:shake .42s; }
  @keyframes shake{ 20%,60%{ transform:translateX(-6px);} 40%,80%{ transform:translateX(6px);} }

  mark{ background:rgba(79,124,255,.18); color:inherit; border-radius:3px; padding:0 1px; }

  .leaflet-container{ background:rgb(var(--card2)) !important; font-family:inherit; }
  [data-theme="dark"] .leaflet-tile{ filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6); }
  .pin-wrap{ display:flex; justify-content:center; }
  .pin{ display:inline-flex; align-items:center; gap:4px; padding:4px 8px 4px 6px; border-radius:999px; background:var(--c); color:var(--fg,#fff); font-weight:800; font-size:12px; box-shadow:0 3px 8px rgba(0,0,0,.2); border:2px solid #fff; white-space:nowrap; position:relative; }
  .pin::after{ content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); border:5px solid transparent; border-top-color:#fff; }
  .me-dot{ width:18px; height:18px; border-radius:50%; background:#4f7cff; border:3px solid #fff; box-shadow:0 0 0 8px rgba(79,124,255,.22); }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<body class="font-sans">
<div id="app" class="relative mx-auto max-w-[480px] min-h-[100dvh] bg-bg">
  <div id="views" class="pb-[calc(92px+env(safe-area-inset-bottom))]">

    <!-- ============ 탐색 ============ -->
    <section id="view-explore" class="view" aria-label="탐색">
      <header class="hdr rounded-b-[30px] px-4 pb-4 text-white" style="padding-top:calc(env(safe-area-inset-top) + 12px)">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-[14px] bg-brand grid place-items-center" aria-hidden="true">
              <i class="fa-solid fa-square-parking text-white text-lg"></i>
            </div>
            <div>
              <h1 class="text-[19px] font-extrabold leading-tight tracking-tight">파킹뷰</h1>
              <p class="text-[11.5px] text-slate-400 leading-none mt-0.5">목적지별 주차 방법 · 층별 현황</p>
            </div>
          </div>
          <div class="flex gap-1.5">
            <button data-act="toggle-theme" class="press w-11 h-11 rounded-full bg-white/10 border border-white/10 grid place-items-center" aria-label="다크 모드 전환"><i id="themeIcon" class="fa-solid fa-moon" aria-hidden="true"></i></button>
            <button data-act="locate" class="press w-11 h-11 rounded-full bg-white/10 border border-white/10 grid place-items-center" aria-label="현재 위치에서 가장 가까운 주차장 찾기"><i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i></button>
          </div>
        </div>

        <div id="searchWrap" class="relative" role="search">
          <label for="searchInput" class="sr-only">목적지·주차장 검색</label>
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true"></i>
          <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search"
                 placeholder="어디 가세요? (예: 용산 아이파크몰, 현대 판교)"
                 aria-controls="suggest" aria-autocomplete="list"
                 class="w-full h-12 pl-11 pr-12 rounded-2xl bg-white text-slate-900 placeholder:text-slate-500 text-[15px] font-medium outline-none" />
          <button id="searchClear" class="hidden absolute right-1 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full text-slate-400" aria-label="검색어 지우기"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
          <div id="suggest" role="listbox" class="hidden absolute left-0 right-0 top-[calc(100%+8px)] z-40 bg-card text-ink rounded-2xl shadow-xl border border-line overflow-hidden max-h-[60vh] overflow-y-auto"></div>
        </div>

        <div id="chips" class="flex gap-2 overflow-x-auto no-scrollbar mt-3 -mx-4 px-4" aria-label="즐겨찾기 바로가기"></div>
      </header>

      <div id="dashboard" class="px-4 pt-4 space-y-4" aria-live="polite"></div>
    </section>

    <!-- ============ 내 주변 ============ -->
    <section id="view-nearby" class="view hidden" aria-label="내 주변">
      <header class="px-5 pb-3 flex items-end justify-between gap-3" style="padding-top:calc(env(safe-area-inset-top) + 20px)">
        <div class="min-w-0">
          <h1 class="text-[26px] font-extrabold tracking-tight">내 주변</h1>
          <p id="nearbyRef" class="text-[13px] text-sub mt-0.5 truncate"></p>
        </div>
        <button data-act="locate-nearby" class="press h-11 px-4 rounded-full bg-brand text-white text-sm font-bold shrink-0" aria-label="현재 위치 다시 찾기"><i class="fa-solid fa-location-crosshairs mr-1.5" aria-hidden="true"></i>현재 위치</button>
      </header>
      <div id="nearbyBanner" class="px-4"></div>
      <div class="px-4">
        <div class="relative isolate rounded-[26px] overflow-hidden border border-line h-[38vh] min-h-[240px]">
          <div id="map" class="absolute inset-0" role="img" aria-label="주차장 지도"></div>
          <div class="absolute left-3 bottom-3 z-[500] flex gap-2 bg-card/95 rounded-full px-3 py-1.5 border border-line text-[11px] font-semibold" id="mapLegend"></div>
        </div>
      </div>
      <div class="px-4 mt-4 flex items-center justify-between gap-2">
        <h3 class="text-[17px] font-extrabold">등록된 주변 주차장</h3>
        <div class="flex p-1 rounded-full bg-card2 border border-line text-[12.5px] font-bold" id="sortSeg" role="group" aria-label="정렬"></div>
      </div>
      <div id="radiusSeg" class="px-4 mt-2.5 flex gap-2 overflow-x-auto no-scrollbar" role="group" aria-label="검색 반경"></div>
      <div id="nearbyList" class="px-4 mt-3 space-y-2.5 pb-4"></div>
    </section>

    <!-- ============ 제보하기 ============ -->
    <section id="view-report" class="view hidden" aria-label="제보하기">
      <header class="px-5 pb-3" style="padding-top:calc(env(safe-area-inset-top) + 20px)">
        <h1 class="text-[26px] font-extrabold tracking-tight">현장 제보</h1>
        <p class="text-[13px] text-sub mt-0.5">주차장 → 층 → 상황을 고르고 제출하세요</p>
      </header>
      <div class="px-4 space-y-4">
        <div class="rounded-[22px] p-4 flex items-center gap-3 text-white hdr">
          <div class="w-11 h-11 rounded-2xl bg-amber-400 grid place-items-center text-slate-900 shrink-0" aria-hidden="true"><i class="fa-solid fa-coins"></i></div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-[15px]" id="reportPointTitle">제보 1회마다 +50P</p>
            <p class="text-[12px] text-slate-300" id="reportLevelHint"></p>
          </div>
        </div>
        <div class="card p-4 report-form-slot"></div>
        <div>
          <div class="flex items-end justify-between px-1 mb-2.5">
            <h3 class="text-[17px] font-extrabold">실시간 제보 피드</h3>
            <span class="text-[11.5px] text-sub">최근 3시간</span>
          </div>
          <div id="feed" class="card divide-y divide-line overflow-hidden"></div>
        </div>
      </div>
    </section>

    <!-- ============ 마이 ============ -->
    <section id="view-my" class="view hidden" aria-label="마이">
      <header class="px-5 pb-3" style="padding-top:calc(env(safe-area-inset-top) + 20px)">
        <h1 class="text-[26px] font-extrabold tracking-tight">마이</h1>
      </header>
      <div id="myContent" class="px-4 space-y-4 pb-4"></div>
    </section>
  </div>

  <!-- Floating 제보 버튼 -->
  <button id="fab" data-act="open-report" class="press fixed z-30 flex items-center h-14 pl-4 pr-5 rounded-full bg-brand text-white font-bold shadow-lg shadow-blue-600/25" aria-label="지금 주차장 층별 상황 제보하기">
    <i class="fa-solid fa-bullhorn text-lg" aria-hidden="true"></i>
    <span class="fab-label ml-2.5 text-[14px]">지금 여기 계신가요? 층별 제보</span>
  </button>

  <!-- Bottom Tab Bar -->
  <nav id="tabbar" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-40 bg-card/95 backdrop-blur-xl border-t border-line" style="padding-bottom:env(safe-area-inset-bottom)" aria-label="하단 메뉴">
    <div class="grid grid-cols-4 h-[64px]" role="tablist">
      <button class="tab-btn press" data-tab="explore" role="tab" aria-label="탐색"><i class="fa-solid fa-compass" aria-hidden="true"></i><span>탐색</span></button>
      <button class="tab-btn press" data-tab="nearby" role="tab" aria-label="내 주변"><i class="fa-solid fa-location-dot" aria-hidden="true"></i><span>내 주변</span></button>
      <button class="tab-btn tab-cta press" data-tab="report" role="tab" aria-label="제보하기"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i><span>제보하기</span></button>
      <button class="tab-btn press" data-tab="my" role="tab" aria-label="마이"><i class="fa-solid fa-user" aria-hidden="true"></i><span>마이</span><span id="myDot" class="hidden absolute top-2.5 right-[calc(50%-18px)] w-2 h-2 rounded-full bg-red-500" aria-hidden="true"></span></button>
    </div>
  </nav>
</div>

<!-- Bottom Sheet -->
<div id="sheetBackdrop" data-act="close-sheet" class="fixed inset-0 z-50 bg-slate-950/55 opacity-0 pointer-events-none transition-opacity duration-300"></div>
<div class="fixed inset-x-0 bottom-0 z-50 flex justify-center pointer-events-none">
  <div id="sheet" data-state="closed" class="pointer-events-auto w-full max-w-[480px] bg-card rounded-t-[28px] shadow-2xl border-t border-line" role="dialog" aria-modal="true" aria-label="상세 시트">
    <button class="sheet-handle w-full h-11 flex justify-center items-center cursor-grab" data-act="sheet-toggle" aria-label="시트 크게 보기 또는 작게 보기"><span class="w-10 h-1.5 rounded-full bg-line"></span></button>
    <div id="sheetBody" class="px-5 pb-[calc(20px+env(safe-area-inset-bottom))] overflow-y-auto"></div>
  </div>
</div>

<!-- Reward overlay -->
<div id="reward" data-act="close-reward" class="fixed inset-0 z-[70] hidden place-items-center bg-slate-950/60 px-8 overflow-hidden" role="dialog" aria-label="제보 완료"></div>

<!-- Toasts -->
<div id="toasts" class="fixed left-1/2 -translate-x-1/2 z-[90] w-full max-w-[480px] px-4 flex flex-col items-center gap-2 pointer-events-none" style="top:calc(env(safe-area-inset-top) + 12px)" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
 * 파킹뷰 버전 기록 (CHANGELOG)
 *   v1  2026-09-28  첫 프로토타입
 *   v2  2026-09-28  서울시 시영주차장 실시간 연동 (Cloudflare Worker)
 *   v3  2026-09-28  즐겨찾기 바로가기, 버전 표시
 *   v4  2026-09-28  (기획서 v0.2) 층별 UX, 출처 표시, 제보 신뢰도, 어댑터 구조
 *   v5  2026-09-28  (기획서 v2.1) 목적지 → 주차시설 → 층 구조, 검증된 정보만 표시,
 *                   가상 주차장·가상 실시간 변동 제거, 목적지별 주차 가이드(규칙 기반),
 *                   alias 검색, 데모 모드(기본 꺼짐)
 *   v6  2026-09-28  (실시간 데이터 연동 패치) 데이터 소스 레지스트리, dataCapability,
 *                   소스 우선순위, 인천공항 층별 실시간(공공데이터포털) 어댑터,
 *                   교통안전공단 실시간 어댑터(선택), 제휴(PARTNER) 자리, Case A~D UI
 *   v7  2026-09-28  (기획서 V2.1 FINAL) 외부 장소 검색(카카오·티맵)으로 모든 실제 장소 검색,
 *                   목적지·주차장 검색 분리, 주변 실제 주차장(카카오 PK6), DEV_MODE 로 Mock 차단,

/* =====================================================================
 * 3. DATA ADAPTER  —  원천 데이터 → Model
 * ---------------------------------------------------------------------
 * Destination Model
 *   { id, kind:'destination'|'public_lot', name, aliases, keywords, category, address,
 *     lat, lng, facilityIds, guide }
 * Facility Model
 *   { id, destinationId, name, shortName, lat, lng,
 *     floors: [{ id, name, tip }],       // 공식 확인된 구조만
 *     capacity, info: { dataSource, ref } | null, fee, hours, tel }
 * Live (실시간 수치, 소스별 보관 — state.liveBySource[sourceId][facilityId]) → 아래 makeLive 참고
 * ===================================================================== */
const floorName = id => { const m = /^B(\d+)$/.exec(id); if (m) return `지하 ${m[1]}층`; const g = /^(\d+)F$/.exec(id); return g ? `지상 ${g[1]}층` : id; };

/**
 * Guide 정규화 (기획서 24장 구조)
 *   { verified, verifiedAt, summary, alternatives: [{ parkingId, reason, walkingDistance, walkingMinutes,
 *     connection, recommendedWhen, recommendedFloor, source, ref }], warnings, tips, sources }
 * 확인되지 않은 도보거리·시간·연결통로는 null 로 두고 화면에 표시하지 않는다.
 */
function normalizeGuide(g) {
  if (!g) return null;
  const alts = (g.alternatives || g.recommendations || []).map(r => ({
    parkingId: r.parkingId, reason: r.reason || '', recommendedFloor: r.recommendedFloor || null,
    walkingDistance: r.walkingDistance == null ? null : r.walkingDistance,
    walkingMinutes: r.walkingMinutes != null ? r.walkingMinutes : r.walkingTime != null ? r.walkingTime : null,
    connection: r.connection || r.connectionType || null,
    recommendedWhen: r.recommendedWhen || r.condition || 'always',
    source: r.source || null, ref: r.ref || null,
  }));
  return { verified: !!g.verified, verifiedAt: g.verifiedAt || null, summary: g.summary || '',
    alternatives: alts, warnings: g.warnings || [], tips: g.tips || [], sources: g.sources || [] };
}

function buildModelsFromReference() {
  const destinations = [], facilities = [];
  DESTINATIONS_DATA.forEach(d => {

      facilities.push({

        lat: coords ? coords.lat : null, lng: coords ? coords.lng : null,
        floors: (f.floors || []).map(id => ({ id, name: floorName(id), tip: f.floorTips && f.floorTips[id] ? f.floorTips[id] : null })),
        capacity: f.capacity == null ? null : f.capacity,

        hours: f.hours || null, tel: f.tel || null, liveKey: f.liveKey || null,

      category: d.category, address: d.address, lat: d.latitude, lng: d.longitude,

/**
 * Standard Live Model (어댑터 출력 → state.liveBySource[sourceId][facilityId])
 *   { dataSource, provider, updatedAt, realtime,
 *     total, available,                       // 없으면 null
 *     availabilityFlag: 'available'|'limited'|null,   // Case C (가능 여부만 제공)
 *     floors: { [floorId]: { name, total, available } } | null,
 *     floorOrder: [floorId] | null,
 *     capability: { realtime, floorLevel, availableSpaces, occupancy } }
 */
function makeLive(o) {
  const floors = o.floors && Object.keys(o.floors).length ? o.floors : null;
  let total = o.total, available = o.available;
  if (floors && (total == null || available == null)) {
    total = 0; available = 0;
    Object.values(floors).forEach(f => { total += f.total || 0; available += f.available || 0; });
  }
  const hasNums = total != null && available != null && total > 0;
  return {
    dataSource: o.dataSource, provider: o.provider || '', updatedAt: o.updatedAt || Date.now(), realtime: o.realtime !== false,
    total: hasNums ? total : null, available: hasNums ? available : null,
    availabilityFlag: o.availabilityFlag || null, floors, floorOrder: floors ? (o.floorOrder || Object.keys(floors)) : null,
    capability: { realtime: o.realtime !== false, floorLevel: !!floors, availableSpaces: hasNums, occupancy: hasNums },
  };
}

function parseKst(s) { const t = s ? Date.parse(String(s).replace(' ', 'T') + '+09:00') : NaN; return isNaN(t) ? null : t; }

  const m = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?/.exec(String(s || ''));
  return m ? Date.parse(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6] || '00'}+09:00`) : null;
}
function fmtHours(h) {
  if (!h || !h.wdStart) return null;

  if (r.pay === 'N') return { free: true, hourly: 0, per10min: 0 };
  if (!(f.baseMin > 0)) return null;
  const per10 = Math.round((f.baseCharge * 10) / f.baseMin);

function icnAreaKey(label) {

  const term = /T2|제2/.test(s) ? 'T2' : /T1|제1/.test(s) ? 'T1' : null;
  const lot = /단기/.test(s) ? 'SHORT' : /장기|주차타워|P\d/.test(s) ? 'LONG' : null;
  if (!term || !lot) return null;
  let floorId = null;
  const b = /지하(\d)층/.exec(s); if (b) floorId = 'B' + b[1];
  else if (/지상/.test(s)) floorId = '1F';
  const p = /주차타워/.test(s) ? ('타워' + ((/P(\d)/.exec(s) || [])[1] || '')) : (/P(\d)/.exec(s) || [])[0];
  if (!floorId && p) floorId = p;
  return floorId ? { key: `${term}-${lot}`, floorId, name: floorId.startsWith('B') || floorId === '1F' ? floorName(floorId) : String(label).replace(/^.*?(장기|단기)\s*(주차장)?\s*/, '') || floorId } : null;
}

    if (!res.ok) throw new Error('proxy ' + res.status);
    const j = await res.json();
    const body = j.response ? j.response.body : j.body;
    let items = body && body.items ? (body.items.item || body.items) : null;
    if (!items) throw new Error('icn: ' + JSON.stringify(j).slice(0, 160));
    if (!Array.isArray(items)) items = [items];
    const groups = {};
    items.forEach(it => {
      const label = it.floor || it.parkingName || it.parkinglot || it.name;
      const area = icnAreaKey(label);
      const parked = Number(it.parking != null ? it.parking : it.parkingCnt), total = Number(it.parkingarea != null ? it.parkingarea : it.parkingArea);
      if (!area || !(total > 0) || isNaN(parked)) return;
      const g = groups[area.key] || (groups[area.key] = { floors: {}, order: [], at: 0 });
      if (!g.floors[area.floorId]) g.order.push(area.floorId);
      g.floors[area.floorId] = { name: area.name, total, available: Math.max(0, total - parked) };
      g.at = Math.max(g.at, parseCompactKst(it.datetm || it.datetime) || 0);
    });
    const out = emptyOut();
    state.facilities.filter(f => f.liveKey && groups[f.liveKey]).forEach(f => {
      const g = groups[f.liveKey];
      out.live[f.id] = makeLive({ dataSource: 'OFFICIAL_REALTIME', provider: '인천국제공항공사', updatedAt: g.at || Date.now(), floors: g.floors, floorOrder: g.order });
    });
    if (!Object.keys(out.live).length) throw new Error('icn: 매핑된 주차장 없음');
    return out;
  },
};

function categoryFromPlace(p) {
  if (p.group === 'PK6' || /주차장/.test(p.category)) return 'parking';

const PlaceSearchAdapter = {
  cache: new Map(),
  async search(q, near) {
    const key = q + '|' + (near ? near.lat.toFixed(2) + ',' + near.lng.toFixed(2) : '');

    const qs = new URLSearchParams({ q });

    const r = await fetch(`${CONFIG.PROXY_URL}/places/search?${qs}`);

};

/* =====================================================================
 * 5. PARKING CALCULATIONS
 * ===================================================================== */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function calculateOccupancyRate(totalSpaces, availableSpaces) { return totalSpaces ? ((totalSpaces - availableSpaces) / totalSpaces) * 100 : 100; }
function statusFromOccupancy(rate) {
  const r = Math.round(rate);
  if (r >= STATUS_THRESHOLDS.very) return STATUS.very;
  if (r >= STATUS_THRESHOLDS.busy) return STATUS.busy;
  if (r >= STATUS_THRESHOLDS.normal) return STATUS.normal;
  return STATUS.free;
}
/** 0 과 null 을 구분: available === 0 → 만차 / null → 판단 불가(null 반환) */
function statusOf(available, total) {
  if (available == null || total == null || !(total > 0)) return null;
  if (available <= 0) return STATUS.full;
  return statusFromOccupancy(calculateOccupancyRate(total, available));
}
const statusLabel = st => st.label;
const occPct = (total, available) => Math.round(calculateOccupancyRate(total, available));

const getLiveFromSource = (sourceId, facilityId) => (state.liveBySource[sourceId] || {})[facilityId] || null;
/**
 * 실시간 데이터 선택 (합산하지 않고 우선순위가 가장 높은 소스 하나만 사용)
 *   OFFICIAL_REALTIME > PUBLIC_API > PARTNER > (데모 모드일 때만) MOCK
 */
function getLive(facilityId) {
  const f0 = getFacility(facilityId);
  if (f0 && f0.liveRef) return getLive(f0.liveRef); // 외부 주차장 ↔ 실시간 소스 연결
  const cands = Object.values(state.liveBySource).map(m => m[facilityId]).filter(Boolean);
  if (cands.length) return cands.sort((a, b) => LIVE_PRIORITY.indexOf(a.dataSource) - LIVE_PRIORITY.indexOf(b.dataSource))[0];
  return DEV_MODE && Store.data.settings.demo ? demoLive(facilityId) : null;
}
function getFloorLive(facilityId, floorId) { const l = getLive(facilityId); return l && l.floors ? l.floors[floorId] || null : null; }
/** 화면에 그릴 층 목록 = 공식 층 구조 ∪ 실시간 데이터가 제공하는 층 (원본 순서 유지) */
function displayFloors(f) {
  const live = getLive(f.id), list = f.floors.map(x => ({ ...x }));
  if (live && live.floors) (live.floorOrder || Object.keys(live.floors)).forEach(id => { if (!list.some(x => x.id === id)) list.push({ id, name: live.floors[id].name || floorName(id), tip: null }); });
  return list;
}
/** 주차시설이 제공하는 데이터 수준 (기획서 dataCapability) */
function dataCapability(f) {
  const live = getLive(f.id);
  return {
    realtime: !!(live && live.capability.realtime && live.dataSource !== 'MOCK'),
    floorLevel: !!(live && live.capability.floorLevel),
    availableSpaces: !!(live && live.capability.availableSpaces),
    occupancy: !!(live && live.capability.occupancy),
    totalSpaces: !!((live && live.total) || f.capacity),
    updatedAt: !!live,
    floorStructure: f.floors.length > 0,
    source: live ? live.dataSource : f.info ? f.info.dataSource : null,
    caseType: !live ? 'D' : live.capability.floorLevel ? 'A' : live.capability.availableSpaces ? 'B' : live.availabilityFlag ? 'C' : 'D',
  };
}

const minutesSince = ts => (Date.now() - ts) / 60000;
/** 제보 최신성: 0~10 최신 · 10~30 최근 · 30~60 참고 · 60+ 오래된 제보 */
function reportFreshness(ts) {
  const m = minutesSince(ts);
  if (m < 10) return { level: 'latest', icon: '🟢', label: '최신',       cls: 'st-free' };
  if (m < 30) return { level: 'recent', icon: '🟡', label: '최근',       cls: 'st-normal' };
  if (m < 60) return { level: 'ref',    icon: '🟠', label: '참고',       cls: 'st-busy' };
  return { level: 'stale', icon: '⚪', label: '오래된 제보', cls: 'text-sub' };
}
function reportsFor(parkingId, floorId) { return state.reports.filter(r => r.parkingId === parkingId && (!floorId || r.floorId === floorId)); }
function reportSummary(parkingId, floorId) {
  const all = reportsFor(parkingId, floorId).filter(r => minutesSince(r.createdAt) <= CONFIG.FEED_WINDOW_MIN);
  const active = all.filter(r => minutesSince(r.createdAt) <= CONFIG.REPORT_ACTIVE_MIN);
  if (active.length) {
    const avg = Math.round(active.reduce((s, r) => s + minutesSince(r.createdAt), 0) / active.length);
    return { count: active.length, latest: active[0], fresh: reportFreshness(active[0].createdAt), lastReportAt: active[0].createdAt,
      text: `현장 제보 ${active.length}건 · 평균 ${avg < 1 ? '방금' : avg + '분 전'}` };
  }
  if (all.length) return { count: 0, latest: all[0], fresh: reportFreshness(all[0].createdAt), lastReportAt: all[0].createdAt, text: `마지막 제보 ${timeAgo(all[0].createdAt)}` };
  return { count: 0, latest: null, fresh: null, lastReportAt: null, text: '최근 현장 제보 없음' };
}

/**
 * 주차시설의 현재 상태 판단 (규칙 기반)
 *   1) 실시간 수치(live)가 있으면 점유율로 계산
 *   2) 없으면 최근 30분 안의 현장 제보 중 가장 최신 것
 *   3) 둘 다 없으면 unknown
 */
const FLAG_STATUS = { available: { ...STATUS.free, label: '주차 가능' }, limited: { ...STATUS.busy, label: '혼잡 가능성' } };
function facilityStatus(f) {
  const live = getLive(f.id);
  if (live && live.total != null) return { basis: 'live', status: statusOf(live.available, live.total), live, dataSource: live.dataSource, at: live.updatedAt };
  if (live && live.availabilityFlag) return { basis: 'flag', status: FLAG_STATUS[live.availabilityFlag], live, dataSource: live.dataSource, at: live.updatedAt };
  const s = reportSummary(f.id);
  if (s.count) return { basis: 'report', status: STATUS[s.latest.status], dataSource: 'USER_REPORT', at: s.latest.createdAt, summary: s };
  return { basis: 'none', status: null };
}
function floorStatus(f, floor) {
  const live = getLive(f.id), fl = getFloorLive(f.id, floor.id);
  if (fl && statusOf(fl.available, fl.total)) return { basis: 'live', status: statusOf(fl.available, fl.total), live: fl };
  if (live && live.floors) { const s0 = reportSummary(f.id, floor.id); return { basis: 'nodata', status: s0.count ? STATUS[s0.latest.status] : null, summary: s0 }; }
  const s = reportSummary(f.id, floor.id);
  if (s.count) return { basis: 'report', status: STATUS[s.latest.status], summary: s };

}
const isCrowded = st => !!st && ['busy', 'very', 'full'].includes(st.key);
function dataFreshness(live) { if (live.dataSource === 'MOCK') return { stale: false }; return { stale: minutesSince(live.updatedAt) >= CONFIG.DATA_STALE_MIN || live.realtime === false }; }

/* ---- 포맷 ---- */
const fmt = n => Number(n).toLocaleString('ko-KR');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const walkMin = d => Math.max(1, Math.round(d / CONFIG.WALK_M_PER_MIN));
const fmtDist = m => (m < 1000 ? `${Math.round(m)}m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)}km`);
function timeAgo(ts) {
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (s < 10) return '방금'; if (s < 60) return `${s}초 전`;
  const m = Math.floor(s / 60); if (m < 60) return `${m}분 전`;
  const h = Math.floor(m / 60); return h < 24 ? `${h}시간 전` : `${Math.floor(h / 24)}일 전`;
}
function floorRangeText(f) {
  if (!f || !f.floors.length) return null;
  const ids = f.floors.map(x => x.id);
  return ids.length === 1 ? ids[0] : `${ids[0]}~${ids[ids.length - 1]}`;
}


/* =====================================================================
 * 6. GEOLOCATION
 * ===================================================================== */
function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000, toR = x => (x * Math.PI) / 180;
  const dLat = toR(lat2 - lat1), dLon = toR(lon2 - lon1);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const hasCoords = p => p && typeof p.lat === 'number' && typeof p.lng === 'number' && !isNaN(p.lat);
const distanceBetween = (a, b) => (hasCoords(a) && hasCoords(b) ? calculateDistance(a.lat, a.lng, b.lat, b.lng) : null);

const Geo = {
  locate() {
    return new Promise(resolve => {
      if (!navigator.geolocation) { state.geo = { status: 'unavailable', pos: null }; resolve(null); return; }
      state.geo.status = 'locating';
      navigator.geolocation.getCurrentPosition(p => {
        state.geo = { status: 'granted', pos: { lat: p.coords.latitude, lng: p.coords.longitude } }; resolve(state.geo.pos);
      }, err => { state.geo = { status: err && err.code === 1 ? 'denied' : 'unavailable', pos: null }; resolve(null); },
      { enableHighAccuracy: true, timeout: 9000, maximumAge: 30000 });
    });
  },
};
function refPoint() {
  if (state.geo.pos) return { ...state.geo.pos, kind: 'gps', label: '현재 위치' };
  const d = getDestination(state.selectedDestId);
  if (d && hasCoords(d)) return { lat: d.lat, lng: d.lng, kind: 'dest', label: d.name };
  return { ...CONFIG.DEFAULT_LOCATION, kind: 'default' };
}


/* =====================================================================
 * 7. SEARCH  —  name · aliases · address · category · keywords
 * 우선순위: 정확한 이름 > alias 일치 > 이름 일부 > 주소 > 키워드
 * ===================================================================== */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const toCho = s => [...s].map(c => { const k = c.charCodeAt(0) - 0xac00; return k >= 0 && k <= 11171 ? CHO[Math.floor(k / 588)] : c; }).join('');
const isChoOnly = s => /^[ㄱ-ㅎ\s]+$/.test(s);
const norm = s => String(s || '').toLowerCase().replace(/\s/g, '');

function scoreDestination(d, q) {
  const n = norm(q); if (!n) return 0;
  const tokens = String(q).toLowerCase().split(/\s+/).filter(Boolean);
  const name = norm(d.name), aliases = d.aliases.map(norm), addr = norm(d.address);
  const cat = CATEGORY[d.category] ? norm(CATEGORY[d.category].label) : '';
  const kws = d.keywords.map(norm);
  const hay = [name, ...aliases, addr, cat, ...kws].join('|');
  if (name === n) return 1000;
  if (aliases.includes(n)) return 900;
  if (name.startsWith(n)) return 800;
  if (name.includes(n)) return 700;
  if (aliases.some(a => a.includes(n) || (n.length >= 3 && n.includes(a)))) return 600;
  if (tokens.length > 1 && tokens.every(t => hay.includes(norm(t)))) return 550; // "판교 현대", "현대 판교"
  if (isChoOnly(q) && (toCho(name).includes(n) || aliases.some(a => toCho(a).includes(n)))) return 500;
  if (addr.includes(n)) return 400;
  if (kws.some(k => k.includes(n)) || cat.includes(n)) return 300;
  return 0;
}
function searchDestinations(q, limit = CONFIG.SEARCH_LIMIT) {
  if (!norm(q)) return [];
  return state.destinations.map(d => ({ d, s: scoreDestination(d, q) + (d.kind === 'destination' ? 5 : 0) }))
    .filter(x => x.s > 5).sort((a, b) => b.s - a.s || a.d.name.localeCompare(b.d.name, 'ko')).slice(0, limit).map(x => x.d);
}
/** PARKING SEARCH — 주차시설 이름으로도 검색 (목적지와 독립) */
function searchFacilities(q, limit = CONFIG.SEARCH_LIMIT) {
  const n = norm(q); if (!n) return [];
  return state.facilities.filter(f => !f.external).map(f => {
    const d = destinationOfFacility(f), name = norm(f.name);
    if (d && d.kind === 'public_lot') return null; // 공영주차장은 목적지 결과로 이미 노출
    const s = name === n ? 950 : name.startsWith(n) ? 750 : name.includes(n) ? 650 : (isChoOnly(q) && toCho(name).includes(n)) ? 450 : 0;
    return s ? { f, s } : null;
  }).filter(Boolean).sort((a, b) => b.s - a.s).slice(0, limit).map(x => x.f);
}
/** 외부 장소 결과 중 내부 목적지·주차장과 같은 곳(200m 이내 + 이름 유사)은 내부 것으로 합친다 */
function dedupeExternal(places, internalDests, internalFacs) {
  return places.filter(p => ![...internalDests.filter(x => x.kind !== 'external'), ...internalFacs.filter(x => !x.external)].some(x => hasCoords(x) && calculateDistance(x.lat, x.lng, p.lat, p.lng) <= 200 &&
    (nameSimilar(x.name, p.name) || (x.aliases || []).some(a => nameSimilar(a, p.name)))));
}
/**
 * 통합 검색: Destination 검색 + Parking Facility 검색을 독립적으로 수행 후 합침.
 * 우선순위: 정확 일치 목적지 → 정확 일치 주차장 → 유사 목적지 → 유사 주차장 → 외부 장소
 */
function searchAll(q) {
  const dests = searchDestinations(q, 10), facs = searchFacilities(q, 5);
  const ext = state.search.q === q && state.search.external ? dedupeExternal(state.search.external.places, state.destinations, state.facilities) : [];
  const extDest = ext.filter(p => p.kind !== 'parking'), extPark = ext.filter(p => p.kind === 'parking');
  const exactD = dests.filter(d => scoreDestination(d, q) >= 900), exactF = facs.filter(f => norm(f.name) === norm(q));
  const rest = [...dests.filter(d => !exactD.includes(d)).map(d => ({ type: 'dest', d })), ...facs.filter(f => !exactF.includes(f)).map(f => ({ type: 'fac', f }))];
  const items = [...exactD.map(d => ({ type: 'dest', d })), ...exactF.map(f => ({ type: 'fac', f })), ...rest,
    ...extDest.map(p => ({ type: 'place', p })), ...extPark.map(p => ({ type: 'placeParking', p }))];
  return items.slice(0, 8);
}
function highlight(text, q) {
  const safe = esc(text);
  if (!q || isChoOnly(q)) return safe;
  const e = esc(q.trim()); const i = safe.toLowerCase().indexOf(e.toLowerCase());
  return i < 0 ? safe : `${safe.slice(0, i)}<mark>${safe.slice(i, i + e.length)}</mark>${safe.slice(i + e.length)}`;
}
function rememberQuery(q) { q = String(q || '').trim(); if (!q) return; Store.data.recentQueries = [q, ...Store.data.recentQueries.filter(x => x !== q)].slice(0, 6); Store.save(); }
function rememberDestination(id) { Store.data.recentDestinations = [id, ...Store.data.recentDestinations.filter(x => x !== id)].slice(0, 5); Store.save(); }


/* =====================================================================
 * 8. GUIDE ENGINE  —  규칙 기반 (AI 아님)
 * ---------------------------------------------------------------------
 *   primary 혼잡/만차        → 대체 안내 활성화
 *   hasConnection            → "목적지 연결통로" 이유
 *   walkingTime <= 5         → "도보 N분" 이유 (값이 있을 때만)
 *   alt.live 존재            → "현재 여유 좌석 N석"
 *   alt 점유율 < primary 점유율(둘 다 live) → "현재 본관보다 여유"
 *   source OFFICIAL          → "공식 주차 안내 기반"
 * 데이터가 없는 항목은 이유로 쓰지 않는다.
 * ===================================================================== */
function evaluateGuide(dest, primary) {
  if (!dest || !dest.guide) return null;
  const g = dest.guide;
  const pst = primary ? facilityStatus(primary) : { status: null };
  const primaryBusy = isCrowded(pst.status);
  const pLive = primary ? getLive(primary.id) : null;
  const recs = g.alternatives.map(rec => {
    const alt = getFacility(rec.parkingId);
    if (!alt || (primary && alt.id === primary.id)) return null;
    const active = rec.recommendedWhen === 'always' || (rec.recommendedWhen === 'when_primary_busy' && primaryBusy);
    const aLive = getLive(alt.id);
    const reasons = [];
    if (rec.connection === 'indoor') reasons.push({ icon: 'fa-link', text: '목적지 연결통로' });
    if (rec.walkingMinutes != null && rec.walkingMinutes <= 5) reasons.push({ icon: 'fa-person-walking', text: `도보 약 ${rec.walkingMinutes}분` });
    if (hasNumbers(aLive)) reasons.push({ icon: 'fa-square-parking', text: `현재 여유 좌석 ${fmt(aLive.available)}석` });
    const moreRoom = !!(hasNumbers(aLive) && hasNumbers(pLive) && (aLive.available / aLive.total) > (pLive.available / pLive.total));
    if (moreRoom) reasons.push({ icon: 'fa-arrow-trend-down', text: `현재 ${primary.shortName}보다 여유` });
    if (rec.source === 'OFFICIAL') reasons.push({ icon: 'fa-building-circle-check', text: '공식 주차 안내 기반' });
    return { rec, alt, active, reasons, moreRoom, aLive };
  }).filter(Boolean);
  return { dest, primary, primaryStatus: pst, primaryBusy, verified: g.verified, verifiedAt: g.verifiedAt, summary: g.summary, recs,
    warnings: g.warnings || [], tips: g.tips || [], sources: g.sources || [] };
}
const hasNumbers = l => !!(l && l.total != null && l.available != null);

/**
 * 대체 주차장 (실데이터·검증 정보만)
 *   ① 검증 Guide 대안  ② 같은 목적지의 다른 공식 주차장  ③ 반경 500m 안의 "실시간 데이터가 있는" 등록 주차장
 * 실시간 정보가 없는 외부(카카오) 주차장은 '주변 주차장' 섹션에서 따로 보여준다.
 * 정렬: 연결 동선 → Guide 검증 → 실제 잔여석 있음 → 상태 → 데이터 최신성 → 거리  (없는 값은 비교에서 제외)
 */
function getAlternatives(dest, primary) {
  const guide = evaluateGuide(dest, primary);
  const map = new Map();
  const add = (f, extra = {}) => {
    if (!f || (primary && f.id === primary.id)) return;
    const cur = map.get(f.id) || { f, connection: false, sameDestination: false, guideRec: null };
    Object.assign(cur, extra); map.set(f.id, cur);
  };
  facilitiesOf(dest).forEach(f => add(f, { sameDestination: true }));
  if (guide) guide.recs.forEach(g => add(g.alt, { guideRec: g, connection: g.rec.connection === 'indoor' }));
  const origin = primary && hasCoords(primary) ? primary : dest;
  state.facilities.forEach(f => {
    if (f.external && !f.liveRef) return;
    const d = distanceBetween(origin, f);
    if (d != null && d <= CONFIG.ALT_RADIUS_M && hasNumbers(getLive(f.id))) add(f);
  });
  const pLive = primary ? getLive(primary.id) : null;
  return [...map.values()].map(c => {
    const d = distanceBetween(origin, c.f);
    const st = facilityStatus(c.f), live = getLive(c.f.id);
    const reasons = c.guideRec ? [...c.guideRec.reasons] : [];
    if (!c.guideRec) {
      if (c.sameDestination) reasons.push({ icon: 'fa-building', text: `${dest.name} 주차시설` });
      if (d != null && d > 0 && walkMin(d) <= 5) reasons.push({ icon: 'fa-person-walking', text: `도보 약 ${walkMin(d)}분` });
      if (hasNumbers(live)) reasons.push({ icon: 'fa-square-parking', text: `현재 여유 좌석 ${fmt(live.available)}석` });
      if (hasNumbers(live) && hasNumbers(pLive) && live.available / live.total > pLive.available / pLive.total) reasons.push({ icon: 'fa-arrow-trend-down', text: '현재 더 여유' });
      if (live && live.dataSource !== 'MOCK') reasons.push({ icon: DATA_SOURCE[live.dataSource].icon, text: DATA_SOURCE[live.dataSource].label });
    }
    return { ...c, d, status: st, live, reasons, verifiedGuide: !!(c.guideRec && guide && guide.verified) };
  }).filter(c => !(hasNumbers(c.live) && c.live.available === 0))
    .sort((a, b) => (b.connection - a.connection) || (b.verifiedGuide - a.verifiedGuide)
      || ((hasNumbers(b.live) ? 1 : 0) - (hasNumbers(a.live) ? 1 : 0))
      || ((a.status.status ? STATUS_ORDER.indexOf(a.status.status.key) : 9) - (b.status.status ? STATUS_ORDER.indexOf(b.status.status.key) : 9))
      || ((a.live && dataFreshness(a.live).stale ? 1 : 0) - (b.live && dataFreshness(b.live).stale ? 1 : 0))
      || ((a.d == null ? 1e9 : a.d) - (b.d == null ? 1e9 : b.d)));
}

/** 목적지 주변 실제 주차장 (카카오 PK6). 실시간 소스와 같은 주차장이면(40m 이내 + 이름 유사) liveRef 로 연결 */
const nameSimilar = (a, b) => { const x = norm(a).replace(/주차장|공영|\(시\)|\(구\)/g, ''), y = norm(b).replace(/주차장|공영|\(시\)|\(구\)/g, ''); return !!x && !!y && (x.includes(y) || y.includes(x)); };
async function loadNearbyParking(dest, radius = CONFIG.NEARBY_PARKING_RADIUS) {
  if (!dest || !hasCoords(dest)) return;
  state.nearby = { destId: dest.id, radius, status: 'loading', ids: [] };
  try {
    const places = await NearbyParkingAdapter.around(dest.lat, dest.lng, radius);
    const ids = [];
    places.forEach(p => {
      let f = getFacility('pk-' + p.id);
      if (!f) { f = facilityFromPlace(p); state.facilities.push(f); }
      const live = state.facilities.find(x => !x.external && hasCoords(x) && hasNumbers(getLive(x.id)) && calculateDistance(x.lat, x.lng, p.lat, p.lng) <= 40 && nameSimilar(x.name, p.name));
      f.liveRef = live ? live.id : null;
      if (!facilitiesOf(dest).some(o => o.id === f.id || (o.id === f.liveRef))) ids.push(f.id);
    });
    if (state.nearby.destId === dest.id) state.nearby = { destId: dest.id, radius, status: 'ok', ids };
    dest.nearbyParkingIds = ids;
  } catch (e) {
    console.warn('주변 주차장 로드 실패', e && e.message);
    if (state.nearby.destId === dest.id) state.nearby = { destId: dest.id, radius, status: 'error', ids: [] };
  }
}


/* =====================================================================
 * 9. REPORT SYSTEM
 * ===================================================================== */
function lastMyReport(parkingId, floorId) { return state.reports.find(r => r.mine && r.parkingId === parkingId && r.floorId === floorId) || null; }
function pointEligibility(parkingId, floorId) {
  const last = lastMyReport(parkingId, floorId);
  if (!last) return { eligible: true, waitMin: 0 };
  const passed = minutesSince(last.createdAt);
  return passed >= CONFIG.POINT_COOLDOWN_MIN ? { eligible: true, waitMin: 0 } : { eligible: false, waitMin: Math.ceil(CONFIG.POINT_COOLDOWN_MIN - passed) };
}
/** 제보 저장: LocalStorage → [교체 지점] SupabaseStorageAdapter.insertReport (parking_reports) */
function submitReport({ parkingId, floorId, status }) {
  const elig = pointEligibility(parkingId, floorId);
  const points = elig.eligible ? CONFIG.REPORT_POINT : 0;
  const now = Date.now();
  const stored = { id: 'u' + now, parkingId, floorId, status, createdAt: toIso(now), points };
  Store.data.reports = [stored, ...Store.data.reports].slice(0, 300);
  state.reports.unshift({ ...stored, createdAt: now, mine: true, nick: '나' });
  const before = levelOf(Store.data.user.points);
  awardPoints(points);
  Store.data.user.reportCount += 1;
  const newBadges = checkBadges();
  Store.save();
  if (CONFIG.STORAGE_BACKEND === 'supabase') SupabaseStorageAdapter.insertReport(stored).catch(e => console.warn(e));
  const after = levelOf(Store.data.user.points);
  return { report: stored, pointsAwarded: points, limited: !elig.eligible, levelUp: after.idx > before.idx ? after.cur : null, newBadges };
}

}

 * 11. NAVIGATION  —  앱 딥링크 + 웹 fallback (좌표가 없으면 이름 검색)
 * ===================================================================== */
function buildNavLinks(target) {
  const n = encodeURIComponent(target.name);
  const app = encodeURIComponent(location.hostname || 'parkingview');
  if (!hasCoords(target)) {
    return {
      tmap:  { app: `tmap://search?name=${n}`, web: `https://map.kakao.com/?q=${n}` },
      kakao: { app: `kakaomap://search?q=${n}`, web: `https://map.kakao.com/?q=${n}` },
      naver: { app: `nmap://search?query=${n}&appname=${app}`, web: `https://map.naver.com/p/search/${n}` },
    };
  }
  return {
    tmap:  { app: `tmap://route?goalname=${n}&goalx=${target.lng}&goaly=${target.lat}`, web: `https://map.kakao.com/link/to/${n},${target.lat},${target.lng}` },
    kakao: { app: `kakaomap://route?ep=${target.lat},${target.lng}&by=CAR`, web: `https://map.kakao.com/link/to/${n},${target.lat},${target.lng}` },
    naver: { app: `nmap://route/car?dlat=${target.lat}&dlng=${target.lng}&dname=${n}&appname=${app}`, web: `https://map.naver.com/p/search/${n}` },
  };
}
function navTargetOf(id) {
  const f = getFacility(id);
  if (f) { const d = destinationOfFacility(f); return { name: f.name, lat: f.lat, lng: f.lng, fallbackName: d ? d.name : f.name }; }
  const d = getDestination(id);
  return d ? { name: d.name, lat: d.lat, lng: d.lng } : null;
}
function openNavigation(appId, target) {
  const link = buildNavLinks(target)[appId];
  if (!link) return;
  if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) { window.open(link.web, '_blank', 'noopener'); return; }
  let timer = null;
  document.addEventListener('visibilitychange', () => { if (document.hidden && timer) clearTimeout(timer); }, { once: true });
  timer = setTimeout(() => { if (!document.hidden) window.open(link.web, '_blank', 'noopener'); }, 1400);
  window.location.href = link.app;
}

/* ---- 12-2. Bottom Sheet (closed / collapsed / expanded) ---- */
const Sheet = {
  state: 'closed',
  open(html, size = 'collapsed') {
    $('#sheetBody').innerHTML = html; $('#sheetBody').scrollTop = 0; this.set(size);
    $('#sheetBackdrop').classList.remove('pointer-events-none'); $('#sheetBackdrop').style.opacity = '1';
    document.body.style.overflow = 'hidden'; state.sheetOpen = true;
  },
  set(size) { this.state = size; const el = $('#sheet'); el.dataset.state = size; el.style.transform = size === 'closed' ? '' : 'translateY(0)'; },
  toggleSize() { if (this.state !== 'closed') this.set(this.state === 'expanded' ? 'collapsed' : 'expanded'); },
  close() {
    if (this.state === 'closed') return;
    this.set('closed'); $('#sheetBackdrop').classList.add('pointer-events-none'); $('#sheetBackdrop').style.opacity = '0';
    document.body.style.overflow = ''; state.sheetOpen = false;
  },
};
(function sheetDrag() {
  const sheet = $('#sheet'); let y0 = null, dy = 0, moved = false;
  sheet.addEventListener('touchstart', e => { if (!e.target.closest('.sheet-handle')) return; y0 = e.touches[0].clientY; dy = 0; moved = false; sheet.style.transition = 'none'; }, { passive: true });
  sheet.addEventListener('touchmove', e => { if (y0 === null) return; dy = e.touches[0].clientY - y0; moved = Math.abs(dy) > 6; if (dy > 0) sheet.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sheet.addEventListener('touchend', e => {
    if (y0 === null) return; sheet.style.transition = '';
    if (dy > 110) { Sheet.state === 'expanded' && dy < 260 ? Sheet.set('collapsed') : Sheet.close(); }
    else if (dy < -50) Sheet.set('expanded'); else sheet.style.transform = 'translateY(0)';
    if (moved) { e.preventDefault(); Sheet._justDragged = Date.now(); }
    y0 = null;
  });
})();

function facilityCardHTML(d, f) {
  const fst = facilityStatus(f), live = getLive(f.id), cap = dataCapability(f);
  const hasNums = !!(live && live.total != null);
  const fr = floorRangeText(f);
  const infoBits = [];
  if (fr) infoBits.push(`🅿️ 주차 ${fr}`);
  if (f.capacity) infoBits.push(`총 ${fmt(f.capacity)}대`);
  const extras = [];
  if (f.fee) extras.push(['1시간', f.fee.free ? '무료' : f.fee.hourly ? `${fmt(f.fee.hourly)}원` : null], ['10분당', f.fee.free ? '무료' : f.fee.per10min ? `${fmt(f.fee.per10min)}원` : null]);
  if (f.hours) extras.push(['운영', f.hours]);
  if (f.tel) extras.push(['문의', f.tel]);
  const extrasShown = extras.filter(x => x[1]);
  const floorsLive = live && live.floors ? displayFloors(f).filter(fl => live.floors[fl.id]) : [];
  const slabs = floorsLive.map(fl => { const x = live.floors[fl.id], s = statusOf(x.available, x.total);
    return `<div class="slab"><i style="width:${Math.max(occPct(x.total, x.available), 24)}%;background:${s.color}"></i><b>${esc(fl.id)}</b><em class="tnum">${x.available}</em></div>`; }).join('');

  let body;
  if (hasNums) {
    body = `
      <div class="mt-4 flex items-end gap-4">
        <div class="flex-1 min-w-0">
          <p class="text-[12px] text-sub font-semibold">${cap.caseType === 'A' ? '실시간 주차 현황 · 층별 합계' : '실시간 잔여석'}</p>
          <p class="leading-none mt-1.5 whitespace-nowrap"><span class="text-[46px] font-black tnum tracking-tighter st-${fst.status.key}">${fmt(live.available)}</span><span class="text-[15px] text-sub font-bold ml-1">/ ${fmt(live.total)}대</span></p>
          <p class="text-[12.5px] text-sub mt-2">현재 총 <b class="text-ink tnum">${fmt(live.available)}대</b> 여유 · 점유율 <b class="text-ink tnum">${occPct(live.total, live.available)}%</b></p>
        </div>
        ${slabs ? `<div class="w-[42%] max-w-[170px]"><div class="tower" aria-hidden="true">${slabs}</div></div>` : ''}
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-1.5">${liveSourceLine(live)}${cap.caseType === 'B' ? '<span class="text-[11px] text-sub">층별 데이터 없음 · 전체 잔여석만 제공</span>' : ''}</div>`;
  } else if (live && live.availabilityFlag) {
    body = `<div class="mt-4 rounded-2xl bg-card2 border border-line p-4"><p class="font-bold text-[15px]">${statusPill(fst.status)}</p>
      <p class="text-[12.5px] text-sub mt-2">이 데이터는 주차 가능 여부만 제공해요. 잔여석 숫자는 제공되지 않아요.</p><div class="mt-2">${liveSourceLine(live)}</div></div>`;
  } else {
    body = `
      <div class="mt-4 rounded-2xl bg-card2 border border-line p-4">
        <p class="font-bold text-[14.5px]">⚪ 실시간 잔여석 데이터가 없습니다</p>
        <p class="text-[12.5px] text-sub mt-1 leading-snug">이 주차장은 실시간 데이터가 연결되지 않았어요. 숫자를 추정해서 보여드리지 않습니다.</p>
        ${fst.basis === 'report' ? `<p class="mt-2.5 text-[12.5px] flex flex-wrap items-center gap-1.5"><span class="font-bold">🔵 현장 제보</span>${statusPill(fst.status)}<span class="text-sub"><span data-ago="${fst.at}">${timeAgo(fst.at)}</span> · ${fst.summary.text}</span></p>` : ''}
        ${DEV_MODE && !Store.data.settings.demo && DEMO_AVAILABILITY[f.id] ? '<button data-act="toggle-demo" class="mt-2 h-9 text-[12px] font-bold text-brand">데모 수치로 기능 미리보기</button>' : ''}
      </div>`;
  }

  return `
  <section class="card overflow-hidden" aria-label="${esc(f.name)} 현황">
    <div class="p-5">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0"><p class="text-[12px] text-sub font-semibold">주차시설</p><h3 class="text-[17px] font-extrabold leading-tight mt-0.5">${esc(f.name)}</h3>
          <p class="text-[12px] text-sub mt-1">${infoBits.length ? infoBits.join(' · ') : '층·규모 정보 미등록'}</p></div>
        ${fst.status ? statusPill(fst.status, hasNums ? live.available : 1, 'shrink-0') : noLivePill('상태 미확인', 'shrink-0')}
      </div>
      ${body}
      ${f.info && f.info.dataSource === 'OFFICIAL' ? `<p class="mt-3 text-[11.5px] text-sub">⚪ 시설 정보 · ${refLink(f.info.ref)}</p>` : ''}
      ${f.external ? `<p class="mt-3 text-[11.5px] text-sub">⚪ 시설 정보 · ${esc(f.info.provider)}${f.address ? ` · ${esc(f.address)}` : ''}</p>` : ''}
      ${capabilityPanelHTML(f)}
    </div>
    ${extrasShown.length ? `<div class="grid border-t border-line divide-x divide-line text-center" style="grid-template-columns:repeat(${extrasShown.length},minmax(0,1fr))">
      ${extrasShown.map(([k, v]) => `<div class="py-3 px-1"><p class="text-[11px] text-sub">${k}</p><p class="text-[13.5px] font-bold mt-0.5 tnum truncate">${esc(v)}</p></div>`).join('')}</div>` : ''}

      <button data-act="nav" data-id="${f.id}" class="press h-12 rounded-2xl bg-brand text-white font-bold text-[14.5px]"><i class="fa-solid fa-route mr-1.5" aria-hidden="true"></i>길안내</button>
      <button data-act="open-report" data-id="${f.id}" class="press h-12 rounded-2xl bg-card2 border border-line font-bold text-[14.5px]"><i class="fa-solid fa-bullhorn mr-1.5 text-brand" aria-hidden="true"></i>현장 제보</button>
    </div>
  </section>`;
}

      </div>
      ${r.rec.reason ? `<p class="mt-1.5 text-[12.5px]">${esc(r.rec.reason)}</p>` : ''}
      ${r.reasons.length ? `<p class="mt-2 text-[11.5px] font-bold text-sub">${g.verified ? 'ParkingView 추천 이유' : '안내 근거'}</p><ul class="mt-1 space-y-0.5">${r.reasons.map(x => `<li class="text-[12.5px] flex items-center gap-1.5"><i class="fa-solid fa-check st-free text-[11px]" aria-hidden="true"></i>${esc(x.text)}</li>`).join('')}</ul>` : ''}

    <p class="mt-2 text-[13.5px] leading-snug">${esc(g.summary)}</p>
    ${activeRecs.length ? `<p class="mt-3 text-[12.5px] font-bold st-busy"><i class="fa-solid fa-triangle-exclamation mr-1" aria-hidden="true"></i>현재 ${esc(f.shortName)} 주차장이 ${g.primaryStatus.status.label} 상태예요. ${g.verified ? '아래 주차장을 고려해보세요.' : '아래 안내를 참고하되, 현장 상황을 확인하세요.'}</p>
      <div class="mt-2 space-y-2">${activeRecs.map(r => recHTML(r, true)).join('')}</div>` : ''}

    ${g.tips.length ? `<div class="mt-3 space-y-2">${g.tips.map(t => `<div class="rounded-xl bg-amber-500/[.08] border border-amber-500/20 px-3 py-2.5 text-[12.5px]"><p class="leading-snug">${esc(t.text)}</p><p class="mt-1.5">${sourceTag(t.source)}</p></div>`).join('')}</div>` : ''}

function floorCardHTML(f, floor, bestId) {
  const fs = floorStatus(f, floor), st = fs.status, rep = reportSummary(f.id, floor.id);
  const repLine = rep.latest
    ? `<span class="inline-flex items-center gap-1 font-bold ${rep.fresh.cls}">${rep.fresh.icon} ${rep.fresh.label}</span><span class="text-sub">· ${rep.text} · <b class="st-${rep.latest.status}">${STATUS[rep.latest.status].label}</b></span>`
    : `<span class="text-sub">${rep.text}</span>`;
  const tip = floor.tip ? `<div class="mt-3 rounded-xl bg-amber-500/[.08] border border-amber-500/20 px-3 py-2.5 text-[12.5px]"><p class="leading-snug"><i class="fa-solid fa-lightbulb text-amber-500 mr-1.5" aria-hidden="true"></i>${esc(floor.tip.text)}</p><p class="mt-1.5">${sourceTag(floor.tip.source)}</p></div>` : '';
  const badge = `<div class="w-12 h-12 rounded-2xl grid place-items-center font-black text-[15px] shrink-0 ${st ? '' : 'bg-card2 border border-line text-sub'}" style="${st ? `background:${st.color};color:${st.onColor}` : ''}" aria-hidden="true">${esc(floor.id)}</div>`;
  if (fs.basis === 'live') {
    const x = fs.live, occ = occPct(x.total, x.available), live = getLive(f.id), isBest = floor.id === bestId && st.key !== 'full';
    const updatedAt = Math.max(live.updatedAt, rep.lastReportAt || 0);
    return `
    <article class="card p-4 ${isBest ? 'ring-2 ring-emerald-500/40' : ''}" aria-label="${esc(floor.id)} 잔여 ${x.available} / ${x.total}석, ${statusLabel(st, x.available)}">
      <div class="flex items-center gap-3">${badge}
        <div class="flex-1 min-w-0"><div class="flex items-center gap-1.5 flex-wrap"><h4 class="font-bold text-[15.5px]">${esc(floor.id === floor.name ? floor.id : floor.id + ' · ' + floor.name)}</h4>${isBest ? '<span class="text-[10.5px] font-bold st-free bg-emerald-500/10 px-1.5 py-0.5 rounded-md">가장 여유</span>' : ''}</div>
          <p class="text-[12px] mt-0.5 flex items-center gap-1.5">${statusPill(st, x.available, '!text-[11px]')}<span class="text-sub">점유율 <b class="text-ink tnum">${occ}%</b></span></p></div>
        <div class="text-right shrink-0"><p class="leading-none whitespace-nowrap"><span class="text-[28px] font-black tnum st-${st.key}">${fmt(x.available)}</span><span class="text-[13px] text-sub font-semibold"> / ${fmt(x.total)}</span></p><p class="text-[10.5px] text-sub mt-1">잔여 / 전체</p></div>
      </div>
      <div class="bar mt-3.5" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${occ}" aria-label="점유율 ${occ}%"><span style="width:${occ}%;background:${st.color}"></span></div>
      ${tip}
      <div class="mt-3 pt-2.5 border-t border-line flex flex-wrap items-center justify-between gap-x-3 gap-y-1 text-[11.5px]">
        <span class="flex flex-wrap items-center gap-1"><i class="fa-solid fa-user-check text-sub" aria-hidden="true"></i>${repLine}</span>
        <span class="text-sub">${(DATA_SOURCE[live.dataSource] || DATA_SOURCE.MOCK).dot} ${live.dataSource === 'MOCK' ? '프로토타입 데이터' : (DATA_SOURCE[live.dataSource] || {}).short} · 업데이트 <span data-ago="${updatedAt}">${timeAgo(updatedAt)}</span></span>
      </div>
    </article>`;
  }
  const noDataText = fs.basis === 'nodata' ? '데이터 없음 · 이 층은 실시간 데이터가 제공되지 않아요' : '실시간 잔여석 확인 불가';
  return `
  <article class="card p-4" aria-label="${esc(floor.id)} ${noDataText}">
    <div class="flex items-center gap-3">${badge}
      <div class="flex-1 min-w-0"><h4 class="font-bold text-[15.5px]">${esc(floor.id === floor.name ? floor.id : floor.id + ' · ' + floor.name)}</h4>
        <p class="text-[12px] text-sub mt-0.5">${noDataText}</p></div>
      ${st ? `<div class="text-right shrink-0"><p class="text-[10.5px] text-sub mb-1">현장 제보</p>${statusPill(st)}</div>` : ''}
    </div>
    ${tip}
    <div class="mt-3 pt-2.5 border-t border-line flex flex-wrap items-center justify-between gap-x-3 gap-y-1 text-[11.5px]">
      <span class="flex flex-wrap items-center gap-1"><i class="fa-solid fa-user-check text-sub" aria-hidden="true"></i>${repLine}</span>
      ${rep.lastReportAt ? `<span class="text-sub">업데이트 <span data-ago="${rep.lastReportAt}">${timeAgo(rep.lastReportAt)}</span></span>` : ''}
    </div>
  </article>`;
}

function nearbyParkingSectionHTML(dest) {
  const nb = state.nearby.destId === dest.id ? state.nearby : { status: 'idle', ids: [], radius: CONFIG.NEARBY_PARKING_RADIUS };
  const head = `<div class="flex items-end justify-between mb-2.5 px-1"><div><h3 class="text-[17px] font-extrabold">주변 주차장</h3>
      <p class="text-[12px] text-sub mt-0.5">목적지 반경 ${fmtDist(nb.radius || CONFIG.NEARBY_PARKING_RADIUS)} · ⚪ 시설 정보 (카카오 장소)</p></div>${nb.status === 'ok' ? `<span class="text-[12px] font-bold text-brand">${nb.ids.length}곳</span>` : ''}</div>`;
  let body;
  if (!hasCoords(dest)) body = '<div class="card p-5 text-[13px] text-sub">목적지 좌표가 없어 주변 주차장을 찾을 수 없어요.</div>';
  else if (nb.status === 'loading' || nb.status === 'idle') body = `<div class="card p-3.5 flex items-center gap-3" aria-busy="true"><div class="skel w-11 h-11 !rounded-2xl"></div><div class="flex-1 space-y-2"><div class="skel h-4 w-2/3"></div><div class="skel h-3 w-1/3"></div></div></div>`;
  else if (nb.status === 'error') body = `<div class="card p-5 text-center" role="alert"><p class="text-[13.5px] font-semibold">주변 주차장 정보를 불러오지 못했습니다.</p><button data-act="nearby-retry" class="press mt-3 h-11 px-4 rounded-full bg-card2 border border-line text-[13px] font-bold">다시 시도</button></div>`;
  else if (!nb.ids.length) body = `<div class="card p-5 text-center"><p class="text-[13.5px] font-semibold">주변 ${fmtDist(nb.radius)} 안에 등록된 주차장이 없습니다.</p>
      ${nb.radius < CONFIG.NEARBY_PARKING_RADIUS_MAX ? `<button data-act="nearby-expand" class="press mt-3 h-11 px-4 rounded-full bg-card2 border border-line text-[13px] font-bold">반경 ${fmtDist(CONFIG.NEARBY_PARKING_RADIUS_MAX)}로 넓히기</button>` : ''}</div>`;
  else body = `<div class="card divide-y divide-line overflow-hidden">${nb.ids.map(getFacility).filter(Boolean).map(f => {
      const d = distanceBetween(dest, f), live = getLive(f.id), st = facilityStatus(f).status;
      return `<div class="flex items-center gap-3 px-4 py-3">
        <div class="w-10 h-10 rounded-xl grid place-items-center shrink-0 ${st ? 'st-' + st.key : 'bg-card2 text-sub'}" style="${st ? `background:${st.color}1c` : ''}" aria-hidden="true"><i class="fa-solid fa-square-parking"></i></div>
        <button data-act="facility" data-id="${f.id}" class="flex-1 min-w-0 text-left min-h-[44px]"><p class="text-[14px] font-semibold truncate">${esc(f.name)}</p>
          <p class="text-[11.5px] text-sub truncate">${d != null ? `${fmtDist(d)} · 도보 약 ${walkMin(d)}분` : ''}${hasNumbers(live) ? ` · ${(DATA_SOURCE[live.dataSource] || {}).dot} 실시간 연결` : ' · 실시간 데이터 없음'}</p></button>
        ${hasNumbers(live) ? `<span class="text-[15px] font-black tnum st-${st.key} shrink-0">${fmt(live.available)}</span>` : ''}
        <button data-act="nav" data-id="${f.id}" class="press w-11 h-11 rounded-full bg-card2 border border-line grid place-items-center shrink-0" aria-label="${esc(f.name)} 길안내"><i class="fa-solid fa-route text-brand" aria-hidden="true"></i></button>
      </div>`; }).join('')}
      ${nb.radius < CONFIG.NEARBY_PARKING_RADIUS_MAX ? `<button data-act="nearby-expand" class="w-full min-h-[48px] text-[13px] font-bold text-brand">반경 ${fmtDist(CONFIG.NEARBY_PARKING_RADIUS_MAX)}까지 더 보기</button>` : ''}</div>`;
  return `<section id="nearbyParking" class="scroll-mt-4" aria-label="주변 주차장">${head}${body}</section>`;
}

function noParkingDataHTML(d) {

function renderExplore() {
  renderChips();
  const box = $('#dashboard');
  const d = getDestination(state.selectedDestId);
  if (!d) {
    const waiting = state.sources.REFERENCE !== 'ok' || (state.pendingDestId && CONFIG.LIVE_SOURCES.some(s => ['idle', 'loading'].includes(state.sources[s])));
    box.innerHTML = waiting ? skeletonExplore() : errorCardHTML('주차장 정보를 불러오지 못했습니다.');
    return;
  }
  const fs = facilitiesOf(d);
  let f = getFacility(state.selectedFacilityId);
  if (f && !fs.includes(f) && !f.external) f = null;
  if (!f) { f = fs[0] || null; state.selectedFacilityId = f ? f.id : null; }

  // 외부 주차장을 직접 연 경우: 그 주차장 하나를 기준으로 표시
  const viewingExternal = f && f.external && !fs.includes(f);
  const footer = `<p class="text-center text-[11px] text-sub py-2 leading-relaxed">숫자가 없는 곳은 실시간 데이터가 연결되지 않은 곳이에요.<br/>공식 정보는 운영사 사정으로 바뀔 수 있으니 방문 전 확인하세요.</p>`;
  if (!f) { // 목적지는 있지만 주차 데이터 없음 (정상 상태)
    box.innerHTML = `${sourceErrorBanner()}${demoBanner()}${destinationHeaderHTML(d, [], null)}${noParkingDataHTML(d)}${guideCardHTML(d, null)}${nearbyParkingSectionHTML(d)}${footer}`;
    return;
  }
  const fst = facilityStatus(f), st = fst.status;
  const alts = getAlternatives(d, f);
  const crowded = isCrowded(st), isFull = st && (st.key === 'full' || st.key === 'very');
  const live = getLive(f.id);
  const dFloors = displayFloors(f);
  const bestId = live && live.floors ? (dFloors.map(fl => ({ id: fl.id, x: live.floors[fl.id] })).filter(o => o.x && o.x.total).sort((a, b) => b.x.available - a.x.available)[0] || {}).id : null;

  const floorsHTML = `
    <section aria-label="층별 현황">
      <div class="flex items-end justify-between mb-2.5 px-1 gap-2">
        <div><h3 class="text-[17px] font-extrabold">층별·구역별 현황</h3><p class="text-[12px] text-sub mt-0.5">${esc(f.name)}${live && live.floors ? ` · ${(DATA_SOURCE[live.dataSource] || {}).dot || ''} ${(DATA_SOURCE[live.dataSource] || {}).label || ''}` : hasNumbers(live) ? ' · 층별 실시간 정보 제공되지 않음' : ' · 층별 실시간 정보 없음'}</p></div>
        ${live && live.floors ? `<div class="flex flex-wrap justify-end gap-x-2 text-[10.5px] font-semibold text-sub shrink-0 max-w-[45%]">${legendHTML()}</div>` : ''}
      </div>
      ${dFloors.length ? `<div class="space-y-2.5">${dFloors.map(fl => floorCardHTML(f, fl, bestId)).join('')}</div>`
        : `<div class="card p-5"><p class="font-bold text-[14px]">층 정보 미등록</p><p class="text-[12.5px] text-sub mt-1 leading-snug">공식 층 구성 정보가 아직 확인되지 않았어요. 현장 제보는 '전체'로 남길 수 있어요.</p>
           <div class="mt-3 pt-2.5 border-t border-line text-[11.5px] flex items-center gap-1"><i class="fa-solid fa-user-check text-sub" aria-hidden="true"></i><span class="text-sub">${reportSummary(f.id, '전체').text}</span></div></div>`}
    </section>`;
  const altsHTML = alts.length || crowded ? `
    <section id="alts" class="scroll-mt-4" aria-label="대체 주차장">
      <div class="flex items-end justify-between mb-2.5 px-1">
        <div><h3 class="text-[17px] font-extrabold">대체 주차장</h3><p class="text-[12px] text-sub mt-0.5">검증 가이드 · 같은 목적지 · 반경 ${CONFIG.ALT_RADIUS_M}m 실시간 주차장</p></div>
        <span class="text-[12px] font-bold text-brand">${alts.length}곳</span>
      </div>
      <div class="space-y-2.5">${alts.length ? alts.slice(0, 5).map(altCardHTML).join('')
        : `<div class="card p-5 text-center"><p class="text-[13.5px] font-semibold">실시간 데이터가 있는 대체 주차장이 주변 ${CONFIG.ALT_RADIUS_M}m 안에 없습니다.</p><p class="text-[12px] text-sub mt-1">아래 '주변 주차장'에서 실제 주차장 위치를 확인하세요.</p></div>`}</div>
    </section>` : '';

  box.innerHTML = `
    ${sourceErrorBanner()}${demoBanner()}
    ${destinationHeaderHTML(d, viewingExternal ? [] : fs, f)}
    ${viewingExternal ? `<button data-act="goto" data-id="${d.id}" class="press h-11 px-4 rounded-full bg-card2 border border-line text-[13px] font-bold"><i class="fa-solid fa-arrow-left mr-1.5" aria-hidden="true"></i>${esc(d.name)} 주차 정보로 돌아가기</button>` : ''}
    ${crowded ? warningHTML(f, st, alts) : ''}
    ${facilityCardHTML(d, f)}
    ${isFull ? altsHTML + floorsHTML : floorsHTML}
    ${guideCardHTML(d, f)}
    ${isFull ? '' : altsHTML}
    ${nearbyParkingSectionHTML(d)}
    ${footer}`;
}

/* ---- 12-6. 통합 검색 (목적지 📍 / 주차장 🚗 구분) ---- */
function destBadge(d) {
  const ls = destLiveSummary(d);
  if (ls) return statusPill(ls.status, ls.available, 'shrink-0');
  if (d.kind === 'destination' && facilitiesOf(d).some(f => f.info)) return '<span class="shrink-0 text-[11px] font-semibold text-sub bg-card2 border border-line rounded-full px-2 py-0.5">⚪ 시설 정보</span>';
  return noLivePill('실시간 주차 데이터 없음', 'shrink-0');
}
function resultRow({ act, id, icon, title, meta, right, q, kindLabel }) {
  return `<button data-act="${act}" data-id="${esc(id)}" role="option" class="w-full min-h-[60px] flex items-center gap-3 px-4 py-2.5 text-left hover:bg-card2 active:bg-card2">
    <span class="w-9 h-9 rounded-xl bg-card2 grid place-items-center text-sub shrink-0" aria-hidden="true"><i class="fa-solid ${icon}"></i></span>
    <span class="flex-1 min-w-0"><span class="block text-[14.5px] font-semibold truncate">${highlight(title, q)}</span><span class="block text-[11.5px] text-sub truncate"><b class="text-ink/80">${kindLabel}</b> · ${meta}</span></span>
    ${right}</button>`;
}
function suggestItem(d, q) {
  const fs = facilitiesOf(d), cat = CATEGORY[d.category] || CATEGORY.place;
  const fr = fs.map(floorRangeText).filter(Boolean)[0];
  const dist = state.geo.pos ? distanceBetween(state.geo.pos, d) : null;
  const isLot = d.kind === 'public_lot';
  const meta = [cat.label, isLot ? null : fr ? `🅿️ 주차 ${fr}` : null, dist != null ? `📍 ${fmtDist(dist)}` : null].filter(Boolean).join(' · ');
  return resultRow({ act: 'pick', id: d.id, icon: isLot ? 'fa-square-parking' : cat.icon, title: d.name, meta, right: destBadge(d), q, kindLabel: isLot ? '🚗 주차장' : '📍 목적지' });
}
function renderSuggest() {
  const q = $('#searchInput').value.trim();
  $('#searchClear').classList.toggle('hidden', !q);
  let html = '';
  const chip = x => `<button data-act="use-query" data-q="${esc(x)}" class="h-9 px-3 rounded-full bg-card2 border border-line text-[12.5px] font-semibold">${esc(x)}</button>`;
  const examples = ['용산 아이파크몰', '현대 판교', '스타필드 수원', '코엑스', '인천공항'];
  if (!q) {
    const rq = Store.data.recentQueries;
    if (rq.length) html += `<div class="px-4 pt-3 pb-1 flex justify-between items-center text-[11.5px] text-sub font-semibold"><span>최근 검색어</span><button data-act="clear-recent" class="h-9 px-2 text-brand">전체 삭제</button></div><div class="px-4 pb-2 flex flex-wrap gap-1.5">${rq.map(chip).join('')}</div>`;
    const rd = Store.data.recentDestinations.map(getDestination).filter(Boolean).slice(0, 3);
    if (rd.length) html += `<div class="px-4 pt-2 pb-1 text-[11.5px] text-sub font-semibold">최근 본 목적지</div>` + rd.map(d => suggestItem(d)).join('');
    html += `<div class="px-4 pt-2 pb-1 text-[11.5px] text-sub font-semibold">이렇게 검색해보세요</div><div class="px-4 pb-3 flex flex-wrap gap-1.5">${examples.map(chip).join('')}</div>`;
  } else {
    const items = searchAll(q);
    const ext = state.search.q === q ? state.search.status : 'idle';
    html = items.map(it => {
      if (it.type === 'dest') return suggestItem(it.d, q);
      if (it.type === 'fac') { const f = it.f, d = destinationOfFacility(f), live = getLive(f.id), st = facilityStatus(f).status;
        return resultRow({ act: 'facility', id: f.id, icon: 'fa-square-parking', title: f.name, meta: d ? esc(d.name) : '주차시설', q, kindLabel: '🚗 주차장',
          right: hasNumbers(live) ? statusPill(st, live.available, 'shrink-0') : noLivePill('실시간 없음', 'shrink-0') }); }
      const p = it.p, cat = CATEGORY[p.kind] || CATEGORY.place;
      return resultRow({ act: it.type === 'place' ? 'pick-place' : 'pick-place-parking', id: p.id, icon: it.type === 'place' ? cat.icon : 'fa-square-parking',
        title: p.name, meta: esc(p.roadAddress || p.address || p.category), q, kindLabel: it.type === 'place' ? '📍 목적지' : '🚗 주차장',
        right: noLivePill('실시간 주차 데이터 없음', 'shrink-0') });
    }).join('');
    if (ext === 'loading') html += `<div class="px-4 py-3 flex items-center gap-2 text-[12px] text-sub"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>전국 장소를 검색하는 중…</div>`;
    if (ext === 'error') html += `<div class="px-4 py-3 text-[12px] text-sub" role="alert">장소 검색 서비스에 연결하지 못했어요. 파킹뷰에 등록된 장소만 보여드려요. <button data-act="retry-search" class="h-9 px-2 font-bold text-brand">다시 시도</button></div>`;
    if (!items.length && ext !== 'loading') {
      html = `<div class="p-6 text-center"><p class="text-[14px] font-semibold">${ext === 'error' ? '검색 결과를 불러오지 못했습니다.' : '장소를 찾지 못했습니다.'}</p><p class="text-[12.5px] text-sub mt-1">다른 이름으로 검색해보세요.</p>
         <div class="mt-3 flex flex-wrap justify-center gap-1.5">${examples.slice(0, 4).map(chip).join('')}</div></div>` + (ext === 'error' ? html : '');
    }
    if (items.length && state.search.external && state.search.q === q) html += `<p class="px-4 py-2 text-[10.5px] text-sub border-t border-line">장소 정보: ${state.search.external.provider === 'tmap' ? 'TMAP' : '카카오'} 장소 검색</p>`;
  }
  $('#suggest').innerHTML = html; $('#suggest').classList.remove('hidden');
}
const hideSuggest = () => $('#suggest').classList.add('hidden');

/* ---- 12-7. 내 주변 ---- */
function nearbyBannerHTML() {
  const g = state.geo.status;
  if (g === 'granted') return '';
  if (g === 'locating') return `<div class="mb-3 rounded-2xl p-3 flex items-center gap-3 bg-card border border-line"><i class="fa-solid fa-spinner fa-spin text-brand" aria-hidden="true"></i><p class="text-[12.5px]">현재 위치를 찾는 중이에요…</p></div>`;
  const denied = g === 'denied' || g === 'unavailable';
  return `<div class="mb-3 rounded-2xl p-3 flex items-center gap-3 bg-card border border-line" ${denied ? 'role="alert"' : ''}>
    <i class="fa-solid ${denied ? 'fa-location-pin-lock st-busy' : 'fa-location-arrow text-brand'}" aria-hidden="true"></i>
    <p class="flex-1 text-[12.5px] leading-snug">${denied ? '위치 권한을 사용할 수 없습니다. 선택한 목적지를 기준으로 보여드려요.' : '현재 위치를 켜면 주변 주차장까지 거리를 계산해요.'}</p>
    <button data-act="locate-nearby" class="press h-11 px-3.5 rounded-full bg-card2 border border-line text-[12.5px] font-bold shrink-0">${denied ? '다시 시도' : '위치 켜기'}</button></div>`;
}
function renderNearby() {
  const ref = refPoint();
  $('#nearbyRef').innerHTML = ref.kind === 'gps' ? '<i class="fa-solid fa-location-arrow text-brand mr-1" aria-hidden="true"></i>현재 위치 기준' : `<i class="fa-solid fa-location-dot text-sub mr-1" aria-hidden="true"></i>${esc(ref.label)} 기준 (기본 위치)`;
  $('#nearbyBanner').innerHTML = nearbyBannerHTML();
  $('#mapLegend').innerHTML = legendHTML() + '<span class="inline-flex items-center gap-1 text-sub">⚪ 미연결</span>';
  $('#sortSeg').innerHTML = [['distance', '거리순'], ['available', '여유순']].map(([k, label]) => `<button data-act="sort" data-sort="${k}" aria-pressed="${state.nearbySort === k}" class="min-h-[40px] px-3.5 rounded-full ${state.nearbySort === k ? 'bg-card text-ink shadow-sm' : 'text-sub'}">${label}</button>`).join('');
  $('#radiusSeg').innerHTML = CONFIG.NEARBY_RADII.map(r => `<button data-act="radius" data-r="${r}" aria-pressed="${state.nearbyRadius === r}" class="press shrink-0 h-11 px-4 rounded-full text-[12.5px] font-bold border ${state.nearbyRadius === r ? 'bg-ink text-bg border-ink' : 'bg-card border-line text-sub'}">${r ? fmtDist(r) : '전체'}</button>`).join('');

  let rows = state.facilities.filter(hasCoords).map(f => ({ f, d: distanceBetween(ref, f), st: facilityStatus(f), live: getLive(f.id) }));
  if (state.nearbyRadius) rows = rows.filter(r => r.d <= state.nearbyRadius);
  const rank = r => (r.live && r.live.total != null ? 0 : r.st.status ? 1 : 2) * 10 + (r.st.status ? STATUS_ORDER.indexOf(r.st.status.key) : 9);
  rows.sort(state.nearbySort === 'distance' ? (a, b) => a.d - b.d : (a, b) => rank(a) - rank(b) || a.d - b.d);
  const loadingMore = CONFIG.LIVE_SOURCES.some(s => state.sources[s] === 'loading') ? `<div class="card p-3.5 flex items-center gap-3" aria-busy="true"><div class="skel w-12 h-12 !rounded-2xl"></div><div class="flex-1 space-y-2"><div class="skel h-4 w-2/3"></div><div class="skel h-3 w-1/3"></div></div></div><p class="text-center text-[11.5px] text-sub">실시간 주차 데이터를 불러오는 중…</p>` : '';
  $('#nearbyList').innerHTML = (rows.length ? rows.slice(0, 30).map(r => {
    const st = r.st.status, dest = destinationOfFacility(r.f);
    return `<button data-act="preview" data-id="${r.f.id}" class="press w-full card p-3.5 flex items-center gap-3 text-left" aria-label="${esc(r.f.name)}, ${fmtDist(r.d)}">

      <div class="flex-1 min-w-0"><p class="font-bold text-[15px] truncate">${esc(r.f.name)}</p>
        <p class="text-[12px] text-sub mt-0.5 truncate"><span class="tnum">${fmtDist(r.d)}</span> · ${r.d <= 1500 ? `도보 약 ${walkMin(r.d)}분` : `차로 약 ${Math.max(1, Math.round(r.d / 500))}분`}${dest && dest.kind === 'destination' ? ` · ${esc(dest.name)}` : ''}</p></div>
      <div class="text-right shrink-0">${r.live && r.live.total != null ? `<p class="text-[20px] leading-none font-black tnum st-${st.key}">${fmt(r.live.available)}</p><p class="text-[11px] font-bold mt-1 st-${st.key}">${statusLabel(st, r.live.available)}</p>` : st ? statusPill(st) : noLivePill('미연결')}</div>

function initMap() {
