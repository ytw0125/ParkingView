<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1222" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="파킹뷰" />
<meta name="description" content="층별·구역별 실시간 주차 혼잡도와 현장 제보를 한눈에" />
<title>파킹뷰 · 층별 실시간 주차 현황</title>
<!-- ParkingView app v4 (2026-09-28) -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg:    'rgb(var(--bg) / <alpha-value>)',
          card:  'rgb(var(--card) / <alpha-value>)',
          card2: 'rgb(var(--card2) / <alpha-value>)',
          ink:   'rgb(var(--ink) / <alpha-value>)',
          sub:   'rgb(var(--sub) / <alpha-value>)',
          line:  'rgb(var(--line) / <alpha-value>)',
          brand: 'rgb(var(--brand) / <alpha-value>)',
        },
        fontFamily: {
          sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', '"Apple SD Gothic Neo"', '"Noto Sans KR"', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  :root{
    --bg:241 245 249; --card:255 255 255; --card2:248 250 252;
    --ink:15 23 42; --sub:92 107 130; --line:226 232 240;
    --brand:66 110 245;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:2 6 23; --card:15 23 42; --card2:25 36 56;
    --ink:241 245 249; --sub:156 170 191; --line:40 53 76;
    --brand:110 146 255;
    color-scheme: dark;
  }
  html,body{ background:rgb(var(--bg)); color:rgb(var(--ink)); -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
  body{ -webkit-font-smoothing:antialiased; }
  button,select,input{ font:inherit; color:inherit; }
  button{ touch-action:manipulation; }
  button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{ outline:2px solid rgb(var(--brand)); outline-offset:2px; }
  .no-scrollbar::-webkit-scrollbar{ display:none } .no-scrollbar{ scrollbar-width:none }
  .tnum{ font-variant-numeric:tabular-nums; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* 상태 텍스트 색 (대비 확보용: 밝은/어두운 테마별) */
  .st-free{ color:#047857 } .st-normal{ color:#92400e } .st-busy{ color:#c2410c } .st-full{ color:#dc2626 }
  [data-theme="dark"] .st-free{ color:#34d399 } [data-theme="dark"] .st-normal{ color:#facc15 }
  [data-theme="dark"] .st-busy{ color:#fb923c } [data-theme="dark"] .st-full{ color:#f87171 }

  .hdr{
    background:
      radial-gradient(110% 90% at 0% 0%, rgba(79,124,255,.28) 0%, transparent 55%),
      radial-gradient(80% 70% at 100% 0%, rgba(16,185,129,.12) 0%, transparent 60%),
      linear-gradient(180deg,#0b1222 0%, #111b31 100%);
  }
  .card{ background:rgb(var(--card)); border:1px solid rgb(var(--line)); border-radius:22px; }
  .press{ transition:transform .12s ease, background-color .2s ease, opacity .2s; }
  .press:active{ transform:scale(.965); }
  .press[disabled]{ opacity:.5; pointer-events:none; }

  .bar{ height:10px; border-radius:999px; background:rgb(var(--line)); overflow:hidden; }
  .bar > span{ display:block; height:100%; border-radius:inherit; transition:width .7s cubic-bezier(.2,.8,.2,1); }

  /* 층 단면(타워) */
  .tower{ display:flex; flex-direction:column; gap:4px; padding:8px 8px 6px; border-radius:16px; background:rgb(var(--card2)); border:1px solid rgb(var(--line)); position:relative; }
  .tower::before{ content:""; position:absolute; left:8px; right:8px; top:-6px; height:6px; border-radius:6px 6px 0 0; background:rgb(var(--line)); }
  .slab{ position:relative; height:22px; border-radius:7px; background:rgb(var(--line)); overflow:hidden; display:flex; align-items:center; }
  .slab > i{ position:absolute; inset:0 auto 0 0; border-radius:inherit; transition:width .7s cubic-bezier(.2,.8,.2,1); }
  .slab > b{ position:relative; z-index:1; font-size:10.5px; font-weight:800; padding-left:7px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .slab > em{ position:relative; z-index:1; margin-left:auto; padding-right:7px; font-style:normal; font-size:10.5px; font-weight:800; color:rgb(var(--ink)); }

  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--c); position:relative; display:inline-block; }
  .live-dot::after{ content:""; position:absolute; inset:-4px; border-radius:50%; background:var(--c); opacity:.35; animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes ping{ 75%,100%{ transform:scale(2); opacity:0; } }

  .view{ animation:viewIn .24s ease; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }

  /* Skeleton */
  .skel{ background:linear-gradient(90deg, rgb(var(--line)) 0%, rgb(var(--card2)) 50%, rgb(var(--line)) 100%); background-size:200% 100%; animation:skel 1.2s linear infinite; border-radius:10px; }
  @keyframes skel{ from{ background-position:200% 0 } to{ background-position:-200% 0 } }

  /* Tab bar */
  .tab-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:rgb(var(--sub)); font-size:11px; font-weight:600; position:relative; min-height:56px; }
  .tab-btn i{ font-size:19px; height:28px; display:grid; place-items:center; transition:transform .2s; }
  .tab-btn.active{ color:rgb(var(--brand)); }
  .tab-btn.active::before{ content:""; position:absolute; top:0; width:28px; height:3px; border-radius:0 0 4px 4px; background:rgb(var(--brand)); }
  .tab-btn.tab-cta i{ width:44px; border-radius:999px; background:rgb(var(--brand) / .12); color:rgb(var(--brand)); }
  .tab-btn.tab-cta.active i{ background:rgb(var(--brand)); color:#fff; }

  /* FAB */
  #fab{ right:max(16px, calc(50% - 240px + 16px)); bottom:calc(84px + env(safe-area-inset-bottom)); transition:all .3s cubic-bezier(.2,.8,.2,1); }
  #fab .fab-label{ max-width:220px; transition:max-width .3s, opacity .2s, margin .3s; white-space:nowrap; overflow:hidden; }
  #fab.mini .fab-label{ max-width:0; opacity:0; margin-left:0; }

  /* Bottom sheet: closed / collapsed / expanded */
  #sheet{ transition:transform .34s cubic-bezier(.2,.8,.2,1); }
  #sheet[data-state="closed"]{ transform:translateY(110%); }
  #sheet[data-state="collapsed"] #sheetBody{ max-height:min(62dvh, 560px); }
  #sheet[data-state="expanded"] #sheetBody{ max-height:86dvh; }
  #sheetBody{ transition:max-height .3s ease; overscroll-behavior:contain; }

  .toast{ animation:toastIn .3s cubic-bezier(.2,.8,.2,1); }
  .toast.out{ opacity:0; transform:translateY(-8px); transition:all .25s; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(-12px) scale(.96);} to{ opacity:1; transform:none; } }

  .reward-card{ animation:pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop{ from{ transform:scale(.6); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .coin{ animation:coin 1.1s cubic-bezier(.2,.8,.2,1); }
  @keyframes coin{ 0%{ transform:translateY(20px) rotateY(0) scale(.5);} 60%{ transform:translateY(-10px) rotateY(540deg) scale(1.1);} 100%{ transform:translateY(0) rotateY(720deg) scale(1);} }
  .float-pt{ position:fixed; z-index:80; pointer-events:none; font-weight:900; font-size:22px; color:rgb(var(--brand)); animation:floatUp 1.1s ease-out forwards; }
  @keyframes floatUp{ from{ opacity:1; transform:translate(-50%,0) scale(.9);} to{ opacity:0; transform:translate(-50%,-80px) scale(1.25);} }
  .shake{ animation:shake .42s; }
  @keyframes shake{ 20%,60%{ transform:translateX(-6px);} 40%,80%{ transform:translateX(6px);} }

  mark{ background:rgba(79,124,255,.18); color:inherit; border-radius:3px; padding:0 1px; }

  .leaflet-container{ background:rgb(var(--card2)) !important; font-family:inherit; }
  [data-theme="dark"] .leaflet-tile{ filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6); }
  .pin-wrap{ display:flex; justify-content:center; }
  .pin{ display:inline-flex; align-items:center; gap:4px; padding:4px 8px 4px 6px; border-radius:999px; background:var(--c); color:var(--fg,#fff); font-weight:800; font-size:12px; box-shadow:0 3px 8px rgba(0,0,0,.2); border:2px solid #fff; white-space:nowrap; position:relative; }
  .pin::after{ content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); border:5px solid transparent; border-top-color:#fff; }
  .me-dot{ width:18px; height:18px; border-radius:50%; background:#4f7cff; border:3px solid #fff; box-shadow:0 0 0 8px rgba(79,124,255,.22); }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<body class="font-sans">
<div id="app" class="relative mx-auto max-w-[480px] min-h-[100dvh] bg-bg">
  <div id="views" class="pb-[calc(92px+env(safe-area-inset-bottom))]">

    <!-- ============ 탐색 ============ -->
    <section id="view-explore" class="view" aria-label="탐색">
      <header class="hdr rounded-b-[30px] px-4 pb-4 text-white" style="padding-top:calc(env(safe-area-inset-top) + 12px)">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-[14px] bg-brand grid place-items-center" aria-hidden="true">
              <i class="fa-solid fa-square-parking text-white text-lg"></i>
            </div>
            <div>
              <h1 class="text-[19px] font-extrabold leading-tight tracking-tight">파킹뷰</h1>
              <p class="text-[11.5px] text-slate-400 leading-none mt-0.5">어느 층에 자리가 있는지 먼저 확인</p>
            </div>
          </div>
          <div class="flex gap-1.5">
            <button data-act="toggle-theme" class="press w-11 h-11 rounded-full bg-white/10 border border-white/10 grid place-items-center" aria-label="다크 모드 전환"><i id="themeIcon" class="fa-solid fa-moon" aria-hidden="true"></i></button>
            <button data-act="locate" class="press w-11 h-11 rounded-full bg-white/10 border border-white/10 grid place-items-center" aria-label="현재 위치에서 가장 가까운 주차장 찾기"><i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i></button>
          </div>
        </div>

        <div id="searchWrap" class="relative" role="search">
          <label for="searchInput" class="sr-only">주차장 검색</label>
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true"></i>
          <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search"
                 placeholder="주차장·주소·장소 검색 (예: 강남, ㅋㅇㅅ)"
                 aria-controls="suggest" aria-autocomplete="list"
                 class="w-full h-12 pl-11 pr-12 rounded-2xl bg-white text-slate-900 placeholder:text-slate-500 text-[15px] font-medium outline-none" />
          <button id="searchClear" class="hidden absolute right-1 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full text-slate-400" aria-label="검색어 지우기"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
          <div id="suggest" role="listbox" class="hidden absolute left-0 right-0 top-[calc(100%+8px)] z-40 bg-card text-ink rounded-2xl shadow-xl border border-line overflow-hidden max-h-[60vh] overflow-y-auto"></div>
        </div>

        <div id="chips" class="flex gap-2 overflow-x-auto no-scrollbar mt-3 -mx-4 px-4" aria-label="즐겨찾기 바로가기"></div>
      </header>

      <div id="dashboard" class="px-4 pt-4 space-y-4" aria-live="polite"></div>
    </section>

    <!-- ============ 내 주변 ============ -->
    <section id="view-nearby" class="view hidden" aria-label="내 주변">
      <header class="px-5 pb-3 flex items-end justify-between gap-3" style="padding-top:calc(env(safe-area-inset-top) + 20px)">
        <div class="min-w-0">
          <h1 class="text-[26px] font-extrabold tracking-tight">내 주변</h1>
          <p id="nearbyRef" class="text-[13px] text-sub mt-0.5 truncate"></p>
        </div>
        <button data-act="locate-nearby" class="press h-11 px-4 rounded-full bg-brand text-white text-sm font-bold shrink-0" aria-label="현재 위치 다시 찾기"><i class="fa-solid fa-location-crosshairs mr-1.5" aria-hidden="true"></i>현재 위치</button>
      </header>
      <div id="nearbyBanner" class="px-4"></div>
      <div class="px-4">
        <div class="relative isolate rounded-[26px] overflow-hidden border border-line h-[38vh] min-h-[240px]">
          <div id="map" class="absolute inset-0" role="img" aria-label="주차장 지도"></div>
          <div class="absolute left-3 bottom-3 z-[500] flex gap-2 bg-card/95 rounded-full px-3 py-1.5 border border-line text-[11px] font-semibold" id="mapLegend"></div>
        </div>
      </div>
      <div class="px-4 mt-4 flex items-center justify-between gap-2">
        <h3 class="text-[17px] font-extrabold">가까운 주차장</h3>
        <div class="flex p-1 rounded-full bg-card2 border border-line text-[12.5px] font-bold" id="sortSeg" role="group" aria-label="정렬"></div>
      </div>
      <div id="radiusSeg" class="px-4 mt-2.5 flex gap-2 overflow-x-auto no-scrollbar" role="group" aria-label="검색 반경"></div>
      <div id="nearbyList" class="px-4 mt-3 space-y-2.5 pb-4"></div>
    </section>

    <!-- ============ 제보하기 ============ -->
    <section id="view-report" class="view hidden" aria-label="제보하기">
      <header class="px-5 pb-3" style="padding-top:calc(env(safe-area-inset-top) + 20px)">
        <h1 class="text-[26px] font-extrabold tracking-tight">현장 제보</h1>
        <p class="text-[13px] text-sub mt-0.5">주차장 → 층 → 상황을 고르고 제출하세요</p>
      </header>
      <div class="px-4 space-y-4">
        <div class="rounded-[22px] p-4 flex items-center gap-3 text-white hdr">
          <div class="w-11 h-11 rounded-2xl bg-amber-400 grid place-items-center text-slate-900 shrink-0" aria-hidden="true"><i class="fa-solid fa-coins"></i></div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-[15px]" id="reportPointTitle">제보 1회마다 +50P</p>
            <p class="text-[12px] text-slate-300" id="reportLevelHint"></p>
          </div>
        </div>
        <div class="card p-4 report-form-slot"></div>
        <div>
          <div class="flex items-end justify-between px-1 mb-2.5">
            <h3 class="text-[17px] font-extrabold">실시간 제보 피드</h3>
            <span class="text-[11.5px] text-sub">최근 3시간</span>
          </div>
          <div id="feed" class="card divide-y divide-line overflow-hidden"></div>
        </div>
      </div>
    </section>

    <!-- ============ 마이 ============ -->
    <section id="view-my" class="view hidden" aria-label="마이">
      <header class="px-5 pb-3" style="padding-top:calc(env(safe-area-inset-top) + 20px)">
        <h1 class="text-[26px] font-extrabold tracking-tight">마이</h1>
      </header>
      <div id="myContent" class="px-4 space-y-4 pb-4"></div>
    </section>
  </div>

  <!-- Floating 제보 버튼 -->
  <button id="fab" data-act="open-report" class="press fixed z-30 flex items-center h-14 pl-4 pr-5 rounded-full bg-brand text-white font-bold shadow-lg shadow-blue-600/25" aria-label="이 주차장 층별 현황 제보하기">
    <i class="fa-solid fa-bullhorn text-lg" aria-hidden="true"></i>
    <span class="fab-label ml-2.5 text-[14px]">지금 여기 계신가요? 층별 제보</span>
  </button>

  <!-- Bottom Tab Bar -->
  <nav id="tabbar" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-40 bg-card/95 backdrop-blur-xl border-t border-line" style="padding-bottom:env(safe-area-inset-bottom)" aria-label="하단 메뉴">
    <div class="grid grid-cols-4 h-[64px]" role="tablist">
      <button class="tab-btn press" data-tab="explore" role="tab" aria-label="탐색"><i class="fa-solid fa-compass" aria-hidden="true"></i><span>탐색</span></button>
      <button class="tab-btn press" data-tab="nearby" role="tab" aria-label="내 주변"><i class="fa-solid fa-location-dot" aria-hidden="true"></i><span>내 주변</span></button>
      <button class="tab-btn tab-cta press" data-tab="report" role="tab" aria-label="제보하기"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i><span>제보하기</span></button>
      <button class="tab-btn press" data-tab="my" role="tab" aria-label="마이"><i class="fa-solid fa-user" aria-hidden="true"></i><span>마이</span><span id="myDot" class="hidden absolute top-2.5 right-[calc(50%-18px)] w-2 h-2 rounded-full bg-red-500" aria-hidden="true"></span></button>
    </div>
  </nav>
</div>

<!-- Bottom Sheet -->
<div id="sheetBackdrop" data-act="close-sheet" class="fixed inset-0 z-50 bg-slate-950/55 opacity-0 pointer-events-none transition-opacity duration-300"></div>
<div class="fixed inset-x-0 bottom-0 z-50 flex justify-center pointer-events-none">
  <div id="sheet" data-state="closed" class="pointer-events-auto w-full max-w-[480px] bg-card rounded-t-[28px] shadow-2xl border-t border-line" role="dialog" aria-modal="true" aria-label="상세 시트">
    <button class="sheet-handle w-full h-11 flex justify-center items-center cursor-grab" data-act="sheet-toggle" aria-label="시트 크게 보기 또는 작게 보기"><span class="w-10 h-1.5 rounded-full bg-line"></span></button>
    <div id="sheetBody" class="px-5 pb-[calc(20px+env(safe-area-inset-bottom))] overflow-y-auto"></div>
  </div>
</div>

<!-- Reward overlay -->
<div id="reward" data-act="close-reward" class="fixed inset-0 z-[70] hidden place-items-center bg-slate-950/60 px-8 overflow-hidden" role="dialog" aria-label="제보 완료"></div>

<!-- Toasts -->
<div id="toasts" class="fixed left-1/2 -translate-x-1/2 z-[90] w-full max-w-[480px] px-4 flex flex-col items-center gap-2 pointer-events-none" style="top:calc(env(safe-area-inset-top) + 12px)" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
 * 파킹뷰 버전 기록 (CHANGELOG)
 *   v1  2026-09-28  첫 프로토타입 (데모 데이터, 층별 현황, 제보·포인트)
 *   v2  2026-09-28  서울시 시영주차장 실시간 연동 (Cloudflare Worker 프록시)
 *   v3  2026-09-28  상단 바로가기를 사용자 즐겨찾기로 변경, 버전 표시
 *   v4  2026-09-28  (기획서 v0.2) 층별 현황 강화, 데이터 출처·최신성 표시,
 *                   제보 신뢰도·포인트 중복 방지, 점수 기반 대체 주차장,
 *                   어댑터/스토리지 레이어 분리, Loading/Empty/Error 상태
 *
 * 구조: 1 CONFIG → 2 MOCK DATA → 3 STORAGE → 4 DATA ADAPTER
 *       → 5 PARKING CALCULATIONS → 6 GEOLOCATION → 7 SEARCH → 8 NAVIGATION
 *       → 9 REPORT SYSTEM → 10 POINT SYSTEM → 11 UI RENDERING
 *       → 12 EVENT HANDLERS → 13 APP INITIALIZATION
 * ===================================================================== */
const APP_VERSION = 'v4';
const APP_BUILD_DATE = '2026-09-28';


/* =====================================================================
 * 1. CONFIG
 * ===================================================================== */
const CONFIG = {
  APP_NAME: '파킹뷰',

  // 활성 데이터 소스(어댑터) 목록. 순서대로 불러와 합칩니다.
  //   'MOCK'            : 프로토타입 가상 데이터 (항상 작동)
  //   'SEOUL_OPEN_API'  : 서울시 시영주차장 실시간 (Cloudflare Worker 경유)
  //   'PUBLIC_API'      : 공공데이터포털(data.go.kr)  ← [교체 지점] 키 활성화 후 추가

 *   favorites, recentQueries, recentLots, badges, theme, lastLot
 * ===================================================================== */
const LocalStorageAdapter = {
  read() { try { return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || '{}'); } catch (e) { return {}; } },
  write(obj) { try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(obj)); return true; } catch (e) { return false; } },
  clear() { try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) { /* noop */ } },
};

/** [교체 지점] Supabase 저장소. parking_reports insert / user_points upsert 로 구현 */
const SupabaseStorageAdapter = {
  async insertReport(report) {
    const { url, anonKey, tables } = CONFIG.SUPABASE;
    await fetch(`${url}/rest/v1/${tables.reports}`, {
      method: 'POST',
      headers: { apikey: anonKey, Authorization: `Bearer ${anonKey}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ parking_id: report.parkingId, floor_id: report.floorId, status: report.status, created_at: report.createdAt, device_id: Store.data.uid }),
    });
  },
};

const toMs = v => (typeof v === 'number' ? v : Date.parse(v) || 0);
const toIso = ms => new Date(ms).toISOString();

function normalizeStoredReport(r) {
  return {
    id: r.id || 'u' + toMs(r.createdAt),
    parkingId: r.parkingId || r.lotId,
    floorId: r.floorId || r.floor,
    status: r.status,
    createdAt: typeof r.createdAt === 'number' ? toIso(r.createdAt) : r.createdAt,
    points: r.points == null ? CONFIG.REPORT_POINT : r.points,
  };
}

const Store = {
  data: null,
  defaults: () => ({
    schema: 2, uid: null,
    user: { points: 0, reportCount: 0 },
    reports: [], favorites: [], recentQueries: [], recentLots: [], badges: [],
    theme: null, lastLot: null,
  }),
  load() {
    const raw = LocalStorageAdapter.read();
    const d = { ...this.defaults(), ...raw };
    // v1~v3 → schema 2 마이그레이션
    if (!raw.user) d.user = { points: raw.points || 0, reportCount: (raw.reports || []).length };
    if (Array.isArray(raw.recent) && !raw.recentLots) d.recentLots = raw.recent;
    d.reports = (d.reports || []).map(normalizeStoredReport).filter(r => r.parkingId && r.floorId && STATUS[r.status]);
    d.user.reportCount = Math.max(d.user.reportCount || 0, d.reports.length);
    delete d.points; delete d.recent; delete d.cooldowns; delete d.seenBadges;
    d.schema = 2;
    if (!d.uid) d.uid = String(Math.floor(1000 + Math.random() * 9000));
    this.data = d;
    this.save();
  },
  save() { return LocalStorageAdapter.write(this.data); },
  reset() {
    const keep = { theme: this.data.theme, uid: this.data.uid };
    LocalStorageAdapter.clear();
    this.data = { ...this.defaults(), ...keep };
    this.save();
  },
};


/* =====================================================================
 * 4. DATA ADAPTER  —  원천 데이터 → Parking Model
 * ---------------------------------------------------------------------
 * Parking Model (UI 가 사용하는 유일한 구조)
 *   { id, name, shortName, area, address, lat, lng, type, hours,
 *     fee: { per10min, hourly, note, free },
 *     evChargers, keywords, dataSource, realtime, updatedAt(ms),
 *     floors: [{ id, name, tip, zones: [{ id, total, available, base, tags }] }] }
 * 새 소스를 붙일 때는 fetchLots() 가 이 모델 배열을 반환하는 어댑터만 추가하면 됩니다.
 * ===================================================================== */
function modelFromRawLot(raw, now = Date.now()) {
  const hourly = raw.baseFee ? (raw.baseFee.unit === 'hour' ? raw.baseFee.amount : raw.baseFee.amount * 6) : 0;
  const per10 = raw.fee10min != null ? raw.fee10min : Math.round(hourly / 6);
  const floors = (raw.floors || []).map(f => {
    const zones = (f.zones && f.zones.length ? f.zones : [{ id: '전체', totalSpaces: f.totalSpaces, availableSpaces: f.availableSpaces, tags: [] }])
      .map(zn => ({ id: zn.id, total: zn.totalSpaces, available: zn.availableSpaces, base: zn.availableSpaces, tags: zn.tags || [] }));
    return { id: f.id, name: f.name || f.id, tip: f.tip || '', zones };
  });
  return {
    id: raw.id, name: raw.name, shortName: raw.shortName || raw.name, area: raw.area || null,
    address: raw.address, lat: raw.latitude, lng: raw.longitude, type: raw.type || 'public', hours: raw.hours || '-',
    fee: { per10min: per10, hourly, note: raw.feeNote || '', free: false },
    evChargers: raw.evChargers == null ? null : raw.evChargers, keywords: raw.keywords || [],
    dataSource: raw.dataSource || 'MOCK', realtime: true,
    updatedAt: raw.lastUpdated ? toMs(raw.lastUpdated) : now - Math.round(Math.random() * 40000),
    floors,
  };
}

/* 서울시 시영주차장 실시간 (Worker /seoul/lots 가 좌표 변환까지 끝낸 데이터) */
function parseKst(s) { const t = s ? Date.parse(String(s).replace(' ', 'T') + '+09:00') : NaN; return isNaN(t) ? null : t; }
function fmtHours(h) {
  if (!h || !h.wdStart) return '-';
  if (h.wdStart === '0000' && (h.wdEnd === '2400' || h.wdEnd === '0000')) return '24시간';
  const f = t => `${String(t).slice(0, 2)}:${String(t).slice(2, 4)}`;
  return `${f(h.wdStart)}~${f(h.wdEnd)}`;
}
function modelFromSeoul(r) {
  const total = Math.max(0, Math.round(+r.total || 0));
  const avail = Math.min(total, Math.max(0, Math.round(+r.available || 0)));
  const f = r.fee || {};
  const per10 = f.baseMin > 0 ? Math.round((f.baseCharge * 10) / f.baseMin) : 0;
  let hourly = f.baseCharge || 0;
  if (f.baseMin > 0 && f.baseMin < 60 && f.addMin > 0) hourly += Math.ceil((60 - f.baseMin) / f.addMin) * (f.addCharge || 0);
  if (f.dayMax > 0) hourly = Math.min(hourly, f.dayMax);
  const free = r.pay === 'N';
  return {
    id: 'seoul-' + r.id, name: r.name, shortName: String(r.name).replace(/\s*\((시|구)\)\s*$/, ''), area: 'seoul',
    address: '서울 ' + (r.addr || ''), lat: +r.lat, lng: +r.lng, type: 'public', hours: fmtHours(r.hours), tel: r.tel,
    fee: { per10min: free ? 0 : per10, hourly: free ? 0 : hourly, note: free ? '무료 주차장' : '', free },
    evChargers: null, keywords: ['서울', '공영', '시영', r.type || ''],
    dataSource: 'SEOUL_OPEN_API', realtime: !!r.realtime,
    updatedAt: parseKst(r.updatedAt) || Date.now(),
    floors: [{ id: '전체', name: '전체 구역',
      tip: '공공데이터는 층별 정보를 제공하지 않아요. 현장에서 층별 상황을 제보해주세요.',
      zones: [{ id: '전체', total, available: avail, base: avail, tags: [] }] }],
  };
}

const ParkingRepository = {
  async loadSource(sourceId) {
    const adapter = ADAPTERS[sourceId];
    if (!adapter) return;
    if (state.sources[sourceId] !== 'ok') state.sources[sourceId] = 'loading'; // 주기적 갱신 땐 로딩 표시 안 함

    }

function mergeLots(lots, sourceId) {
  const byId = new Map(state.lots.map(l => [l.id, l]));
  lots.forEach(nl => {
    const cur = byId.get(nl.id);
    if (!cur) { state.lots.push(nl); return; }
    // 실데이터 갱신: 수치와 시간만 교체 (사용자 상호작용 상태 유지)
    nl.floors.forEach(nf => {
      const cf = cur.floors.find(f => f.id === nf.id);
      if (!cf) return;
      nf.zones.forEach(nz => { const cz = cf.zones.find(z => z.id === nz.id); if (cz) { cz.total = nz.total; cz.available = nz.available; cz.base = nz.base; } });
    });
    cur.updatedAt = nl.updatedAt;
    cur.realtime = nl.realtime;
  });
}


/* =====================================================================
 * 5. PARKING CALCULATIONS
 * ===================================================================== */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function calculateOccupancyRate(totalSpaces, availableSpaces) {
  if (!totalSpaces) return 100;
  return ((totalSpaces - availableSpaces) / totalSpaces) * 100;
}
function statusFromOccupancy(rate) {
  const r = Math.round(rate);
  if (r >= STATUS_THRESHOLDS.full) return STATUS.full;
  if (r >= STATUS_THRESHOLDS.busy) return STATUS.busy;
  if (r >= STATUS_THRESHOLDS.normal) return STATUS.normal;
  return STATUS.free;
}
function statusOf(available, total) {
  if (!total || available <= 0) return STATUS.full;
  return statusFromOccupancy(calculateOccupancyRate(total, available));
}
/** 만차 구간에서 자리가 조금이라도 남아 있으면 "만차 임박" */
const statusLabel = (st, available) => (st.key === 'full' && available > 0 ? '만차 임박' : st.label);

const floorTotals = f => f.zones.reduce((a, zn) => ({ total: a.total + zn.total, available: a.available + zn.available }), { total: 0, available: 0 });
const lotTotals = l => l.floors.reduce((a, f) => { const t = floorTotals(f); return { total: a.total + t.total, available: a.available + t.available }; }, { total: 0, available: 0 });
const occPct = t => Math.round(calculateOccupancyRate(t.total, t.available));

function bestFloor(lot, excludeId) {
  return lot.floors.filter(f => f.id !== excludeId).map(f => ({ id: f.id, name: f.name, ...floorTotals(f) }))
    .sort((a, b) => b.available - a.available)[0] || null;
}

/* ---- 제보 최신성 / 데이터 최신성 ---- */
const minutesSince = ts => (Date.now() - ts) / 60000;
function reportFreshness(ts) {
  const m = minutesSince(ts);
  if (m < 10) return { level: 'high',   icon: '🟢', label: '최신 제보', cls: 'st-free' };
  if (m < 30) return { level: 'medium', icon: '🟡', label: '참고용',   cls: 'st-normal' };
  if (m < 60) return { level: 'low',    icon: '🟡', label: '참고용',   cls: 'st-normal' };
  return { level: 'stale', icon: '⚪', label: '오래된 제보', cls: 'text-sub' };
}
function reportsFor(parkingId, floorId) {
  return state.reports.filter(r => r.parkingId === parkingId && (!floorId || r.floorId === floorId));
}
function floorReportSummary(parkingId, floorId) {
  const all = reportsFor(parkingId, floorId).filter(r => minutesSince(r.createdAt) <= CONFIG.FEED_WINDOW_MIN);
  const active = all.filter(r => minutesSince(r.createdAt) <= CONFIG.REPORT_ACTIVE_MIN);
  if (active.length) {
    const avg = Math.round(active.reduce((s, r) => s + minutesSince(r.createdAt), 0) / active.length);
    return { count: active.length, lastReportAt: active[0].createdAt, latest: active[0], fresh: reportFreshness(active[0].createdAt),
      text: `현장 제보 ${active.length}건 · 평균 ${avg < 1 ? '방금' : avg + '분 전'}` };
  }
  if (all.length) {
    return { count: 0, lastReportAt: all[0].createdAt, latest: all[0], fresh: reportFreshness(all[0].createdAt),
      text: `마지막 제보 ${timeAgo(all[0].createdAt)}` };
  }
  return { count: 0, lastReportAt: null, latest: null, fresh: null, text: '아직 현장 제보가 없습니다.' };
}
function dataFreshness(lot) {
  const m = minutesSince(lot.updatedAt);
  return { stale: m >= CONFIG.DATA_STALE_MIN || lot.realtime === false, minutes: m };
}

/* ---- 대체 주차장 점수 (단순 가중 합, AI 아님) ---- */
const ALT_WEIGHTS = { availability: 0.35, congestion: 0.25, distance: 0.25, price: 0.15 };
function availabilityScore(c) { if (!c.total) return 0; return 0.6 * (c.available / c.total) + 0.4 * Math.min(1, c.available / 50); }
function congestionScore(st) { return { free: 1, normal: 0.6, busy: 0.25, full: 0 }[st.key]; }
function distanceScore(d, radius = CONFIG.ALT_RADIUS_M) { return clamp(1 - d / radius, 0, 1); }
function priceScore(hourly, minHourly, maxHourly) {
  if (!hourly) return 1;
  if (maxHourly === minHourly) return 0.7;
  return clamp(1 - (hourly - minHourly) / (maxHourly - minHourly), 0, 1);
}
function scoreAlternatives(cands) {
  const prices = cands.map(c => c.lot.fee.hourly).filter(Boolean);
  const minP = Math.min(...prices, Infinity), maxP = Math.max(...prices, 0);
  cands.forEach(c => {
    c.scores = {
      availability: availabilityScore(c), congestion: congestionScore(c.status),
      distance: distanceScore(c.d), price: priceScore(c.lot.fee.hourly, minP, maxP),
    };
    c.score = Object.keys(ALT_WEIGHTS).reduce((s, k) => s + ALT_WEIGHTS[k] * c.scores[k], 0);
  });
  return cands.sort((a, b) => b.score - a.score);
}
function getAlternatives(lot) {
  const cands = state.lots.filter(l => l.id !== lot.id).map(l => {
    const d = distanceBetween(lot, l), t = lotTotals(l);
    return { lot: l, d, walk: walkMin(d), ...t, status: statusOf(t.available, t.total) };
  }).filter(c => c.d <= CONFIG.ALT_RADIUS_M && c.available > 0);
  return scoreAlternatives(cands);
}

/* ---- 포맷 ---- */
const fmt = n => Number(n).toLocaleString('ko-KR');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const walkMin = d => Math.max(1, Math.round(d / CONFIG.WALK_M_PER_MIN));
const fmtDist = m => (m < 1000 ? `${Math.round(m)}m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)}km`);
function feeText(lot, kind = 'hourly') {
  if (lot.fee.free) return '무료';
  const v = lot.fee[kind];
  return v > 0 ? `${fmt(v)}원` : '정보 없음';
}
function timeAgo(ts) {
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (s < 10) return '방금';
  if (s < 60) return `${s}초 전`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}분 전`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}시간 전` : `${Math.floor(h / 24)}일 전`;
}


/* =====================================================================
 * 6. GEOLOCATION
 * ===================================================================== */
/** Haversine 공식 (미터). 실데이터에도 그대로 사용 */
function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000, toR = x => (x * Math.PI) / 180;
  const dLat = toR(lat2 - lat1), dLon = toR(lon2 - lon1);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const distanceBetween = (a, b) => calculateDistance(a.lat, a.lng, b.lat, b.lng);

const Geo = {
  locate() {
    return new Promise(resolve => {
      if (!navigator.geolocation) { state.geo.status = 'unavailable'; resolve(null); return; }
      state.geo.status = 'locating';
      navigator.geolocation.getCurrentPosition(p => {
        state.geo = { status: 'granted', pos: { lat: p.coords.latitude, lng: p.coords.longitude }, at: Date.now() };
        resolve(state.geo.pos);
      }, err => {
        state.geo = { status: err && err.code === 1 ? 'denied' : 'unavailable', pos: null };
        resolve(null);
      }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 30000 });
    });
  },
};
/** 거리 계산 기준점: 현재 위치 → 선택한 주차장 → 기본 위치 */
function refPoint() {
  if (state.geo.pos) return { ...state.geo.pos, kind: 'gps', label: '현재 위치' };
  const l = getLot(state.selectedId);
  if (l) return { lat: l.lat, lng: l.lng, kind: 'lot', label: l.shortName };
  return { ...CONFIG.DEFAULT_LOCATION, kind: 'default' };
}


/* =====================================================================
 * 7. SEARCH
 * ===================================================================== */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const toCho = s => [...s].map(c => { const k = c.charCodeAt(0) - 0xac00; return k >= 0 && k <= 11171 ? CHO[Math.floor(k / 588)] : c; }).join('');
const isChoOnly = s => /^[ㄱ-ㅎ\s]+$/.test(s);
const norm = s => String(s || '').toLowerCase().replace(/\s/g, '');

/** 이름·주소·장소명(키워드)·핫스팟으로 검색. 최대 CONFIG.SEARCH_LIMIT 개 */
function searchLots(q, limit = CONFIG.SEARCH_LIMIT) {
  const n = norm(q);
  if (!n) return [];
  const cho = isChoOnly(q);
  const hotAreas = HOTSPOTS.filter(h => norm(h.label).includes(n) || h.keywords.some(k => norm(k).includes(n) || n.includes(norm(k))));
  return state.lots.map(l => {
    const name = norm(l.name);
    let score = 0;
    if (name.startsWith(n)) score += 6; else if (name.includes(n)) score += 4;
    if (cho && toCho(name).includes(n)) score += 4;
    if (l.keywords.some(k => norm(k).includes(n))) score += 2;
    if (norm(l.address).includes(n)) score += 2;
    if (hotAreas.some(h => h.id === l.area)) score += 2 + (hotAreas.some(h => h.lotId === l.id) ? 2 : 0);
    return { l, score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score || a.l.name.localeCompare(b.l.name, 'ko')).slice(0, limit).map(x => x.l);
}
function highlight(text, q) {
  const safe = esc(text);
  if (!q || isChoOnly(q)) return safe;
  const e = esc(q.trim()); const i = safe.toLowerCase().indexOf(e.toLowerCase());
  return i < 0 ? safe : `${safe.slice(0, i)}<mark>${safe.slice(i, i + e.length)}</mark>${safe.slice(i + e.length)}`;
}

function buildNavLinks(lot) {
  const n = encodeURIComponent(lot.name);
  const appName = encodeURIComponent(location.hostname || 'parkingview');
  return {
    // TMAP 은 공개 웹 길찾기가 없어 카카오 웹 지도로 대체
    tmap:  { app: `tmap://route?goalname=${n}&goalx=${lot.lng}&goaly=${lot.lat}`, web: `https://map.kakao.com/link/to/${n},${lot.lat},${lot.lng}` },
    kakao: { app: `kakaomap://route?ep=${lot.lat},${lot.lng}&by=CAR`, web: `https://map.kakao.com/link/to/${n},${lot.lat},${lot.lng}` },
    naver: { app: `nmap://route/car?dlat=${lot.lat}&dlng=${lot.lng}&dname=${n}&appname=${appName}`, web: `https://map.naver.com/p/search/${n}` },
  };
}
function openNavigation(appId, lot) {
  const link = buildNavLinks(lot)[appId];
  if (!link) return;
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (!isMobile) { window.open(link.web, '_blank', 'noopener'); return; }
  let timer = null;
  const onHide = () => { if (document.hidden && timer) clearTimeout(timer); };
  document.addEventListener('visibilitychange', onHide, { once: true });
  timer = setTimeout(() => { if (!document.hidden) window.open(link.web, '_blank', 'noopener'); }, 1400);
  window.location.href = link.app;
}

/* =====================================================================
 * 9. REPORT SYSTEM
 * ===================================================================== */
function lastMyReport(parkingId, floorId) {
  return state.reports.find(r => r.mine && r.parkingId === parkingId && r.floorId === floorId) || null;
}
/** 같은 주차장·같은 층에 POINT_COOLDOWN_MIN 안에 제보했다면 포인트 미지급 */
function pointEligibility(parkingId, floorId) {
  const last = lastMyReport(parkingId, floorId);
  if (!last) return { eligible: true, waitMin: 0 };
  const passed = minutesSince(last.createdAt);
  const eligible = passed >= CONFIG.POINT_COOLDOWN_MIN;
  return { eligible, waitMin: eligible ? 0 : Math.ceil(CONFIG.POINT_COOLDOWN_MIN - passed) };
}

/** MOCK 데이터에만 내 제보를 즉시 반영 (공공데이터 수치는 건드리지 않음) */
function applyReportToMockLot(report) {
  const lot = getLot(report.parkingId);
  if (!lot || lot.dataSource !== 'MOCK') return;
  const f = lot.floors.find(x => x.id === report.floorId);
  if (!f) return;
  const target = { free: 0.5, normal: 0.3, busy: 0.12, full: 0.01 }[report.status];
  f.zones.forEach(zn => {
    zn.available = clamp(Math.round(zn.total * target * (0.85 + Math.random() * 0.3)), 0, zn.total);
    zn.base = zn.available;
  });
  lot.updatedAt = Date.now();
}

/**
 * 제보 제출. 반환: { report, pointsAwarded, limited }
 * Storage: Store.data.reports (LocalStorage) → [교체 지점] SupabaseStorageAdapter.insertReport
 */
function submitReport({ parkingId, floorId, status }) {
  const elig = pointEligibility(parkingId, floorId);
  const pointsAwarded = elig.eligible ? CONFIG.REPORT_POINT : 0;
  const createdAt = Date.now();
  const stored = { id: 'u' + createdAt, parkingId, floorId, status, createdAt: toIso(createdAt), points: pointsAwarded };

  Store.data.reports = [stored, ...Store.data.reports].slice(0, 300);
  state.reports.unshift({ ...stored, createdAt, nick: '나', mine: true });
  applyReportToMockLot(stored);

  const before = levelOf(Store.data.user.points);
  awardPoints(pointsAwarded);
  Store.data.user.reportCount += 1;
  const newBadges = checkBadges();
  Store.save();
  if (CONFIG.STORAGE_BACKEND === 'supabase') SupabaseStorageAdapter.insertReport(stored).catch(e => console.warn(e));
  const after = levelOf(Store.data.user.points);

  return { report: stored, pointsAwarded, limited: !elig.eligible, waitMin: elig.waitMin,
    levelUp: after.idx > before.idx ? after.cur : null, newBadges };
}

const LEVELS = [
  { min: 0,    name: '주차 새내기', icon: 'fa-seedling',  color: '#34d399', color2: '#059669' },
  { min: 200,  name: '주차 탐험가', icon: 'fa-compass',   color: '#60a5fa', color2: '#2563eb' },
  { min: 500,  name: '주차 헌터',   icon: 'fa-crosshairs', color: '#fbbf24', color2: '#d97706' },
  { min: 1000, name: '주차 마스터', icon: 'fa-crown',     color: '#a78bfa', color2: '#7c3aed' },
];
const BADGES = [
  { id: 'first',    name: '첫 제보',     desc: '첫 현장 제보',          icon: 'fa-flag',             cond: s => s.count >= 1 },
  { id: 'five',     name: '열정 제보러', desc: '제보 5회',              icon: 'fa-fire',             cond: s => s.count >= 5 },
  { id: 'explorer', name: '주차 탐험가', desc: '3곳 이상 제보',         icon: 'fa-map-location-dot', cond: s => s.lots >= 3 },
  { id: 'guard',    name: '만차 파수꾼', desc: '만차 3회 제보',         icon: 'fa-shield-halved',    cond: s => s.fullCount >= 3 },
  { id: 'night',    name: '올빼미 파커', desc: '밤 10시~새벽 5시 제보', icon: 'fa-moon',             cond: s => s.night },
  { id: 'master',   name: '주차 마스터', desc: '1,000P 달성',           icon: 'fa-crown',            cond: s => s.points >= 1000 },
];

function levelOf(p) {
  let i = 0;
  LEVELS.forEach((lv, idx) => { if (p >= lv.min) i = idx; });
  const cur = LEVELS[i], next = LEVELS[i + 1] || null;
  return { cur, next, idx: i, progress: next ? (p - cur.min) / (next.min - cur.min) : 1 };
}
function awardPoints(n) { Store.data.user.points = Math.max(0, (Store.data.user.points || 0) + n); }
function userStats() {
  const mine = Store.data.reports;
  return {
    count: Store.data.user.reportCount,
    lots: new Set(mine.map(r => r.parkingId)).size,
    fullCount: mine.filter(r => r.status === 'full').length,
    night: mine.some(r => { const h = new Date(r.createdAt).getHours(); return h >= 22 || h < 5; }),
    points: Store.data.user.points,
  };
}
function checkBadges() {
  const s = userStats();
  const fresh = BADGES.filter(b => !Store.data.badges.includes(b.id) && b.cond(s));
  Store.data.badges.push(...fresh.map(b => b.id));
  return fresh;
}

const Sheet = {
  state: 'closed',
  open(html, size = 'collapsed') {
    $('#sheetBody').innerHTML = html;
    $('#sheetBody').scrollTop = 0;
    this.set(size);
    $('#sheetBackdrop').classList.remove('pointer-events-none');
    $('#sheetBackdrop').style.opacity = '1';
    document.body.style.overflow = 'hidden';
    state.sheetOpen = true;
  },
  set(size) {
    this.state = size;
    const el = $('#sheet');
    el.dataset.state = size;
    el.style.transform = size === 'closed' ? '' : 'translateY(0)';
  },
  toggleSize() { if (this.state !== 'closed') this.set(this.state === 'expanded' ? 'collapsed' : 'expanded'); },
  close() {
    if (this.state === 'closed') return;
    this.set('closed');
    $('#sheetBackdrop').classList.add('pointer-events-none');
    $('#sheetBackdrop').style.opacity = '0';
    document.body.style.overflow = '';
    state.sheetOpen = false;
  },
};
(function sheetDrag() {
  const sheet = $('#sheet');
  let y0 = null, dy = 0, moved = false;
  sheet.addEventListener('touchstart', e => {
    if (!e.target.closest('.sheet-handle')) return;
    y0 = e.touches[0].clientY; dy = 0; moved = false; sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0; moved = Math.abs(dy) > 6;
    if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sheet.addEventListener('touchend', e => {
    if (y0 === null) return;
    sheet.style.transition = '';
    if (dy > 110) { Sheet.state === 'expanded' && dy < 260 ? Sheet.set('collapsed') : Sheet.close(); }
    else if (dy < -50) Sheet.set('expanded');
    else sheet.style.transform = 'translateY(0)';
    if (moved) { e.preventDefault(); Sheet._justDragged = Date.now(); }
    y0 = null;
  });
})();

          <i class="fa-${fav ? 'solid' : 'regular'} fa-star ${fav ? 'text-amber-400' : 'text-sub'}" aria-hidden="true"></i></button>

      <div class="mt-5 flex items-end gap-4">
        <div class="flex-1 min-w-0">
          <p class="text-[12px] text-sub font-semibold">총 잔여석</p>
          <p class="leading-none mt-1.5 whitespace-nowrap"><span class="text-[50px] font-black tnum tracking-tighter st-${st.key}">${fmt(t.available)}</span><span class="text-[15px] text-sub font-bold ml-1">/ ${fmt(t.total)}석</span></p>
          <p class="text-[12.5px] text-sub mt-2">점유율 <b class="text-ink tnum">${occPct(t)}%</b></p>

      </div>

    <div class="grid grid-cols-3 border-t border-line divide-x divide-line text-center">
      <div class="py-3"><p class="text-[11px] text-sub">1시간</p><p class="text-[14px] font-bold mt-0.5 tnum">${feeText(lot, 'hourly')}</p></div>
      <div class="py-3"><p class="text-[11px] text-sub">10분당</p><p class="text-[14px] font-bold mt-0.5 tnum">${feeText(lot, 'per10min')}</p></div>

    <div class="px-5 py-3 bg-card2 border-t border-line text-[12px] text-sub space-y-1.5">
      <p class="flex items-center gap-2"><i class="fa-solid ${(SOURCE_INFO[lot.dataSource] || SOURCE_INFO.MOCK).icon} w-4 text-center" aria-hidden="true"></i>
        <span>${(SOURCE_INFO[lot.dataSource] || SOURCE_INFO.MOCK).label} · <span data-ago="${lot.updatedAt}">${timeAgo(lot.updatedAt)}</span> 업데이트</span></p>
      <p class="flex items-center gap-2"><i class="fa-solid fa-users w-4 text-center ${rep.count ? 'text-brand' : ''}" aria-hidden="true"></i>
        <span>${rep.fresh ? `${rep.fresh.icon} ${rep.text}` : rep.text}</span></p>
    </div>

    <div class="p-3 grid grid-cols-2 gap-2">

      <button data-act="open-report" class="press h-12 rounded-2xl bg-card2 border border-line font-bold text-[14.5px]"><i class="fa-solid fa-bullhorn mr-1.5 text-brand" aria-hidden="true"></i>현황 제보</button>
    </div>
  </section>`;
}

function floorTip(lot, f, st) {
  const zones = f.zones.filter(zn => zn.available > 0).sort((a, b) => b.available / b.total - a.available / a.total);
  if (st.key === 'full' || !zones.length) {
    const alt = bestFloor(lot, f.id);
    if (alt && alt.available > 0) return `<b>${esc(f.id)}는 ${statusLabel(st, floorTotals(f).available)}</b>이에요. <b>${esc(alt.id)}</b>(잔여 ${alt.available}석)로 바로 이동하세요.`;
    return f.tip ? esc(f.tip) : '전 층이 만차에 가까워요. 대체 주차장을 확인하세요.';
  }
  if (f.zones.length === 1) return f.tip ? esc(f.tip) : '';
  const pick = zones.find(zn => zn.tags.some(tg => TAGS[tg] && TAGS[tg].priority) && zn.available >= 3) || zones[0];
  const tagText = pick.tags.map(tg => TAGS[tg] && TAGS[tg].label).filter(Boolean).join('/');
  return `<b>${esc(f.id)} ${esc(pick.id)}구역</b>${tagText ? ` ${tagText}` : ''} 공간 여유 (${pick.available}면)${f.tip ? `<br/><span class="text-sub">${esc(f.tip)}</span>` : ''}`;
}

const floorTitle = f => (f.id === '전체' || f.id === f.name ? f.name : `${f.id} · ${f.name}`);
function floorCardHTML(lot, f, bestId) {
  const t = floorTotals(f), st = statusOf(t.available, t.total), occ = occPct(t);
  const rep = floorReportSummary(lot.id, f.id);
  const updatedAt = Math.max(lot.updatedAt, rep.lastReportAt || 0);
  const tip = floorTip(lot, f, st);
  const isBest = f.id === bestId && st.key !== 'full' && lot.floors.length > 1;
  const zonesHTML = f.zones.length > 1 ? `
    <div class="grid gap-1.5 mt-3" style="grid-template-columns:repeat(${f.zones.length},minmax(0,1fr))">
      ${f.zones.map(zn => { const zs = statusOf(zn.available, zn.total); return `
        <div class="rounded-xl px-2.5 py-2 bg-card2 border border-line" aria-label="${esc(zn.id)}구역 잔여 ${zn.available}면, ${statusLabel(zs, zn.available)}">
          <div class="flex items-center justify-between"><span class="text-[11px] font-bold text-sub">${esc(zn.id)}구역</span><i class="fa-solid ${zs.icon} text-[10px] st-${zs.key}" aria-hidden="true"></i></div>
          <p class="text-[15px] font-extrabold mt-0.5 tnum st-${zs.key}">${zn.available}<span class="text-[10.5px] text-sub font-semibold">/${zn.total}</span></p>
          <p class="text-[10px] text-sub truncate h-3.5">${zn.tags.map(tg => TAGS[tg] && TAGS[tg].short).filter(Boolean).join(' · ')}</p>
        </div>`; }).join('')}
    </div>` : '';
  const repLine = rep.latest
    ? `<span class="inline-flex items-center gap-1 font-bold ${rep.fresh.cls}">${rep.fresh.icon} ${rep.fresh.label}</span><span class="text-sub">· ${rep.text}</span>
       <span class="text-sub">· <b class="st-${STATUS[rep.latest.status].key}">${STATUS[rep.latest.status].label}</b></span>`
    : `<span class="text-sub">${rep.text}</span>`;

  return `
  <article class="card p-4 ${isBest ? 'ring-2 ring-emerald-500/40' : ''}" aria-label="${esc(f.id)} ${esc(f.name)}, 잔여 ${t.available} / ${t.total}석, ${statusLabel(st, t.available)}">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl grid place-items-center font-black text-[15px] shrink-0" style="background:${st.color};color:${st.onColor}" aria-hidden="true">${esc(f.id.length > 2 ? f.id.slice(0, 2) : f.id)}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 flex-wrap"><h4 class="font-bold text-[15.5px]">${esc(floorTitle(f))}</h4>
          ${isBest ? '<span class="text-[10.5px] font-bold st-free bg-emerald-500/10 px-1.5 py-0.5 rounded-md">추천 층</span>' : ''}</div>
        <p class="text-[12px] mt-0.5 flex items-center gap-1.5">${statusPill(st, t.available, '!text-[11px]')}<span class="text-sub">점유율 <b class="text-ink tnum">${occ}%</b></span></p>
      </div>
      <div class="text-right shrink-0">
        <p class="leading-none whitespace-nowrap"><span class="text-[28px] font-black tnum st-${st.key}">${fmt(t.available)}</span><span class="text-[13px] text-sub font-semibold"> / ${fmt(t.total)}</span></p>
        <p class="text-[10.5px] text-sub mt-1">잔여 / 전체</p>
      </div>
    </div>
    <div class="bar mt-3.5" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${occ}" aria-label="점유율 ${occ}%"><span style="width:${occ}%;background:${st.color}"></span></div>
    ${zonesHTML}
    ${tip ? `<div class="mt-3 flex gap-2.5 items-start text-[12.5px] rounded-xl bg-amber-500/[.08] border border-amber-500/20 px-3 py-2.5"><i class="fa-solid fa-lightbulb text-amber-500 mt-0.5" aria-hidden="true"></i><span class="leading-snug">${tip}</span></div>` : ''}
    <div class="mt-3 pt-2.5 border-t border-line flex flex-wrap items-center justify-between gap-x-3 gap-y-1 text-[11.5px]">
      <span class="flex flex-wrap items-center gap-1"><i class="fa-solid fa-user-check text-sub" aria-hidden="true"></i>${repLine}</span>
      <span class="text-sub">업데이트 <span data-ago="${updatedAt}">${timeAgo(updatedAt)}</span></span>
    </div>
  </article>`;
}

function altCardHTML(a, idx) {

          ${a.lot.dataSource === 'MOCK' ? '<span class="text-[10px] font-semibold text-sub border border-dashed border-line rounded-md px-1.5 py-0.5">MOCK</span>' : '<span class="text-[10px] font-bold text-brand bg-brand/10 rounded-md px-1.5 py-0.5">공공데이터</span>'}

      <div class="rounded-xl bg-card2 py-2"><p class="text-[10.5px] text-sub">10분당</p><p class="text-[13.5px] font-bold tnum">${feeText(a.lot, 'per10min')}</p></div>

      <button data-act="goto" data-id="${a.lot.id}" class="press h-11 rounded-xl bg-card2 border border-line text-[13.5px] font-bold" aria-label="${esc(a.lot.name)} 상세보기">상세보기<i class="fa-solid fa-chevron-right ml-1.5 text-[11px] text-sub" aria-hidden="true"></i></button>
    </div>
  </article>`;
}

function sourceErrorBanner() {
  if (state.sources.SEOUL_OPEN_API !== 'error') return '';
  return `<div class="rounded-2xl p-3 flex items-center gap-3 bg-card border border-line" role="alert">
    <i class="fa-solid fa-circle-exclamation st-full" aria-hidden="true"></i>
    <p class="flex-1 text-[12.5px]">서울시 실시간 주차장 정보를 불러오지 못했습니다.</p>
    <button data-act="retry-load" class="press h-11 px-3.5 rounded-full bg-card2 border border-line text-[12.5px] font-bold">다시 시도</button>
  </div>`;
}

function renderExplore() {
  renderChips();
  const box = $('#dashboard');
  const lot = getLot(state.selectedId);
  if (!lot) {
    const waiting = state.sources.MOCK === 'loading' || state.sources.MOCK === 'idle' ||
      (state.pendingLotId && ['idle', 'loading'].includes(state.sources.SEOUL_OPEN_API));
    box.innerHTML = waiting ? skeletonExplore() : errorCardHTML('주차장 정보를 불러오지 못했습니다.');
    return;
  }
  const t = lotTotals(lot), st = statusOf(t.available, t.total);
  const alts = getAlternatives(lot);
  const bf = bestFloor(lot);
  const crowded = st.key === 'busy' || st.key === 'full';

  const floorsHTML = `
    <section aria-label="층별 실시간 현황">
      <div class="flex items-end justify-between mb-2.5 px-1 gap-2">
        <div><h3 class="text-[17px] font-extrabold">층별 실시간 현황</h3>
          <p class="text-[12px] text-sub mt-0.5">${lot.floors.length > 1 ? `${lot.floors.length}개 층 · ${bf && bf.available > 0 ? `지금은 <b class="st-free">${esc(bf.id)}</b>가 가장 여유로워요` : '전 층 만차 임박'}` : '층별 정보는 현장 제보로 채워져요'}</p></div>
        <div class="flex gap-2 text-[10.5px] font-semibold text-sub shrink-0">${legendHTML()}</div>
      </div>
      <div class="space-y-2.5">${lot.floors.map(f => floorCardHTML(lot, f, bf && bf.id)).join('')}</div>
    </section>`;

  const altsHTML = `
    <section id="alts" class="scroll-mt-4" aria-label="근처 대체 주차장">
      <div class="flex items-end justify-between mb-2.5 px-1">
        <div><h3 class="text-[17px] font-extrabold">근처 대체 주차장</h3><p class="text-[12px] text-sub mt-0.5">반경 ${CONFIG.ALT_RADIUS_M}m · 여유석·혼잡도·거리·요금 종합 순</p></div>
        <span class="text-[12px] font-bold text-brand">${alts.length}곳</span>
      </div>
      <div class="space-y-2.5">${alts.length ? alts.map(altCardHTML).join('') : `
        <div class="card p-6 text-center"><i class="fa-solid fa-map text-2xl text-sub" aria-hidden="true"></i>
          <p class="mt-2 text-[13.5px] font-semibold">주변 ${CONFIG.ALT_RADIUS_M}m 안에 주차장이 없습니다.</p>
          <p class="text-[12px] text-sub mt-1">내 주변 탭에서 더 넓은 반경으로 찾아보세요.</p>
          <button data-act="tab" data-tab="nearby" class="press mt-3 h-11 px-4 rounded-full bg-card2 border border-line text-[13px] font-bold">내 주변 보기</button></div>`}</div>
    </section>`;

  box.innerHTML = `
    ${sourceErrorBanner()}
    ${crowded ? warningHTML(lot, st, t, alts) : ''}
    ${heroHTML(lot, t, st)}
    ${floorsHTML}
    ${altsHTML}
    <p class="text-center text-[11px] text-sub py-2">${lot.dataSource === 'MOCK' ? '프로토타입 · MOCK DATA — 실제 주차 현황이 아닙니다' : '출처: 서울 열린데이터광장 (공공누리 1유형) · 1분마다 갱신'}</p>`;
}

/* ---- 11-6. 검색 자동완성 ---- */
function suggestItem(l, icon, q) {
  const t = lotTotals(l), st = statusOf(t.available, t.total);
  return `<button data-act="pick" data-id="${l.id}" role="option" class="w-full min-h-[56px] flex items-center gap-3 px-4 py-2.5 text-left hover:bg-card2 active:bg-card2">
    <span class="w-9 h-9 rounded-xl bg-card2 grid place-items-center text-sub shrink-0" aria-hidden="true"><i class="fa-solid ${icon}"></i></span>
    <span class="flex-1 min-w-0"><span class="block text-[14.5px] font-semibold truncate">${highlight(l.name, q)}</span><span class="block text-[12px] text-sub truncate">${highlight(l.address, q)}${l.dataSource === 'MOCK' ? ' · MOCK' : ''}</span></span>
    ${statusPill(st, t.available, 'shrink-0')}
  </button>`;
}
function renderSuggest() {
  const q = $('#searchInput').value.trim();
  $('#searchClear').classList.toggle('hidden', !q);
  let html = '';
  if (!q) {
    const rq = Store.data.recentQueries;
    if (rq.length) {
      html += `<div class="px-4 pt-3 pb-1 flex justify-between items-center text-[11.5px] text-sub font-semibold"><span>최근 검색어</span><button data-act="clear-recent" class="h-9 px-2 text-brand">전체 삭제</button></div>
        <div class="px-4 pb-2 flex flex-wrap gap-1.5">${rq.map(x => `<button data-act="use-query" data-q="${esc(x)}" class="h-9 px-3 rounded-full bg-card2 border border-line text-[12.5px] font-semibold">${esc(x)}</button>`).join('')}</div>`;
    }
    const rl = Store.data.recentLots.map(getLot).filter(Boolean).slice(0, 3);
    if (rl.length) html += `<div class="px-4 pt-2 pb-1 text-[11.5px] text-sub font-semibold">최근 본 주차장</div>` + rl.map(l => suggestItem(l, 'fa-clock-rotate-left')).join('');
    html += `<div class="px-4 pt-2 pb-1 text-[11.5px] text-sub font-semibold">장소로 찾기</div>
      <div class="px-4 pb-3 flex flex-wrap gap-1.5">${HOTSPOTS.map(h => `<button data-act="use-query" data-q="${esc(h.label)}" class="h-9 px-3 rounded-full bg-card2 border border-line text-[12.5px] font-semibold">${esc(h.label)}</button>`).join('')}
      ${state.lots.some(l => l.dataSource === 'SEOUL_OPEN_API') ? '<button data-act="use-query" data-q="시영" class="h-9 px-3 rounded-full bg-brand/10 text-brand text-[12.5px] font-bold">서울 시영주차장</button>' : ''}</div>`;
  } else {
    const m = searchLots(q);
    html = m.length
      ? m.map(l => suggestItem(l, 'fa-square-parking', q)).join('')
      : `<div class="p-6 text-center"><p class="text-[14px] font-semibold">'${esc(q)}' 검색 결과가 없어요</p><p class="text-[12px] text-sub mt-1">주차장 이름, 주소, 장소명(초성 가능)으로 검색해보세요.</p></div>`;
  }
  $('#suggest').innerHTML = html;
  $('#suggest').classList.remove('hidden');
}
const hideSuggest = () => $('#suggest').classList.add('hidden');

/* ---- 11-7. 내 주변 ---- */
function nearbyBannerHTML() {
  const g = state.geo.status;
  if (g === 'granted') return '';
  if (g === 'locating') return `<div class="mb-3 rounded-2xl p-3 flex items-center gap-3 bg-card border border-line"><i class="fa-solid fa-spinner fa-spin text-brand" aria-hidden="true"></i><p class="text-[12.5px]">현재 위치를 찾는 중이에요…</p></div>`;
  const denied = g === 'denied' || g === 'unavailable';
  return `<div class="mb-3 rounded-2xl p-3 flex items-center gap-3 bg-card border border-line" ${denied ? 'role="alert"' : ''}>
    <i class="fa-solid ${denied ? 'fa-location-pin-lock st-busy' : 'fa-location-arrow text-brand'}" aria-hidden="true"></i>
    <p class="flex-1 text-[12.5px] leading-snug">${denied ? '현재 위치를 사용할 수 없습니다. 위치 권한이 없어 기본 위치(선택한 주차장)를 사용합니다.' : '현재 위치를 켜면 내 주변 주차장 거리를 정확하게 계산해요.'}</p>
    <button data-act="locate-nearby" class="press h-11 px-3.5 rounded-full bg-card2 border border-line text-[12.5px] font-bold shrink-0">${denied ? '다시 시도' : '위치 켜기'}</button>
  </div>`;
}
function renderNearby() {
  const ref = refPoint();
  $('#nearbyRef').innerHTML = ref.kind === 'gps'
    ? '<i class="fa-solid fa-location-arrow text-brand mr-1" aria-hidden="true"></i>현재 위치 기준'
    : `<i class="fa-solid fa-square-parking text-sub mr-1" aria-hidden="true"></i>${esc(ref.label)} 기준 (기본 위치)`;
  $('#nearbyBanner').innerHTML = nearbyBannerHTML();
  $('#mapLegend').innerHTML = legendHTML();
  $('#sortSeg').innerHTML = [['distance', '거리순'], ['available', '여유순']].map(([k, label]) =>
    `<button data-act="sort" data-sort="${k}" aria-pressed="${state.nearbySort === k}" class="min-h-[40px] px-3.5 rounded-full ${state.nearbySort === k ? 'bg-card text-ink shadow-sm' : 'text-sub'}">${label}</button>`).join('');

    </div>`) + loadingMore + errorMore;

}

function initMap() {
  if (state.map) { state.map.invalidateSize(); return; }
  if (typeof L === 'undefined') {
    $('#map').innerHTML = '<div class="h-full grid place-items-center text-sm text-sub p-6 text-center">지도를 불러오지 못했습니다.<br/>목록은 아래에서 볼 수 있어요.</div>';
    return;
  }
  const c = refPoint();
  state.map = L.map('map', { zoomControl: false, attributionControl: true }).setView([c.lat, c.lng], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(state.map);
  state.markerLayer = L.layerGroup().addTo(state.map);
  renderMarkers();
}
function renderMarkers() {
  if (!state.map || !state.markerLayer) return;
  state.markerLayer.clearLayers();
  state.lots.forEach(l => {
    const t = lotTotals(l), s = statusOf(t.available, t.total);
    const icon = L.divIcon({ className: 'pin-wrap', iconSize: [90, 30], iconAnchor: [45, 34],
      html: `<span class="pin" style="--c:${s.color};--fg:${s.onColor}"><i class="fa-solid ${s.icon}"></i>${fmt(t.available)}</span>` });
    L.marker([l.lat, l.lng], { icon, title: `${l.name} 잔여 ${t.available}석`, zIndexOffset: l.id === state.selectedId ? 1000 : 0 })
      .on('click', () => openLotPreview(l.id)).addTo(state.markerLayer);
  });
  if (state.geo.pos) {
    L.marker([state.geo.pos.lat, state.geo.pos.lng], { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 2000, title: '현재 위치' }).addTo(state.markerLayer);
  }
}

          <i class="fa-solid fa-chevron-right text-sub text-sm" aria-hidden="true"></i>
        </button>`).join('')}
    </div>`, 'collapsed');
}
function openLotPreview(id) {
  const l = getLot(id); if (!l) return;
  const t = lotTotals(l), s = statusOf(t.available, t.total);
  const d = state.geo.pos ? distanceBetween(state.geo.pos, l) : null;
  Sheet.open(`
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="flex flex-wrap gap-1.5">${statusPill(s, t.available)}${sourceBadge(l)}</div>
        <h3 class="text-[19px] font-extrabold mt-2 leading-tight">${esc(l.name)}</h3>
        <p class="text-[12.5px] text-sub mt-1 truncate">${esc(l.address)}${d !== null ? ` · ${fmtDist(d)}` : ''}</p>
      </div>
      <div class="text-right shrink-0"><p class="text-[32px] leading-none font-black tnum st-${s.key}">${fmt(t.available)}</p><p class="text-[11.5px] text-sub mt-1">/ ${fmt(t.total)}석</p></div>
    </div>
    <div class="mt-4 space-y-2">
      ${l.floors.map(f => { const ft = floorTotals(f), fs = statusOf(ft.available, ft.total); return `
        <div class="flex items-center gap-3"><span class="w-10 text-[13px] font-black">${esc(f.id)}</span><div class="bar flex-1 !h-2.5"><span style="width:${occPct(ft)}%;background:${fs.color}"></span></div><span class="w-20 text-right text-[12.5px] font-bold tnum st-${fs.key}">${ft.available}석</span></div>`; }).join('')}
    </div>
    <div class="mt-5 grid grid-cols-2 gap-2">
      <button data-act="nav" data-id="${l.id}" class="press h-12 rounded-2xl bg-card2 border border-line font-bold"><i class="fa-solid fa-route mr-1.5 text-brand" aria-hidden="true"></i>길안내</button>
      <button data-act="goto" data-id="${l.id}" class="press h-12 rounded-2xl bg-brand text-white font-bold">층별 현황 보기</button>
    </div>`, 'collapsed');
}
function favRowHTML(l) {
  const on = Store.data.favorites.includes(l.id), t = lotTotals(l), st = statusOf(t.available, t.total);
  return `<div class="flex items-center gap-3 py-1.5">
    <button data-act="goto" data-id="${l.id}" class="flex-1 min-w-0 min-h-[48px] text-left">
      <p class="font-semibold text-[14.5px] truncate">${esc(l.name)}</p>
      <p class="text-[12px] text-sub truncate">${esc(l.address)}${l.dataSource === 'MOCK' ? ' · MOCK' : ''}</p>
    </button>
    <span class="text-[12px] font-bold tnum shrink-0 st-${st.key}">${statusLabel(st, t.available)} ${fmt(t.available)}</span>
    <button data-act="fav" data-id="${l.id}" aria-pressed="${on}" class="press w-11 h-11 rounded-full grid place-items-center shrink-0" aria-label="${esc(l.name)} ${on ? '즐겨찾기 해제' : '즐겨찾기 추가'}">
      <i class="fa-${on ? 'solid' : 'regular'} fa-star text-lg ${on ? 'text-amber-400' : 'text-sub'}" aria-hidden="true"></i></button>
  </div>`;
}
function renderFavList() {
  const box = $('#favList'); if (!box) return;
  const q = ($('#favSearch') ? $('#favSearch').value : '').trim();
  const favs = Store.data.favorites.map(getLot).filter(Boolean);
  const section = (title, body) => `<p class="text-[12px] font-bold text-sub mt-4 mb-1">${title}</p><div class="divide-y divide-line">${body}</div>`;
  if (q) {
    const m = searchLots(q, 10);
    box.innerHTML = m.length ? section('검색 결과', m.map(favRowHTML).join('')) : `<p class="py-8 text-center text-[13px] text-sub">'${esc(q)}' 검색 결과가 없어요</p>`;
    return;
  }
  const ref = refPoint();
  const near = state.lots.filter(l => !favs.includes(l)).map(l => ({ l, d: distanceBetween(ref, l) })).sort((a, b) => a.d - b.d).slice(0, 8).map(x => x.l);
  box.innerHTML = section(`내 즐겨찾기 ${favs.length}`, favs.length ? favs.map(favRowHTML).join('') : '<p class="py-4 text-[13px] text-sub">아직 없어요. 아래에서 별을 눌러 추가하세요.</p>')
    + section(ref.kind === 'gps' ? '내 주변 주차장' : '가까운 주차장', near.map(favRowHTML).join(''));
}
function openFavSheet() {
  Sheet.open(`
    <div class="flex items-start justify-between gap-3">
      <div><h3 class="text-[18px] font-extrabold">즐겨찾기 관리</h3><p class="text-[13px] text-sub mt-0.5">별을 누르면 탐색 화면 위쪽 바로가기에 추가돼요.</p></div>
      <button data-act="close-sheet" class="press w-11 h-11 rounded-full bg-card2 grid place-items-center shrink-0" aria-label="닫기"><i class="fa-solid fa-xmark text-sub" aria-hidden="true"></i></button>
    </div>
    <div class="relative mt-4">
      <label for="favSearch" class="sr-only">즐겨찾기할 주차장 검색</label>
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-sub text-sm" aria-hidden="true"></i>
      <input id="favSearch" type="search" autocomplete="off" placeholder="주차장 이름·지역 검색 (초성 가능)" class="w-full h-12 pl-10 pr-3 rounded-2xl bg-card2 border border-line text-[15px] outline-none" />
    </div>
    <div id="favList"></div>`, 'expanded');
  $('#favSearch').addEventListener('input', renderFavList);
  renderFavList();
}


/* =====================================================================
 * 12. EVENT HANDLERS
 * ===================================================================== */
function selectLot(id, { silent = false } = {}) {
  if (!getLot(id)) return;
  state.selectedId = id;
  state.pendingLotId = null;
  state.draft = { parkingId: id, floorId: null, status: null };
  Store.data.lastLot = id;
  if (!silent) rememberLot(id); else Store.save();
  renderExplore();
  if (state.tab !== 'explore' && !silent) switchTab('explore');
  if (!silent) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchTab(tab) {
  state.tab = tab;
  $$('.view').forEach(v => {
    const on = v.id === 'view-' + tab;
    v.classList.toggle('hidden', !on);
    if (on) { v.classList.remove('view'); void v.offsetWidth; v.classList.add('view'); }
  });
  $$('.tab-btn').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
  $('#fab').classList.toggle('hidden', tab !== 'explore');
  window.scrollTo(0, 0);
  if (tab === 'explore') renderExplore();
  if (tab === 'nearby') {
    renderNearby();
    setTimeout(() => { initMap(); if (state.map) { state.map.invalidateSize(); const c = refPoint(); state.map.setView([c.lat, c.lng], state.map.getZoom()); } }, 60);
    if (!state.geoAsked) { state.geoAsked = true; locate(true, { quiet: true }); }
  }
  if (tab === 'report') { if (!getLot(state.draft.parkingId)) state.draft = { parkingId: state.selectedId, floorId: null, status: null }; renderReportView(); }
  if (tab === 'my') renderMy();
  try { history.replaceState(null, '', '#' + tab); } catch (e) { /* file:// 등 */ }
}

async function locate(fromNearby, { quiet = false } = {}) {
  if (state.geo.status === 'locating') return;
  if (!quiet) toast('현재 위치를 찾고 있어요', 'info');
  if (state.tab === 'nearby') $('#nearbyBanner').innerHTML = `<div class="mb-3 rounded-2xl p-3 flex items-center gap-3 bg-card border border-line"><i class="fa-solid fa-spinner fa-spin text-brand" aria-hidden="true"></i><p class="text-[12.5px]">현재 위치를 찾는 중이에요…</p></div>`;
  const pos = await Geo.locate();
  if (!pos) {
    if (!quiet || state.geo.status === 'denied') toast(state.geo.status === 'denied' ? '위치 권한이 없어 기본 위치를 사용합니다' : '현재 위치를 사용할 수 없습니다 (HTTPS 필요)', 'error');
    if (state.tab === 'nearby') renderNearby();
    return;
  }
  const nearest = state.lots.map(l => ({ l, d: distanceBetween(pos, l) })).sort((a, b) => a.d - b.d)[0];
  if (nearest && !quiet) toast(`가장 가까운 주차장: ${nearest.l.shortName} (${fmtDist(nearest.d)})`);
  if (!fromNearby && nearest) selectLot(nearest.l.id);
  if (state.tab === 'nearby') {
    renderNearby();
    if (state.map) state.map.setView([pos.lat, pos.lng], 14);
  }
}

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeIcon').className = `fa-solid ${t === 'dark' ? 'fa-sun' : 'fa-moon'}`;
}

function rerenderAfterReport() {
  renderExplore();
  if (state.tab === 'report') renderReportView();
  if (state.tab === 'my') renderMy(); else $('#myDot').classList.remove('hidden');
}

document.addEventListener('click', e => {
  if (!e.target.closest('#searchWrap')) hideSuggest();
  const el = e.target.closest('[data-act], [data-tab]');
  if (!el) return;
  const act = el.dataset.act || 'tab';
  const id = el.dataset.id;

  switch (act) {
    case 'tab': Sheet.close(); switchTab(el.dataset.tab); break;
    case 'pick': {
      const q = $('#searchInput').value.trim();
      if (q) rememberQuery(q);
      $('#searchInput').value = ''; $('#searchClear').classList.add('hidden');
      hideSuggest(); $('#searchInput').blur(); selectLot(id);
      break;
    }
    case 'use-query': e.stopPropagation(); $('#searchInput').value = el.dataset.q; renderSuggest(); $('#searchInput').focus(); break;
    case 'goto': Sheet.close(); selectLot(id); break;
    case 'clear-recent': e.stopPropagation(); Store.data.recentQueries = []; Store.data.recentLots = []; Store.save(); renderSuggest(); break;
    case 'fav': {
      const f = Store.data.favorites, on = f.includes(id);
      Store.data.favorites = on ? f.filter(x => x !== id) : [...f, id];
      Store.save(); renderExplore();
      if (state.sheetOpen) renderFavList();
      if (state.tab === 'my') renderMy();
      toast(on ? '즐겨찾기에서 뺐어요' : '즐겨찾기에 추가했어요');
      break;
    }
    case 'fav-manage': openFavSheet(); break;
    case 'nav': openNavSheet(id); break;
    case 'nav-go': if (acquireLock('nav', 1200)) { const l = getLot(id); if (l) openNavigation(el.dataset.app, l); Sheet.close(); } break;
    case 'open-report': state.draft = { parkingId: state.selectedId, floorId: null, status: null }; openReportSheet(); break;
    case 'draft-floor': state.draft.floorId = el.dataset.floor; renderReportForms(); break;
    case 'draft-status':
      if (!state.draft.floorId) {
        $$('.floor-row').forEach(r => { r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); });
        toast('먼저 지금 계신 층을 선택하세요', 'warn');
        break;
      }
      state.draft.status = el.dataset.status; renderReportForms();
      break;
    case 'submit-report': {
      const d = state.draft;
      if (!d.parkingId || !d.floorId || !d.status) { toast('층과 상황을 모두 선택하세요', 'warn'); break; }
      if (!acquireLock('submit')) break;
      const rect = el.getBoundingClientRect();
      const res = submitReport({ parkingId: d.parkingId, floorId: d.floorId, status: d.status });
      if (state.sheetOpen) Sheet.close();
      state.draft = { parkingId: d.parkingId, floorId: null, status: null };
      rerenderAfterReport();
      if (res.pointsAwarded) { floatPoints(rect.left + rect.width / 2, rect.top, res.pointsAwarded); setTimeout(() => showReward(res), 300); }
      else toast(`제보가 반영됐어요. 같은 층 ${CONFIG.POINT_COOLDOWN_MIN}분 내 재제보라 포인트는 지급되지 않아요`, 'warn');
      break;
    }
    case 'scroll-alts': document.getElementById('alts')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'locate': locate(false); break;
    case 'locate-nearby': locate(true); break;
    case 'sort': state.nearbySort = el.dataset.sort; renderNearby(); break;
    case 'radius': state.nearbyRadius = +el.dataset.r; renderNearby(); break;
    case 'preview': openLotPreview(id); break;
    case 'retry-load': retryLoad(); break;
    case 'toggle-theme': {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      Store.data.theme = t; Store.save(); applyTheme(t);
      if (state.tab === 'my') renderMy();
      break;
    }
    case 'reset':
      if (confirm('포인트, 제보 내역, 뱃지, 즐겨찾기, 최근 검색이 모두 삭제돼요. 초기화할까요?')) {
        Store.reset();
        state.reports = state.reports.filter(r => !r.mine);
        renderMy(); renderChips(); toast('내 기록을 초기화했어요');
      }
      break;
    case 'sheet-toggle': if (!Sheet._justDragged || Date.now() - Sheet._justDragged > 400) Sheet.toggleSize(); break;
    case 'close-sheet': Sheet.close(); break;
    case 'close-reward': if (e.target === el || el.tagName === 'BUTTON') closeReward(); break;
  }
});

document.addEventListener('change', e => {
  if (e.target.dataset.change === 'draft-lot') { state.draft = { parkingId: e.target.value, floorId: null, status: null }; renderReportForms(); }
});

const searchInput = $('#searchInput');
searchInput.addEventListener('focus', renderSuggest);
searchInput.addEventListener('input', renderSuggest);
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const first = $('#suggest [data-act="pick"]'); if (first) first.click(); }
  if (e.key === 'Escape') { hideSuggest(); searchInput.blur(); }
});
$('#searchClear').addEventListener('click', e => { e.stopPropagation(); searchInput.value = ''; renderSuggest(); searchInput.focus(); });

let lastY = 0;
window.addEventListener('scroll', () => { const y = window.scrollY; $('#fab').classList.toggle('mini', y > 220 && y > lastY); lastY = y; }, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { Sheet.close(); closeReward(); } });


/* =====================================================================
 * 13. APP INITIALIZATION
 * ===================================================================== */
/** MOCK 데이터만 변동 시뮬레이션 (실데이터는 절대 가공하지 않음) */
function tick() {
  if (!CONFIG.SIMULATE_MOCK_REALTIME) return;
  const now = Date.now();
  state.lots.forEach(l => {
    if (l.dataSource !== 'MOCK') return;
    l.floors.forEach(f => f.zones.forEach(zn => {
      const step = Math.max(1, Math.round(zn.total * 0.025));
      const noise = Math.round((Math.random() * 2 - 1) * step);
      const revert = Math.round(((zn.base == null ? zn.available : zn.base) - zn.available) * 0.2);
      zn.available = clamp(zn.available + noise + revert, 0, zn.total);
    }));
    l.updatedAt = now - Math.round(Math.random() * 8000);
  });
  softRender();
}
function softRender() {
  if (document.hidden || state.sheetOpen) return;
  if (state.tab === 'explore' && $('#suggest').classList.contains('hidden')) renderExplore();
  if (state.tab === 'nearby') renderNearby();
}
function refreshAgo() { $$('[data-ago]').forEach(el => (el.textContent = timeAgo(+el.dataset.ago))); }

async function loadRealSources() {
  const others = CONFIG.DATA_SOURCES.filter(s => s !== 'MOCK');
  others.forEach(s => { state.sources[s] = 'loading'; });
  softRender();
  await Promise.all(others.map(s => ParkingRepository.loadSource(s)));
  // 마지막으로 보던 공공데이터 주차장 복원
  if (state.pendingLotId) {
    if (getLot(state.pendingLotId)) selectLot(state.pendingLotId, { silent: true });
    else { state.pendingLotId = null; if (!getLot(state.selectedId)) selectLot('gn-main', { silent: true }); }
  }
  if (state.tab === 'my') renderMy();
  if (state.sheetOpen && $('#favList')) renderFavList();
  softRender();
}
async function retryLoad() {
  if (!acquireLock('retry', 2000)) return;
  toast('다시 불러오는 중…', 'info');
  if (state.sources.MOCK !== 'ok') await ParkingRepository.loadSource('MOCK');
  await loadRealSources();
  if (!getLot(state.selectedId) && state.lots.length) selectLot(state.lots[0].id, { silent: true });
  renderExplore();
}

function injectManifest() {
  try {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#0b1222"/><rect x="96" y="96" width="320" height="320" rx="84" fill="#4F7CFF"/><text x="256" y="338" font-size="230" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica" font-weight="900">P</text></svg>`;
    const icon = 'data:image/svg+xml,' + encodeURIComponent(svg);
    const manifest = { name: '파킹뷰 · 층별 실시간 주차', short_name: '파킹뷰', lang: 'ko', start_url: location.href.split('#')[0], display: 'standalone',
      background_color: '#0b1222', theme_color: '#0b1222', icons: [{ src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }] };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);
    ['icon', 'apple-touch-icon'].forEach(rel => { const l = document.createElement('link'); l.rel = rel; l.href = icon; document.head.appendChild(l); });
  } catch (e) { /* noop */ }
}

async function init() {
  Store.load();
  applyTheme(Store.data.theme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  const hash = location.hash.slice(1);
  state.tab = ['explore', 'nearby', 'report', 'my'].includes(hash) ? hash : 'explore';
  renderExplore(); // skeleton

  await ParkingRepository.loadSource('MOCK');
  await ParkingRepository.loadReports();

  const last = Store.data.lastLot;
  if (last && getLot(last)) state.selectedId = last;
  else { state.selectedId = 'gn-main'; if (last && String(last).startsWith('seoul-')) { state.pendingLotId = last; state.selectedId = null; } }
  state.draft = { parkingId: state.selectedId || 'gn-main', floorId: null, status: null };

  switchTab(state.tab);
  loadRealSources();

  setInterval(tick, CONFIG.TICK_MS);
  setInterval(refreshAgo, 10000);
  setInterval(() => { if (!document.hidden && CONFIG.DATA_SOURCES.includes('SEOUL_OPEN_API')) ParkingRepository.loadSource('SEOUL_OPEN_API').then(softRender); }, CONFIG.SEOUL_REFRESH_MS);
  injectManifest();
}

document.addEventListener('DOMContentLoaded', init);
</script>
