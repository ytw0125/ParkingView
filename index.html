    <button data-act="goto" data-id="${d.id}" class="flex-1 min-w-0 min-h-[48px] text-left"><p class="font-semibold text-[14.5px] truncate">${esc(d.name)}</p><p class="text-[12px] text-sub truncate">${cat.label} · ${esc(d.address)}</p></button>
    <button data-act="fav" data-id="${d.id}" aria-pressed="${on}" class="press w-11 h-11 rounded-full grid place-items-center shrink-0" aria-label="${esc(d.name)} ${on ? '즐겨찾기 해제' : '즐겨찾기 추가'}"><i class="fa-${on ? 'solid' : 'regular'} fa-star text-lg ${on ? 'text-amber-400' : 'text-sub'}" aria-hidden="true"></i></button></div>`;
}
function renderFavList() {
  const box = $('#favList'); if (!box) return;
  const q = ($('#favSearch') ? $('#favSearch').value : '').trim();
  const favs = Store.data.favorites.map(getDestination).filter(Boolean);
  const section = (title, body) => `<p class="text-[12px] font-bold text-sub mt-4 mb-1">${title}</p><div class="divide-y divide-line">${body}</div>`;
  if (q) { const m = searchDestinations(q, 10); box.innerHTML = m.length ? section('검색 결과', m.map(favRowHTML).join('')) : '<p class="py-8 text-center text-[13px] text-sub">검색 결과가 없습니다.</p>'; return; }
  const popular = state.destinations.filter(d => d.kind === 'destination' && !favs.includes(d)).slice(0, 8);
  box.innerHTML = section(`내 즐겨찾기 ${favs.length}`, favs.length ? favs.map(favRowHTML).join('') : '<p class="py-4 text-[13px] text-sub">아직 없어요. 아래에서 별을 눌러 추가하세요.</p>') + section('등록된 목적지', popular.map(favRowHTML).join(''));
}
function openFavSheet() {
  Sheet.open(`<div class="flex items-start justify-between gap-3"><div><h3 class="text-[18px] font-extrabold">즐겨찾기 관리</h3><p class="text-[13px] text-sub mt-0.5">별을 누르면 탐색 화면 위쪽 바로가기에 추가돼요.</p></div>
      <button data-act="close-sheet" class="press w-11 h-11 rounded-full bg-card2 grid place-items-center shrink-0" aria-label="닫기"><i class="fa-solid fa-xmark text-sub" aria-hidden="true"></i></button></div>
    <div class="relative mt-4"><label for="favSearch" class="sr-only">목적지 검색</label><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-sub text-sm" aria-hidden="true"></i>
      <input id="favSearch" type="search" autocomplete="off" placeholder="목적지 검색 (예: 현대 판교)" class="w-full h-12 pl-10 pr-3 rounded-2xl bg-card2 border border-line text-[15px] outline-none" /></div>
    <div id="favList"></div>`, 'expanded');
  $('#favSearch').addEventListener('input', renderFavList); renderFavList();
}


/* =====================================================================
 * 13. EVENT HANDLERS
 * ===================================================================== */
function pickDefaultFacility(d) {
  const fs = facilitiesOf(d);
  return (fs.find(f => getLive(f.id)) || fs[0] || {}).id || null;
}
function selectDestination(id, { facilityId = null, silent = false } = {}) {
  const d = getDestination(id); if (!d) return;
  state.selectedDestId = id; state.pendingDestId = null;
  state.selectedFacilityId = facilityId && d.facilityIds.includes(facilityId) ? facilityId : pickDefaultFacility(d);
  state.draft = { parkingId: state.selectedFacilityId, floorId: null, status: null };
  Store.data.lastDestination = id;
  if (!silent) rememberDestination(id); else Store.save();
  renderExplore();
  if (state.tab !== 'explore' && !silent) switchTab('explore');
  if (!silent) window.scrollTo({ top: 0, behavior: 'smooth' });
  if (hasCoords(d) && !(state.nearby.destId === d.id && state.nearby.status === 'ok')) {
    loadNearbyParking(d).then(() => { if (state.selectedDestId === d.id) softRender(); });
  }
}
function selectFacility(fid) {
  const f = getFacility(fid); if (!f) return;
  if (f.external) { // 주변(외부) 주차장: 현재 목적지 화면 안에서 그 주차장 기준으로 표시
    if (!getDestination(state.selectedDestId)) { openFacilityPreview(fid); return; }
    state.selectedFacilityId = fid; state.draft = { parkingId: fid, floorId: null, status: null };
    renderExplore(); if (state.tab !== 'explore') switchTab('explore'); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  const d = destinationOfFacility(f);
  if (d && d.id === state.selectedDestId) {
    state.selectedFacilityId = fid; state.draft = { parkingId: fid, floorId: null, status: null };
    renderExplore(); if (state.tab !== 'explore') switchTab('explore'); window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (d) selectDestination(d.id, { facilityId: fid });
}

function switchTab(tab) {
  state.tab = tab;
  $$('.view').forEach(v => { const on = v.id === 'view-' + tab; v.classList.toggle('hidden', !on); if (on) { v.classList.remove('view'); void v.offsetWidth; v.classList.add('view'); } });
  $$('.tab-btn').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
  $('#fab').classList.toggle('hidden', tab !== 'explore');
  window.scrollTo(0, 0);
  if (tab === 'explore') renderExplore();
  if (tab === 'nearby') {
    renderNearby();
    setTimeout(() => { initMap(); if (state.map) { state.map.invalidateSize(); const c = refPoint(); state.map.setView([c.lat, c.lng], state.map.getZoom()); } }, 60);
    if (!state.geoAsked) { state.geoAsked = true; locate(true, { quiet: true }); }
  }
  if (tab === 'report') { if (!getFacility(state.draft.parkingId)) state.draft = { parkingId: state.selectedFacilityId, floorId: null, status: null }; renderReportView(); }
  if (tab === 'my') renderMy();
  try { history.replaceState(null, '', '#' + tab); } catch (e) { /* noop */ }
}

async function locate(fromNearby, { quiet = false } = {}) {
  if (state.geo.status === 'locating') return;
  if (!quiet) toast('현재 위치를 찾고 있어요', 'info');
  if (state.tab === 'nearby') $('#nearbyBanner').innerHTML = '<div class="mb-3 rounded-2xl p-3 flex items-center gap-3 bg-card border border-line"><i class="fa-solid fa-spinner fa-spin text-brand" aria-hidden="true"></i><p class="text-[12.5px]">현재 위치를 찾는 중이에요…</p></div>';
  const pos = await Geo.locate();
  if (!pos) {
    if (!quiet || state.geo.status === 'denied') toast('위치 권한을 사용할 수 없습니다', 'error');
    if (state.tab === 'nearby') renderNearby();
    return;
  }
  const nearest = state.facilities.filter(hasCoords).map(f => ({ f, d: distanceBetween(pos, f) })).sort((a, b) => a.d - b.d)[0];
  if (nearest && !quiet) toast(`가장 가까운 등록 주차장: ${nearest.f.shortName} (${fmtDist(nearest.d)})`);
  if (!fromNearby && nearest) selectFacility(nearest.f.id);
  if (state.tab === 'nearby') { renderNearby(); if (state.map) state.map.setView([pos.lat, pos.lng], 14); }
}
function applyTheme(t) { document.documentElement.dataset.theme = t; $('#themeIcon').className = `fa-solid ${t === 'dark' ? 'fa-sun' : 'fa-moon'}`; }
function setDemo(on) {
  if (!DEV_MODE) return; // Production 에서는 데모 불가
  Store.data.settings.demo = on; Store.save();
  Repository.loadReports();
  toast(on ? '데모 모드를 켰어요. 가상 수치가 표시됩니다' : '데모 모드를 껐어요', 'info');
  renderExplore(); if (state.tab === 'my') renderMy(); if (state.tab === 'nearby') renderNearby(); if (state.tab === 'report') renderReportView();
}

document.addEventListener('click', e => {
  if (!e.target.closest('#searchWrap')) hideSuggest();
  const el = e.target.closest('[data-act], [data-tab]');
  if (!el) return;
  const act = el.dataset.act || 'tab', id = el.dataset.id;
  switch (act) {
    case 'tab': Sheet.close(); switchTab(el.dataset.tab); break;
    case 'pick': { const q = $('#searchInput').value.trim(); if (q) rememberQuery(q); $('#searchInput').value = ''; $('#searchClear').classList.add('hidden'); hideSuggest(); $('#searchInput').blur(); selectDestination(id); break; }
    case 'use-query': $('#searchInput').value = el.dataset.q; scheduleExternalSearch(); renderSuggest(); $('#searchInput').focus(); break;
    case 'retry-search': PlaceSearchAdapter.cache.clear(); state.search = { q: '', external: null, status: 'idle' }; scheduleExternalSearch(); break;
    case 'pick-place': case 'pick-place-parking': {
      const p = state.search.external && state.search.external.places.find(x => x.id === id); if (!p) break;
      const q = $('#searchInput').value.trim(); if (q) rememberQuery(q);
      $('#searchInput').value = ''; $('#searchClear').classList.add('hidden'); hideSuggest(); $('#searchInput').blur();
      if (act === 'pick-place-parking') { let f = getFacility('pk-' + p.id); if (!f) { f = facilityFromPlace(p); state.facilities.push(f); } openFacilityPreview(f.id); break; }
      let d = getDestination('place-' + p.id);
      if (!d) { d = destinationFromPlace(p); state.destinations.push(d); }
      Store.data.placeSnapshots[d.id] = { id: d.id, kind: 'external', provider: d.provider, name: d.name, category: d.category, placeCategory: d.placeCategory, address: d.address, lat: d.lat, lng: d.lng, phone: d.phone, url: d.url, aliases: [], keywords: [], guide: null };
      const keys = Object.keys(Store.data.placeSnapshots); if (keys.length > 40) delete Store.data.placeSnapshots[keys[0]];
      selectDestination(d.id);
      break;
    }
    case 'nearby-expand': { const d = getDestination(state.selectedDestId); if (d) { loadNearbyParking(d, CONFIG.NEARBY_PARKING_RADIUS_MAX).then(softRender); renderExplore(); } break; }
    case 'nearby-retry': { const d = getDestination(state.selectedDestId); if (d) { NearbyParkingAdapter.cache.clear(); loadNearbyParking(d, state.nearby.radius || CONFIG.NEARBY_PARKING_RADIUS).then(softRender); renderExplore(); } break; }
    case 'scroll-nearby': document.getElementById('nearbyParking')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'goto': Sheet.close(); selectDestination(id); break;
    case 'facility': Sheet.close(); selectFacility(id); break;
    case 'clear-recent': Store.data.recentQueries = []; Store.data.recentDestinations = []; Store.save(); renderSuggest(); break;
    case 'fav': {
      const f = Store.data.favorites, on = f.includes(id);
      Store.data.favorites = on ? f.filter(x => x !== id) : [...f, id]; Store.save();
      renderExplore(); if (state.sheetOpen) renderFavList(); if (state.tab === 'my') renderMy();
      toast(on ? '즐겨찾기에서 뺐어요' : '즐겨찾기에 추가했어요'); break;
    }
    case 'fav-manage': openFavSheet(); break;
    case 'nav': openNavSheet(id); break;
    case 'nav-go': if (acquireLock('nav', 1200)) { const t = navTargetOf(id); if (t) openNavigation(el.dataset.app, t); Sheet.close(); } break;
    case 'open-report': state.draft = { parkingId: id || state.selectedFacilityId, floorId: null, status: null }; openReportSheet(); break;
    case 'draft-floor': state.draft.floorId = el.dataset.floor; renderReportForms(); break;
    case 'draft-status':
      if (!state.draft.floorId) { $$('.floor-row').forEach(r => { r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); }); toast('먼저 지금 계신 층을 선택하세요', 'warn'); break; }
      state.draft.status = el.dataset.status; renderReportForms(); break;
    case 'submit-report': {
      const d = state.draft;
      if (!getFacility(d.parkingId) || !d.floorId || !d.status) { toast('층과 상황을 모두 선택하세요', 'warn'); break; }
      if (!acquireLock('submit')) break;
      const rect = el.getBoundingClientRect();
      const res = submitReport({ parkingId: d.parkingId, floorId: d.floorId, status: d.status });
      if (state.sheetOpen) Sheet.close();
      state.draft = { parkingId: d.parkingId, floorId: null, status: null };
      renderExplore(); if (state.tab === 'report') renderReportView(); if (state.tab === 'my') renderMy(); else $('#myDot').classList.remove('hidden');
      if (res.pointsAwarded) { floatPoints(rect.left + rect.width / 2, rect.top, res.pointsAwarded); setTimeout(() => showReward(res), 300); }
      else toast(`제보가 저장됐어요. 같은 층 ${CONFIG.POINT_COOLDOWN_MIN}분 내 재제보라 포인트는 지급되지 않아요`, 'warn');
      break;
    }
    case 'scroll-alts': document.getElementById('alts')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'locate': locate(false); break;
    case 'locate-nearby': locate(true); break;
    case 'sort': state.nearbySort = el.dataset.sort; renderNearby(); break;
    case 'radius': state.nearbyRadius = +el.dataset.r; renderNearby(); break;
    case 'preview': openFacilityPreview(id); break;
    case 'retry-load': retryLoad(); break;
    case 'toggle-demo': setDemo(!Store.data.settings.demo); break;
    case 'toggle-theme': { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; Store.data.theme = t; Store.save(); applyTheme(t); if (state.tab === 'my') renderMy(); break; }
    case 'reset':
      if (confirm('포인트, 제보 내역, 뱃지, 즐겨찾기, 최근 검색이 모두 삭제돼요. 초기화할까요?')) {
        Store.reset(); Repository.loadReports(); renderMy(); renderChips(); toast('내 기록을 초기화했어요');
      }
      break;
    case 'sheet-toggle': if (!Sheet._justDragged || Date.now() - Sheet._justDragged > 400) Sheet.toggleSize(); break;
    case 'close-sheet': Sheet.close(); break;
    case 'close-reward': if (e.target === el || el.tagName === 'BUTTON') closeReward(); break;
  }
});
document.addEventListener('change', e => { if (e.target.dataset.change === 'draft-lot') { state.draft = { parkingId: e.target.value, floorId: null, status: null }; renderReportForms(); } });

const searchInput = $('#searchInput');
searchInput.addEventListener('focus', renderSuggest);
let searchTimer = null;
/** 외부 장소 검색 (debounce + 캐시 + 중복 호출 방지). 결과는 state.search 에 저장 후 재렌더 */
function scheduleExternalSearch() {
  const q = searchInput.value.trim();
  clearTimeout(searchTimer);
  if (!CONFIG.PLACE_SEARCH.enabled || q.length < CONFIG.PLACE_SEARCH.minChars) { state.search = { q, external: null, status: 'idle' }; return; }
  if (state.search.q === q && ['ok', 'loading'].includes(state.search.status)) return;
  state.search = { q, external: null, status: 'loading' };
  searchTimer = setTimeout(async () => {
    try {
      const r = await PlaceSearchAdapter.search(q, state.geo.pos || null);
      if (searchInput.value.trim() !== q) return;
      state.search = { q, external: r, status: 'ok' };
    } catch (e) {
      if (searchInput.value.trim() !== q) return;
      state.search = { q, external: null, status: 'error' };
    }
    if (!$('#suggest').classList.contains('hidden')) renderSuggest();
  }, CONFIG.PLACE_SEARCH.debounceMs);
}
searchInput.addEventListener('input', () => { scheduleExternalSearch(); renderSuggest(); });
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const first = $('#suggest [role="option"]'); if (first) first.click(); }
  if (e.key === 'Escape') { hideSuggest(); searchInput.blur(); }
});
$('#searchClear').addEventListener('click', e => { e.stopPropagation(); searchInput.value = ''; renderSuggest(); searchInput.focus(); });
let lastY = 0;
window.addEventListener('scroll', () => { const y = window.scrollY; $('#fab').classList.toggle('mini', y > 220 && y > lastY); lastY = y; }, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { Sheet.close(); closeReward(); } });


/* =====================================================================
 * 14. APP INITIALIZATION
 *  - 가상 수치의 실시간 변동 시뮬레이션은 하지 않습니다 (v5에서 제거)
 * ===================================================================== */
function softRender() {
  if (document.hidden || state.sheetOpen) return;
  if (state.tab === 'explore') renderExplore(); // 검색 제안 목록은 별도 요소라 영향 없음
  if (state.tab === 'nearby') renderNearby();
}
function refreshAgo() { $$('[data-ago]').forEach(el => (el.textContent = timeAgo(+el.dataset.ago))); }

async function loadLiveSources() {
  CONFIG.LIVE_SOURCES.forEach(s => { if (state.sources[s] !== 'ok') state.sources[s] = 'loading'; });
  softRender();
  await Promise.all(CONFIG.LIVE_SOURCES.map(s => Repository.loadLive(s)));
  if (state.pendingDestId) {
    if (getDestination(state.pendingDestId)) selectDestination(state.pendingDestId, { silent: true });
    else { state.pendingDestId = null; if (!getDestination(state.selectedDestId)) selectDestination(CONFIG.DEFAULT_DESTINATION, { silent: true }); }
  }
  if (state.tab === 'my') renderMy();
  if (state.tab === 'report') renderReportForms();
  if (state.sheetOpen && $('#favList')) renderFavList();
  softRender();
}
async function retryLoad() {
  if (!acquireLock('retry', 2000)) return;
  toast('다시 불러오는 중…', 'info');
  if (state.sources.REFERENCE !== 'ok') Repository.loadReference();
  await loadLiveSources();
  if (!getDestination(state.selectedDestId)) selectDestination(CONFIG.DEFAULT_DESTINATION, { silent: true });
  renderExplore();
}
function injectManifest() {
  try {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#0b1222"/><rect x="96" y="96" width="320" height="320" rx="84" fill="#4F7CFF"/><text x="256" y="338" font-size="230" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica" font-weight="900">P</text></svg>`;
    const icon = 'data:image/svg+xml,' + encodeURIComponent(svg);
    const manifest = { name: '파킹뷰 · 목적지별 주차 안내', short_name: '파킹뷰', lang: 'ko', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#0b1222', theme_color: '#0b1222', icons: [{ src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }] };
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' })); document.head.appendChild(link);
    ['icon', 'apple-touch-icon'].forEach(rel => { const l = document.createElement('link'); l.rel = rel; l.href = icon; document.head.appendChild(l); });
  } catch (e) { /* noop */ }
}
function init() {
  Store.load();
  applyTheme(Store.data.theme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  const hash = location.hash.slice(1);
  state.tab = ['explore', 'nearby', 'report', 'my'].includes(hash) ? hash : 'explore';
  renderExplore();

  Repository.loadReference();
  // 외부 검색으로 열었던 목적지 복원 (즐겨찾기·최근 목록)
  Object.values(Store.data.placeSnapshots || {}).forEach(s => { if (!getDestination(s.id)) state.destinations.push({ ...s, facilityIds: [], nearbyParkingIds: [] }); });
  Repository.loadReports();
  const last = Store.data.lastDestination;
  if (last && getDestination(last)) selectDestination(last, { silent: true });
  else if (last && String(last).startsWith('seoul-')) { state.pendingDestId = last; }
  else selectDestination(CONFIG.DEFAULT_DESTINATION, { silent: true });

  switchTab(state.tab);
  loadLiveSources();
  setInterval(refreshAgo, 10000);
  setInterval(() => { if (!document.hidden) Promise.all(CONFIG.LIVE_SOURCES.map(s => Repository.loadLive(s))).then(softRender); }, CONFIG.SEOUL_REFRESH_MS);
  injectManifest();
}
document.addEventListener('DOMContentLoaded', init);
</script>
